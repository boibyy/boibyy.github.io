<style>
:root{
  --blue:#1e90ff;
  --muted:#6b7280;
  --card-bg:#fff;
  --page-pad:36px;
}

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  background:#f3f4f6;
  color:#0f172a;
}

#priceDisplay {
  font-size: 24px;
  font-weight: bold;
}

header{
  background:#0b1220;
  color:#fff;
  padding:16px var(--page-pad);
  text-align:left;
  display:flex;
  align-items:center;
  gap:16px;
}
header h1{
  font-size:22px;
  margin:0;
  font-weight:600;
}

main{padding:28px var(--page-pad); max-width:1200px; margin:0 auto;}

.filter-container {
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.filter-container label {
  font-weight: 600;
  font-size: 15px;
}

.filter-select {
  padding: 8px 16px;
  border-radius: 8px;
  border: 2px solid rgba(15,23,42,0.1);
  background: white;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  cursor: pointer;
  min-width: 180px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  align-items:stretch;
}

.card{
  background:var(--card-bg);
  border-radius:14px;
  padding:18px;
  box-shadow:0 8px 24px rgba(2,6,23,0.06);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.card img{ width:140px; height:140px; object-fit:contain; margin-bottom:14px; }
.card h3{ margin:0; font-size:18px; font-weight:600; }
.card .start{ margin-top:8px; color:var(--muted); font-size:14px; }

.subpage{
  display:none;
  max-width:900px;
  margin:0 auto;
  padding-top:18px;
}
.sub-inner{
  background:var(--card-bg);
  border-radius:14px;
  padding:26px;
  box-shadow:0 10px 30px rgba(2,6,23,0.06);
}
.backbtn{
  display:inline-block;
  margin-bottom:18px;
  color:var(--blue);
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.model-top{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.model-art{ width:320px; max-width:38%; min-width:210px; }
.model-art img{ width:100%; border-radius:10px; object-fit:cover; }
.model-info{ flex:1; min-width:220px; }
.model-info h2{ margin:0; font-size:26px; font-weight:700; }

.options-row{ margin-top:18px; }
.options-row label{ display:block; font-weight:600; margin-bottom:10px; font-size:15px; }
.options-container{
  display:flex; 
  gap:12px; 
  flex-wrap:wrap; 
  align-items:center;
}
.option-card{
  padding:10px 14px;
  border-radius:12px;
  border:2px solid rgba(15,23,42,0.06);
  background:#fff;
  cursor:pointer;
  user-select:none;
  font-weight:500;
  font-size:15px;
  min-width:96px;
  text-align:center;
}
.option-card.selected{
  border-color:var(--blue);
  background:#eaf3ff;
}
.option-card.disabled{
  opacity:0.45;
  cursor:not-allowed;
  transform:none;
}

.spec-section {
  font-weight:500;
  font-size: 20px;
  margin-top: 12px;
}

.spec-item {
  font-weight:500;
  font-size: 15px;
  margin-left: 8px;
}

@media (max-width:880px){
  .model-top{ flex-direction:column; }
  .model-art{ width:100%; max-width:100%; }
  .filter-container {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

const grid = document.getElementById('grid');
const legacyGrid = document.getElementById('legacyGrid');
const subpage = document.getElementById('subpage');
const subinner = document.getElementById('subinner');
const modelFilter = document.getElementById('modelFilter');

function createCard(p, idx){
  const startPrice = Math.min(...p.variants.filter(v=>v.price).map(v=>v.price));
  const card = document.createElement('div');
  card.className='card';
  const modelNum = p.name.replace('iPhone ','').replace(/\s+/g,''); 
  const imgSrc = `iphone/${modelNum}.jpg`;
  
  card.innerHTML=`
    <img src="${imgSrc}" alt="${p.name}">
    <h3>${p.name}</h3>
    <div class="start">Starting at $${startPrice} AUD</div>
  `;
  card.onclick=()=>openModel(idx);
  return card;
}

// Helper function to get starting price for sorting
function getStartingPrice(product) {
  const validPrices = product.variants.filter(v => v.price !== null).map(v => v.price);
  return validPrices.length > 0 ? Math.min(...validPrices) : Infinity;
}

// Helper function to get release date for sorting (convert to sortable number)
function getReleaseDateValue(product) {
  if (!product.release) return Infinity; // Fallback for products without date
  // Convert to YYYYMM format for proper sorting (e.g., Sept 2025 = 202509)
  return product.release.year * 100 + product.release.month;
}

// Helper function to generate specs HTML
function generateSpecsHTML(modelName) {
  const specs = SPECIFICATIONS[modelName];
  if (!specs) return '<div class="spec-item">Specifications coming soon</div>';
  
  let html = '';
  specs.forEach(specSection => {
    html += `<div class="spec-section">${specSection.section}</div>`;
    specSection.items.forEach(item => {
      html += `<div class="spec-item">- ${item}</div>`;
    });
  });
  return html;
}

// Sort functions for different filter options
function sortProducts(products, filterType) {
  const sorted = [...products];
  
  switch(filterType) {
    case 'lowest':
      return sorted.sort((a, b) => getStartingPrice(a) - getStartingPrice(b));
    
    case 'highest':
      return sorted.sort((a, b) => getStartingPrice(b) - getStartingPrice(a));
    
    case 'oldest':
      return sorted.sort((a, b) => getReleaseDateValue(a) - getReleaseDateValue(b));
    
    case 'newest':
      return sorted.sort((a, b) => getReleaseDateValue(b) - getReleaseDateValue(a));
    
    case 'default':
    default:
      // For default, we maintain the original order as defined in PRODUCTS
      return sorted.sort((a, b) => {
        // Find original indices
        const indexA = PRODUCTS.findIndex(p => p.name === a.name);
        const indexB = PRODUCTS.findIndex(p => p.name === b.name);
        return indexA - indexB;
      });
  }
}

// Function to rebuild grids with sorted products
function rebuildGrids() {
  const filterType = modelFilter.value;
  
  // Clear current grids
  grid.innerHTML = '';
  legacyGrid.innerHTML = '';
  
  // Separate current and legacy models
  const currentModels = PRODUCTS.filter(p => !p.legacy);
  const legacyModels = PRODUCTS.filter(p => p.legacy);
  
  // Sort each category separately
  const sortedCurrent = sortProducts(currentModels, filterType);
  const sortedLegacy = sortProducts(legacyModels, filterType);
  
  // Build current models grid
  sortedCurrent.forEach((p, i) => {
    const originalIndex = PRODUCTS.findIndex(product => product.name === p.name);
    grid.appendChild(createCard(p, originalIndex));
  });
  
  // Build legacy models grid
  sortedLegacy.forEach((p, i) => {
    const originalIndex = PRODUCTS.findIndex(product => product.name === p.name);
    legacyGrid.appendChild(createCard(p, originalIndex));
  });
}

// Initial grid setup
rebuildGrids();

// Event listener for filter change
modelFilter.addEventListener('change', rebuildGrids);

function openModel(idx){
  const p = PRODUCTS[idx];
  grid.style.display='none';
  legacyGrid.style.display='none';
  subpage.style.display='block';

  let capCards = p.variants.map((v,i)=>{
    if(v.price===null) return `<div class="option-card disabled">${v.cap}<div style="font-size:12px;color:#9aa4b2;margin-top:6px">NO STOCK</div></div>`;
    return `<div class="option-card" data-idx="${i}">${v.cap}</div>`;
  }).join('');

  let colorCards = p.colors.map((c,i)=>`<div class="option-card" data-idx="${i}">${c.name}</div>`).join('');

  const firstColor = p.colors[0].name.replace(/\s+/g,'').replace(/[()]/g,'');
  const modelNum = p.name.replace('iPhone ','').replace(/\s+/g,''); 
  const imgSrc = `iphone/${modelNum}_${firstColor}.jpg`;

  // Generate specs HTML
  const specsHTML = generateSpecsHTML(p.name);

  subinner.innerHTML=`
    <div class="backbtn" id="backbtn">← Back to all models</div>
    <div class="model-top">
      <div class="model-art"><img src="${imgSrc}" alt="${p.name}"></div>
      <div class="model-info">
        <h2>${p.name}</h2>
        <div class="options-row"><label>Capacity</label><div class="options-container" id="capContainer">${capCards}</div></div>
        <div class="options-row"><label>Colour</label><div class="options-container" id="colContainer">${colorCards}</div></div>
        <div class="options-row"><label>Total Price</label>
          <div class="options-container" id="priceDisplay">$0 AUD</div>
        </div>
        <div class="options-row"><label>Quick Specs</label>
          ${specsHTML}
        </div>
      </div>
    </div>
  `;

  document.getElementById('backbtn').onclick = ()=>{
    subpage.style.display='none'; 
    grid.style.display='grid'; 
    legacyGrid.style.display='grid';
  };

  const capContainer = document.getElementById('capContainer');
  const colContainer = document.getElementById('colContainer');
  const priceDisplay = document.getElementById('priceDisplay');

  let selectedCap = Array.from(capContainer.children).find(c=>!c.classList.contains('disabled'));
  if(selectedCap) selectedCap.classList.add('selected');
  colContainer.children[0].classList.add('selected');

  function markSelected(container,idx){
    Array.from(container.children).forEach((el,i)=>{
      el.classList.toggle('selected', i===idx && !el.classList.contains('disabled'));
    });
  }

  function updatePrice(){
  const capIdx = Array.from(capContainer.children).findIndex(c=>c.classList.contains('selected'));
  const colIdx = Array.from(colContainer.children).findIndex(c=>c.classList.contains('selected'));
  if(capIdx < 0 || colIdx < 0) return;

  const is7Series = (p.name === "iPhone 7" || p.name === "iPhone 7 Plus");
  const selectedColor = p.colors[colIdx].name;

  if (is7Series) {
    const isRestrictedColor = (selectedColor === "Jet Black" || selectedColor === "PRODUCT(RED)");

    const capCards = Array.from(capContainer.children);
    const cap32 = capCards[0];

    // Disable 32GB for Jet Black / PRODUCT(RED)
    if (isRestrictedColor) {
      cap32.classList.add("disabled");

      // If 32GB was selected, jump to 128GB
      if (cap32.classList.contains("selected")) {
        cap32.classList.remove("selected");
        capCards[1].classList.add("selected"); // 128GB
      }
    } 
    else {
      // Re-enable 32GB for other colours
      cap32.classList.remove("disabled");
    }
  }

  const newCapIdx = Array.from(capContainer.children).findIndex(c=>c.classList.contains('selected'));

  const base = p.variants[newCapIdx].price || 0;
  const extra = p.colors[colIdx].extra || 0;
  priceDisplay.textContent = `$${base + extra} AUD`;

  const newColor = p.colors[colIdx].name.replace(/\s+/g,'').replace(/[()]/g,'');
  const modelNum = p.name.replace('iPhone ','').replace(/\s+/g,''); 
  const img = subinner.querySelector('.model-art img');
  img.src = `iphone/${modelNum}_${newColor}.jpg`;
}

  capContainer.addEventListener('click', e=>{
    const card = e.target.closest('.option-card');
    if(!card || card.classList.contains('disabled')) return;
    markSelected(capContainer, Array.from(capContainer.children).indexOf(card));
    updatePrice();
  });

  colContainer.addEventListener('click', e=>{
    const card = e.target.closest('.option-card');
    if(!card || card.classList.contains('disabled')) return;
    markSelected(colContainer, Array.from(colContainer.children).indexOf(card));
    updatePrice();
  });

  updatePrice();
}
const headings = document.querySelectorAll('main > h2');

function updateHeadings() {
  const subVisible = document.getElementById('subpage').style.display === 'block';
  headings.forEach(h => h.style.display = subVisible ? 'none' : '');
}

updateHeadings();

const observer = new MutationObserver(updateHeadings);
observer.observe(document.getElementById('subpage'), { attributes: true, attributeFilter: ['style'] });

</script>
</body>
</html>
