<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Australia Apple Store Database</title>
  <style>
    :root{
      --c-bg:#f6f7f9;
      --c-panel:#ffffff;
      --c-contrast:#0b1220;
      --c-muted:#5b6770;
      --c-border:#e6e9ec;
      --c-blue:#335fff;
      --c-green:#149b6c;
      --c-purple:#9b59b6;
      --c-red:#e74c3c;
      --c-orange:#f39c12;
      --card-width:480px; 
      --card-min-height:420px;

      --modal-max-width:640px; 
      --modal-img-width:520px; 
      --modal-img-height:240px;
      --timeline-gap:26px;
      --timeline-item-bg:#fbfdff;
      --timeline-divider:rgba(11,18,32,0.06);
    }
    *{box-sizing:border-box}
    body{font-family:var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial);margin:24px;background:var(--c-bg);color:var(--c-contrast)}
    .header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .header h1{margin:0;font-size:20px}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    .controls select,input{padding:8px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-panel);color:var(--c-contrast)}
    
    .time-travel{display:flex;align-items:center;gap:8px;margin-bottom:18px;padding:12px;background:var(--c-panel);border-radius:8px;border:1px solid var(--c-border)}
    .time-travel label{font-weight:600;font-size:14px}
    .time-travel input{padding:8px;border-radius:8px;border:1px solid var(--c-border)}
    .time-travel button{padding:8px 12px;border-radius:8px;border:none;background:var(--c-blue);color:#fff;cursor:pointer}
    .time-travel .reset{padding:8px 12px;border-radius:8px;border:1px solid var(--c-border);background:transparent;color:var(--c-contrast);cursor:pointer}

    .grid{display:grid;gap:18px;justify-content:center;align-content:start;grid-auto-rows:1fr;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
    @media(min-width:1100px){
      .grid{grid-template-columns:repeat(auto-fill, var(--card-width));}
    }

    .card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:var(--card-min-height);box-shadow:0 6px 20px rgba(11,18,32,0.06);width:100%;max-width:var(--card-width)}
    .card .img{width:100%;height:220px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;position:relative}
    .card .img img{width:100%;height:100%;object-fit:cover;display:block}
    .card .img .placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--c-muted);font-size:14px;background:var(--c-bg)}
    .card .content{padding:14px;flex:1;display:flex;flex-direction:column}
    .title{font-size:16px;margin:0 0 6px;color:var(--c-contrast);font-weight:600}
    .meta{color:var(--c-muted);font-size:13px;margin-bottom:8px}
    .meta .small{display:block;color:var(--c-muted);font-size:12px;margin-top:6px}
    .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .tag{padding:6px 10px;border-radius:999px;font-size:12px;color:#fff}
    .tag.classic{background:var(--c-muted);color:#fff}
    .tag.upgraded{background:var(--c-blue)}
    .tag.vintaged{background:var(--c-green)}
    .tag.vintagee{background:var(--c-purple)}
    .tag.historic{background:#7f8c8d}
    .tag.temp{background:var(--c-red)}
    .tag.closing{background:var(--c-orange)}
    .tag.closed-renovation{background:var(--c-red)}
    .tag.closed-permanent{background:var(--c-red)}
    .actions{margin-top:auto;display:flex;gap:8px;align-items:center}
    .actions button{padding:8px 10px;border-radius:8px;border:none;cursor:pointer}
    .button-primary{background:var(--c-blue);color:#fff}
    .button-ghost{background:transparent;border:1px solid var(--c-border);color:var(--c-contrast)}

    .modal{position:fixed;inset:0;background:rgba(11,18,32,0.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:2000}
    .modal.open{display:flex}
    .modal-card{background:var(--c-panel);width:100%;max-width:var(--modal-max-width);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(11,18,32,0.35)}
    .modal-header{padding:14px;border-bottom:1px solid var(--c-border);text-align:center}
    .modal-header h2{margin:0;font-size:18px}
    .modal-body{padding:14px;max-height:62vh;overflow:auto}
    .timeline-list{display:flex;flex-direction:column;gap:var(--timeline-gap);padding:8px 0}

    .timeline-item{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:linear-gradient(180deg,var(--timeline-item-bg),#fff);border:1px solid var(--timeline-divider)}
    .timeline-item + .timeline-item{margin-top:6px}

    .timeline-item .label{font-size:16px;font-weight:700;color:var(--c-contrast)}
    .timeline-item .date{font-size:13px;color:var(--c-muted)}
    .timeline-item .note{color:var(--c-muted);font-size:14px}
    .timeline-item img{width:100%;max-width:var(--modal-img-width);height:var(--modal-img-height);object-fit:cover;border-radius:6px;border:1px solid var(--c-border)}

    .modal-footer{padding:10px 14px;border-top:1px solid var(--c-border);display:flex;justify-content:center}
    .close-btn{padding:8px 12px;border-radius:8px;background:var(--c-blue);border:none;color:#fff;cursor:pointer}

    .footer{margin-top:18px;color:var(--c-muted);font-size:13px}

    @media(max-width:700px){.card{min-height:360px}.card .img{height:180px}.timeline-item img{height:160px;max-width:100%}}
  </style>
</head>
<body>
  <div class="header">
    <h1>Australia Apple Store Database</h1>
    <div id="storeCount" style="color:var(--c-muted);font-size:13px">Loading…</div>
    <div class="controls">
      <select id="filterType"><option value="all">All design types</option></select>
      <select id="filterState"><option value="all">All states</option></select>
      <select id="sortBy"><option value="name">Sort: Name</option><option value="opened">Sort: Open date (oldest)</option><option value="opened_desc">Sort: Open date (newest)</option><option value="renovated_desc">Sort: Most recent update</option><option value="state">Sort: State</option></select>
      <input id="search" type="search" placeholder="Search name or code" />
    </div>
  </div>

  <div class="time-travel">
    <label for="timeTravelDate">View stores as of:</label>
    <input type="month" id="timeTravelDate" min="2008-01" max="2025-12" value="2025-11">
    <button id="timeTravelBtn">Time Travel</button>
    <button id="resetTimeTravel" class="reset">Reset to Present</button>
    <span id="timeTravelStatus" style="margin-left:auto;color:var(--c-muted);font-size:13px"></span>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="footer">Reference date: November 6, 2025.</div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" role="document">
      <div class="modal-header"><h2 id="modalTitle">Store timeline</h2></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer"><button class="close-btn" id="modalClose">Close</button></div>
    </div>
  </div>

  <script>
    const STORES = [
      {"name":"Chatswood Chase","code":"R253","state":"NSW","design":"Modern (Vintage E)","timeline":[
        {"date":"2008-08-09","label":"Opened", "design": "Classic"},
        {"date":"2013-02-23","label":"Resized / Reopened", "design": "Classic"},
        {"date":"2024-07-08","label":"Closed for Renovation","note":"Closed for renovation until October 2025"},
        {"date":"2025-10-30","label":"Reopened","note":"Video Wall, Pickup Counter, Alcoves; Modern Vintage E", "design": "Modern (Vintage E)"}
      ]},
      {"name":"Doncaster","code":"R342","state":"QLD","design":"Classic","timeline":[{"date":"2009-05-23","label":"Opened"}]},
      {"name":"Chermside","code":"R384","state":"QLD","design":"Classic","timeline":[{"date":"2009-11-14","label":"Opened"}]},
      {"name":"Castle Towers","code":"R344","state":"NSW","design":"Classic","timeline":[{"date":"2010-08-19","label":"Opened"}]},
      {"name":"Charlestown","code":"R385","state":"NSW","design":"Classic","timeline":[{"date":"2010-10-21","label":"Opened"}]},
      {"name":"Penrith","code":"R440","state":"NSW","design":"Classic","timeline":[{"date":"2011-07-23","label":"Opened"}]},
      {"name":"Southland","code":"R343","state":"VIC","design":"Classic","timeline":[{"date":"2011-08-13","label":"Opened"}]},
      {"name":"Canberra","code":"R483","state":"ACT","design":"Classic","timeline":[{"date":"2012-09-08","label":"Opened"}]},
      {"name":"Booragoon","code":"R508","state":"WA","design":"Classic","timeline":[{"date":"2012-09-08","label":"Opened"}]},
      {"name":"Brisbane City","code":"R466","state":"QLD","design":"Classic","timeline":[{"date":"2014-01-17","label":"Opened","note":"Historic Building"}]},

      {"name":"Sydney","code":"R238","state":"NSW","design":"Upgraded Classic","timeline":[
        {"date":"2008-06-19","label":"Opened", "design": "Classic"},
        {"date":"2020-01-05","label":"Closed for Renovation","note":"Closed for renovation until May 2020"},
        {"date":"2020-05-28","label":"Reopened","note":"Video Wall, New Ceilings, Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Bondi","code":"R254","state":"NSW","design":"Upgraded Classic","timeline":[
        {"date":"2010-05-28","label":"Opened", "design": "Classic"},
        {"date":"2019-03-01","label":"Closed for Renovation","note":"Closed for renovation until June 2019"},
        {"date":"2019-06-29","label":"Reopened","note":"Video Wall, Green Wall, Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Broadway","code":"R523","state":"NSW","design":"Upgraded Classic","timeline":[
        {"date":"2012-06-30","label":"Opened", "design": "Classic"},
        {"date":"2019-05-01","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Carindale","code":"R509","state":"QLD","design":"Upgraded Classic","timeline":[
        {"date":"2012-08-25","label":"Opened", "design": "Classic"},
        {"date":"2019-07-01","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Fountain Gate","code":"R530","state":"QLD","design":"Upgraded Classic","timeline":[
        {"date":"2012-12-15","label":"Opened", "design": "Classic"},
        {"date":"2019-10-23","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Rundle Place","code":"R405","state":"SA","design":"Upgraded Classic","timeline":[
        {"date":"2013-05-25","label":"Opened", "design": "Classic"},
        {"date":"2018-11-07","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Miranda","code":"R606","state":"NSW","design":"Upgraded Classic","timeline":[
        {"date":"2015-07-25","label":"Opened", "design": "Classic"},
        {"date":"2019-08-08","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},
      {"name":"Highpoint","code":"R504","state":"VIC","design":"Upgraded Classic","timeline":[
        {"date":"2013-04-27","label":"Opened", "design": "Classic"},
        {"date":"2019-04-01","label":"Reopened","note":"Video Wall + Forum Installed", "design": "Upgraded Classic"}
      ]},

      {"name":"Chadstone","code":"R180","state":"VIC","design":"Modern (Vintage D)","timeline":[
        {"date":"2008-09-13","label":"Opened", "design": "Classic"},
        {"date":"2017-11-24","label":"Moved & Reopened","note":"Modern Vintage D", "design": "Modern (Vintage D)"}
      ]},
      {"name":"Robina","code":"R351","state":"QLD","design":"Modern (Vintage D)","timeline":[
        {"date":"2009-05-09","label":"Opened", "design": "Classic"},
        {"date":"2018-09-29","label":"Moved & Reopened","note":"Modern Vintage D", "design": "Modern (Vintage D)"}
      ]},
      {"name":"Perth City","code":"R386","state":"WA","design":"Modern (Vintage E)","timeline":[
        {"date":"2010-06-26","label":"Opened", "design": "Classic"},
        {"date":"2025-06-27","label":"Moved & Reopened","note":"Modern Vintage E; Historic Building", "design": "Modern (Vintage E)"}
      ]},
      {"name":"Hornsby","code":"R458","state":"NSW","design":"Classic","timeline":[
        {"date":"2011-09-24","label":"Opened"},
        {"date":"2025-10-04","label":"Closed","note":"Closed on Oct 4, 2025"}
      ]}
    ];

    // Global variables
    let currentDate = new Date('2025-11-06T12:00:00Z');
    let isTimeTravelMode = false;

    function primaryImagePath(code) {
      return `https://rtlimages.apple.com/cmc/dieter/store/16_9/${code}.png?resize=1440:806`;
    }
    
    function oldImagePath(code, idx) {
      return `${code}_old${idx===1?'':idx}.jpg`;
    }

    function parseDate(d){return d?new Date(d+'T00:00:00Z'):null}
    
    function timeAgoDisplay(d){
      if(!d) return '';
      const ms = 1000*60*60*24;
      const delta = Math.floor((d - currentDate)/ms); 
      const abs = Math.abs(delta);
      const years = Math.floor(abs/365);
      if(years>=1) return delta>0 ? `in ${years} year${years>1?'s':''}` : `${years} year${years>1?'s':''} ago`;
      const months = Math.floor(abs/30);
      if(months>=1) return delta>0 ? `in ${months} month${months>1?'s':''}` : `${months} month${months>1?'s':''} ago`;
      return delta>0 ? `in ${abs} day${abs>1?'s':''}` : `${abs} day${abs>1?'s':''} ago`;
    }

    // Check if store is closed at a specific date
    function isStoreClosed(store, targetDate) {
      // Check for permanent closure
      const permanentClosure = store.timeline.find(event => 
        event.label.toLowerCase().includes('closed') && 
        !event.label.toLowerCase().includes('renovation') &&
        event.date && parseDate(event.date) <= targetDate
      );
      
      if (permanentClosure) {
        return { type: 'permanent', date: parseDate(permanentClosure.date) };
      }
      
      // Check for renovation closure
      const renovationClosures = store.timeline.filter(event => 
        (event.label.toLowerCase().includes('closed for renovation') || 
         (event.label.toLowerCase().includes('closed') && event.note && event.note.toLowerCase().includes('renovation'))) &&
        event.date && parseDate(event.date) <= targetDate
      );
      
      if (renovationClosures.length > 0) {
        // Find the most recent renovation closure that hasn't been reopened yet
        for (let i = renovationClosures.length - 1; i >= 0; i--) {
          const closure = renovationClosures[i];
          const closureIndex = store.timeline.indexOf(closure);
          const nextEvent = store.timeline[closureIndex + 1];
          
          // If there's no next event or the next event is after target date, store is still closed
          if (!nextEvent || (nextEvent.date && parseDate(nextEvent.date) > targetDate)) {
            return { type: 'renovation', date: parseDate(closure.date) };
          }
        }
      }
      
      return null;
    }

    // Get store state at a specific date
    function getStoreAtDate(store, targetDate) {
      // Check if store is closed
      const closureInfo = isStoreClosed(store, targetDate);
      if (closureInfo) {
        return {
          ...store,
          isClosed: true,
          closureType: closureInfo.type,
          closureDate: closureInfo.date,
          timeline: store.timeline.filter(event => 
            event.date && parseDate(event.date) <= targetDate
          ),
          imagePath: primaryImagePath(store.code) // Use Apple CDN even for closed stores
        };
      }
      
      // Filter timeline to events that happened on or before target date
      const relevantEvents = store.timeline.filter(event => 
        event.date && parseDate(event.date) <= targetDate
      );
      
      if (relevantEvents.length === 0) {
        return null; // Store didn't exist yet
      }
      
      // Get the last event before target date
      const lastEvent = relevantEvents[relevantEvents.length - 1];
      const eventIndex = store.timeline.indexOf(lastEvent);
      
      // Determine design based on the last event's design property, or fall back to store design
      let design = lastEvent.design || store.design;
      
      // Calculate the correct image index
      // The current state is always index 0 (primary image)
      // Each previous state gets an incrementing index: _old, _old2, _old3, etc.
      const imageIndex = store.timeline.length - 1 - eventIndex;
      let imagePath;
      
      if (imageIndex === 0) {
        // Current state - use Apple CDN
        imagePath = primaryImagePath(store.code);
      } else {
        // Historical state - use local old images
        imagePath = oldImagePath(store.code, imageIndex);
      }
      
      return {
        ...store,
        timeline: relevantEvents,
        design: design,
        imagePath: imagePath,
        lastEventDate: parseDate(lastEvent.date),
        isClosed: false,
        eventIndex: eventIndex
      };
    }

    const grid=document.getElementById('grid');
    const filterType=document.getElementById('filterType');
    const filterState=document.getElementById('filterState');
    const sortBy=document.getElementById('sortBy');
    const search=document.getElementById('search');
    const storeCount=document.getElementById('storeCount');
    const timeTravelDate=document.getElementById('timeTravelDate');
    const timeTravelBtn=document.getElementById('timeTravelBtn');
    const resetTimeTravel=document.getElementById('resetTimeTravel');
    const timeTravelStatus=document.getElementById('timeTravelStatus');

    // populate filters
    const types=Array.from(new Set(STORES.map(s=>s.design))).sort(); 
    types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;filterType.appendChild(o)});
    const states=Array.from(new Set(STORES.map(s=>s.state))).sort(); 
    states.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;filterState.appendChild(o)});

    function latestRenovation(store){const dated=store.timeline.filter(e=>e.date).map(e=>parseDate(e.date));if(!dated.length) return null;return new Date(Math.max(...dated.map(d=>d.getTime())))}
    
    function designTagFor(design){const d=design.toLowerCase();if(d.includes('upgraded')) return {class:'upgraded',label:design}; if(d.includes('vintage d')) return {class:'vintaged',label:design}; if(d.includes('vintage e')) return {class:'vintagee',label:design}; return {class:'classic',label:design};}
    
    function statusTagsFor(store){const tags=[]; if(store.timeline.some(e=>/historic/i.test((e.note||'')+e.label))) tags.push({class:'historic',label:'Historic Building'}); if(store.timeline.some(e=>/temp/i.test((e.label||'')+(e.note||'')))) tags.push({class:'temp',label:'Temp Closed'}); const closing = store.timeline.find(e=>/closed/i.test((e.label||'')+(e.note||''))||/closed/i.test((e.label||'')+(e.note||''))); if(closing) tags.push({class:'closing',label:closing.note||closing.label}); return tags}

    function render(){
      const q=search.value.trim().toLowerCase();
      let list = STORES.slice();
      
      // Apply time travel filter if active
      if (isTimeTravelMode) {
        list = list.map(store => getStoreAtDate(store, currentDate))
                   .filter(store => store !== null); // Remove stores that didn't exist yet
      }
      
      // Apply other filters
      if(filterType.value!=='all') list=list.filter(s=>s.design===filterType.value);
      if(filterState.value!=='all') list=list.filter(s=>s.state===filterState.value);
      if(q) list=list.filter(s=> (s.name+" "+s.code).toLowerCase().includes(q));
      
      // Apply sorting
      if(sortBy.value==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
      else if(sortBy.value==='opened') list.sort((a,b)=> new Date(a.timeline[0].date) - new Date(b.timeline[0].date));
      else if(sortBy.value==='opened_desc') list.sort((a,b)=> new Date(b.timeline[0].date) - new Date(a.timeline[0].date));
      else if(sortBy.value==='renovated_desc') list.sort((a,b)=> (latestRenovation(b)||0) - (latestRenovation(a)||0));
      else if(sortBy.value==='state') list.sort((a,b)=> a.state.localeCompare(b.state) || a.name.localeCompare(b.name));

      grid.innerHTML=''; 
      
      // Update store count with time travel context
      if (isTimeTravelMode) {
        storeCount.textContent = `${list.length} store(s) existed — total ${STORES.length}`;
        timeTravelStatus.textContent = `Viewing stores as of ${currentDate.toLocaleDateString('en-GB', {month: 'long', year: 'numeric'})}`;
      } else {
        storeCount.textContent = `${list.length} store(s) shown — total ${STORES.length}`;
        timeTravelStatus.textContent = '';
      }

      list.forEach(storeData=>{
        const card=document.createElement('article'); 
        card.className='card';
        
        const imgWrap=document.createElement('div'); 
        imgWrap.className='img';
        
        const placeholder = document.createElement('div');
        placeholder.className = 'placeholder';
        
        // Set appropriate placeholder text based on closure status
        if (storeData.isClosed) {
          if (storeData.closureType === 'permanent') {
            placeholder.textContent = 'Closed Permanently';
          } else {
            placeholder.textContent = 'Closed for Renovation';
          }
        } else {
          placeholder.textContent = storeData.code;
        }
        
        imgWrap.appendChild(placeholder);
        
        const img = document.createElement('img');
        img.alt = storeData.name;
        img.onload = () => {
          if (placeholder.parentNode) {
            placeholder.remove();
          }
          imgWrap.appendChild(img);
        };
        img.onerror = () => {
          // Keep placeholder with appropriate text
        };
        
        // Use appropriate image based on time travel mode and closure status
        if (storeData.isClosed) {
          // For closed stores, we'll use the Apple CDN image but show placeholder text
          img.src = primaryImagePath(storeData.code);
        } else {
          img.src = isTimeTravelMode ? storeData.imagePath : primaryImagePath(storeData.code);
        }

        const content=document.createElement('div'); 
        content.className='content';
        
        const tagsDiv=document.createElement('div'); 
        tagsDiv.className='tags';
        
        // Handle tags based on closure status
        if (storeData.isClosed) {
          if (storeData.closureType === 'permanent') {
            const closedTag = document.createElement('div');
            closedTag.className = 'tag closed-permanent';
            closedTag.textContent = 'Closed';
            tagsDiv.appendChild(closedTag);
          } else {
            const renovationTag = document.createElement('div');
            renovationTag.className = 'tag closed-renovation';
            renovationTag.textContent = 'Closed for Renovation';
            tagsDiv.appendChild(renovationTag);
          }
        } else {
          // Show normal design tag if not closed
          const dtag=designTagFor(storeData.design); 
          const dt=document.createElement('div'); 
          dt.className='tag '+dtag.class; 
          dt.textContent=dtag.label; 
          tagsDiv.appendChild(dt);
          
          // Show other status tags
          const status=statusTagsFor(storeData); 
          status.forEach(s=>{ 
            const el=document.createElement('div'); 
            el.className='tag '+s.class; 
            el.textContent=s.label; 
            tagsDiv.appendChild(el)
          });
        }

        const title=document.createElement('h3'); 
        title.className='title'; 
        title.textContent = `${storeData.name} — ${storeData.code}`;
        
        const opened = storeData.timeline[0] && storeData.timeline[0].date ? parseDate(storeData.timeline[0].date) : null;
        const meta=document.createElement('div'); 
        meta.className='meta';
        
        // last renovated/moved
        const lastRen = latestRenovation(storeData);
        const lastRenText = lastRen ? lastRen.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}) : '-';
        
        // Handle meta information based on closure status
        if (storeData.isClosed) {
          if (storeData.closureType === 'permanent') {
            meta.innerHTML = `${storeData.state} • Closed Permanently <br>Opened ${opened? opened.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}) : '—'} ${opened?`(${timeAgoDisplay(opened)})`:''}`;
          } else {
            meta.innerHTML = `${storeData.state} • Closed for Renovation <br>Opened ${opened? opened.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}) : '—'} ${opened?`(${timeAgoDisplay(opened)})`:''}`;
          }
        } else {
          meta.innerHTML = `${storeData.state} • ${storeData.design} <br>Opened ${opened? opened.toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}) : '—'} ${opened?`(${timeAgoDisplay(opened)})`:''}`;
        }
        
        const small = document.createElement('span'); 
        small.className='small'; 
        
        // Show appropriate message based on time travel mode and closure status
        if (storeData.isClosed) {
          if (storeData.closureType === 'permanent') {
            small.textContent = `Closed on ${storeData.closureDate.toLocaleDateString('en-GB', {year: 'numeric', month: 'long', day: 'numeric'})}`;
          } else {
            small.textContent = `Closed for renovation since ${storeData.closureDate.toLocaleDateString('en-GB', {year: 'numeric', month: 'long', day: 'numeric'})}`;
          }
        } else if (isTimeTravelMode) {
          small.textContent = `Last change before ${currentDate.toLocaleDateString('en-GB', {month: 'long', year: 'numeric'})}: ${lastRenText}`;
        } else {
          small.textContent = `Last major change: ${lastRenText}`;
        }
        
        meta.appendChild(small);

        const actions=document.createElement('div'); 
        actions.className='actions';
        
        const view=document.createElement('button'); 
        view.className='button-primary'; 
        view.textContent='View timeline';
        view.addEventListener('click',()=>openModalFor(storeData));

        actions.appendChild(view);

        content.appendChild(tagsDiv); 
        content.appendChild(title); 
        content.appendChild(meta); 
        content.appendChild(actions);
        
        card.appendChild(imgWrap); 
        card.appendChild(content);

        grid.appendChild(card);
      });
    }

    const modal=document.getElementById('modal'); 
    const modalTitle=document.getElementById('modalTitle'); 
    const modalBody=document.getElementById('modalBody'); 
    const modalClose=document.getElementById('modalClose');
    
    function openModalFor(store){
      modalTitle.textContent = `${store.name} — ${store.code}`;
      modalBody.innerHTML = '';
      const timelineList = document.createElement('div'); 
      timelineList.className='timeline-list';

      const entries = store.timeline.slice(); 
      const n = entries.length;
      
      for(let i=0;i<n;i++){
        const ev = entries[i];
        const item = document.createElement('div'); 
        item.className='timeline-item';

        // Calculate the correct image index for timeline display
        // The current state (last event) uses primary image
        // Previous states use _old, _old2, _old3, etc.
        const imageIndex = n - 1 - i;
        let imgCandidate;
        
        if (imageIndex === 0) {
          imgCandidate = primaryImagePath(store.code);
        } else {
          imgCandidate = oldImagePath(store.code, imageIndex);
        }

        if(imgCandidate){
          const im = document.createElement('img');
          im.alt = `${store.name} - ${ev.label}`;
          im.onerror = () => {
            im.style.display = 'none';
          };
          im.src = imgCandidate;
          item.insertBefore(im, item.firstChild);
        }

        const labelEl = document.createElement('div'); 
        labelEl.className='label'; 
        labelEl.textContent = ev.label;
        
        const d = ev.date ? parseDate(ev.date) : null;
        const dateText = ev.date ? new Date(ev.date+'T00:00:00Z').toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}) + (d?` (${timeAgoDisplay(d)})`:'') : '';
        
        const dateEl = document.createElement('div'); 
        dateEl.className='date'; 
        dateEl.textContent = dateText;
        
        const noteEl = document.createElement('div'); 
        noteEl.className='note'; 
        noteEl.textContent = ev.note || '';

        item.appendChild(labelEl);
        if(dateText) item.appendChild(dateEl);
        if(ev.note) item.appendChild(noteEl);
        timelineList.appendChild(item);
      }

      modalBody.appendChild(timelineList);
      modal.classList.add('open'); 
      modal.setAttribute('aria-hidden','false');
      modalClose.focus();
    }
    
    // Time Travel functionality
    timeTravelBtn.addEventListener('click', () => {
      const selectedDate = new Date(timeTravelDate.value + '-01T00:00:00Z');
      currentDate = selectedDate;
      isTimeTravelMode = true;
      render();
    });
    
    resetTimeTravel.addEventListener('click', () => {
      currentDate = new Date('2025-11-06T12:00:00Z');
      isTimeTravelMode = false;
      timeTravelDate.value = '2025-11';
      render();
    });
    
    modalClose.addEventListener('click',()=>{ 
      modal.classList.remove('open'); 
      modal.setAttribute('aria-hidden','true'); 
    });
    
    modal.addEventListener('click',(e)=>{ 
      if(e.target===modal) { 
        modal.classList.remove('open'); 
        modal.setAttribute('aria-hidden','true'); 
      } 
    });

    render(); 
    [filterType,filterState,sortBy,search].forEach(el=>el.addEventListener('input',render));
    window.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement.tagName!=='INPUT') { e.preventDefault(); search.focus(); } });
  </script>
</body>
</html>
