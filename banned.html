<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #111114; --bg-modal: #191a1f; --bg-card: #272930;
            --btn-gray: #333640; --btn-gray-hover: #444757; --btn-blue: #5865f2; 
            --btn-blue-hover: #4752c4; --text-header: #f2f3f5; --text-normal: #dbdee1;
            --text-muted: #949ba4; --text-trace: #5d6066; --danger: #da373c;
            --shadow-border: rgba(90, 90, 90, 0.33); --radius-modal: 16px;
            --radius-card: 12px; --radius-btn: 8px; --panel-bg: #1e1f22;
        }
        body.light-mode {
            --bg-base: #e5e5e5; --bg-modal: #ffffff; --bg-card: #f2f3f5;
            --btn-gray: #e1e3e6; --btn-gray-hover: #d1d3d7; --text-header: #343434;
            --text-normal: #343434; --text-muted: #4f5660; --text-trace: #b5bac1;
            --shadow-border: rgba(0, 0, 0, 0.1); --panel-bg: #f9f9f9;
        }
        body { margin: 0; background: var(--bg-base); color: var(--text-normal); font-family: 'gg sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background 0.2s ease; overflow-x: hidden; }
        .customizer-toggle { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: var(--btn-blue); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .panel { position: fixed; left: -320px; top: 0; width: 300px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--shadow-border); z-index: 999; padding: 20px; box-sizing: border-box; transition: left 0.3s ease; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .panel.open { left: 0; }
        .panel h3 { margin: 0; font-size: 18px; color: var(--text-header); }
        .panel label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .panel select, .panel input, .panel textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--shadow-border); background: var(--bg-card); color: var(--text-normal); font-family: inherit; margin-bottom: 10px; }
        .container { width: 640px; min-height: 680px; background: var(--bg-modal); border-radius: var(--radius-modal); padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 0 1px var(--shadow-border), 0 2px 18px rgba(0, 0, 0, 0.25); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .title-group { display: flex; align-items: center; gap: 12px; }
        .icon-container { width: 23px; height: 23px; position: relative; display: flex; align-items: center; justify-content: center; }
        .ban-icon { width: 23px; height: 23px; border: 2px solid var(--danger); border-radius: 50%; box-sizing: border-box; position: relative; }
        .ban-icon::after { content: ''; position: absolute; width: 2px; height: 100%; background: var(--danger); top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .svg-icon { width: 26px; height: 26px; }
        h1 { color: var(--text-header); font-size: 21px; font-weight: 700; margin: 0; line-height: 2.35; }
        .dots { color: var(--text-header); font-size: 20px; margin-right: 6px; cursor: pointer; line-height: 1; }
        .description { font-size: 14px; color: var(--text-normal); margin: 0 0 22px 0; line-height: 1.4; }
        h2 { font-size: 16px; font-weight: 700; color: var(--text-header); margin: 0 0 10px 0; }
        .card { background: var(--bg-card); border-radius: var(--radius-card); padding: 16px; margin-bottom: 22px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06); }
        .field { margin-bottom: 12px; }
        .card .field:last-child {
    margin-bottom: 0; }
        .label { display: block; font-weight: 700; font-size: 14px; color: var(--text-header); margin-bottom: 3px; }
        .value { display: block; font-size: 14px; color: var(--text-normal); line-height: 1.4; }
        .btn-view-more { display: block; width: 100%; background: var(--btn-gray); color: var(--text-header); border: none; padding: 9px 0; border-radius: var(--radius-btn); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .trace-id { font-size: 13px; color: var(--text-trace); margin-top: -15px; font-weight: 600; }
        .footer { margin-top: auto; display: flex; justify-content: flex-end; padding-bottom: 2px; }
        .btn-report { background-color: #335fff75; color: #ffffff; border: none; padding: 0px 16px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 120px!important; }
        body.light-mode .btn-report { background-color: #335fff; }
        #evidence-overflow, #appeal-section { display: none; }
    </style>
</head>
<body id="main-body">

<button class="customizer-toggle" onclick="document.getElementById('side-panel').classList.toggle('open')">Settings</button>

<aside class="panel open" id="side-panel">
    <h3>Edit</h3>
    <div><label>Appearance</label><button class="btn-view-more" onclick="toggleMode()" id="toggle-btn"></button></div>
    <div><label>Action Duration</label>
        <select id="duration-select" onchange="updateContent()">
            <option value="Warning">Warning</option>
            <option value="Suspended1Day">Suspended for 1 day</option>
            <option value="Suspended3Days">Suspended for 3 days</option>
            <option value="Suspended7Days">Suspended for 7 days</option>
            <option value="Suspended14Days">Suspended for 14 days</option>
            <option value="Banned" selected>Banned</option>
        </select>
    </div>
    <div><label>Reason</label>
        <select id="reason-select" onchange="updateContent()">
            <option value="BanEvasion">Ban Evasion</option><option value="Other">Other</option><option value="Harassment">Harassment</option><option value="ExtortionThreats">Extortion and Threats</option><option value="Spam">Spam</option><option value="ScamsDeceptive">Scams and Deceptive Practices</option><option value="DiscriminationHate">Discrimination or Hate</option><option value="SexualAdult">Sexual or Adult Content</option><option value="MisusingSystems">Misusing Boiby Systems</option><option value="Copyright">Copyright Violation</option><option value="ChildSafety">Child Safety</option><option value="ExtremistContent">Extremist Content</option><option value="ViolentGore">Violent Content and Gore</option><option value="UndisclosedAds">Undisclosed Advertisement</option><option value="DisruptiveAudio">Disruptive Audio</option><option value="HarmfulDangerous">Harmful or Dangerous Activities</option><option value="Misinformation">Misinformation</option><option value="Dating">Dating</option><option value="IllegalRegulated">Illegal or Regulated Content</option><option value="SensitiveEvents">Mocking Real-World Sensitive Events</option>
        </select>
    </div>
    <div><label>Note Presets</label><select id="note-preset" onchange="applyPresetNote()"><option value="">-- Choose a Preset --</option><option value="Ban Evasion">Ban Evasion</option><option value="Harassment">Harassment</option><option value="Spam">Spam</option><option value="Hate Speech">Hate Speech</option><option value="Sexual Content">Sexual Content</option><option value="Scams">Scams</option></select></div>
    <div><label>Custom Note</label><textarea id="note-input" rows="3" oninput="updateContent()"></textarea></div>
    <div><label>Review Date</label><input type="datetime-local" id="date-input" oninput="updateContent()"></div>
    <div><label>Evidence Type</label>
        <select id="evidence-type" onchange="handleTypeChange()">
            <option value="None">None</option><option value="Generic">Generic</option><option value="Video">Video</option><option value="Image">Image</option><option value="Post">Post</option><option value="Comment">Comment</option>
        </select>
        <button id="add-btn" class="btn-view-more" onclick="addEvidenceItem()">+ Add Item</button>
    </div>
    <div id="evidence-controls-container"></div>
</aside>

<div class="container">
    <div id="main-view">
        <div class="header">
            <div class="title-group"><div class="icon-container" id="icon-holder"></div><h1 id="display-duration-title"></h1></div>
            <div class="dots">⋮</div>
        </div>
        <p class="description" id="display-desc"></p>
        <h2 id="txt-why"></h2>
        <div class="card">
            <div class="field"><span class="label" id="lbl-reason-static"></span><span class="value" id="display-reason"></span></div>
            <div class="field"><span class="label" id="lbl-details-static"></span><span class="value" id="display-note"></span></div>
        </div>
        <h2 id="txt-activity"></h2>
        <div class="card" id="evidence-card">
            <div class="field"><span class="label" id="lbl-date-static"></span><span class="value" id="display-date"></span></div>
            <div id="evidence-list-main"></div>
            <div id="evidence-overflow"></div>
            <button class="btn-view-more" id="view-more-btn" onclick="toggleEvidence()"></button>
            <div id="appeal-section">
                <div class="field" style="margin-top: 12px;"><span class="label" id="lbl-mistake-static"></span><span class="value" id="txt-mistake-appeal"></span></div>
                <button class="btn-view-more" id="btn-report-inner" onclick="handlePrimaryClick()"></button>
            </div>
        </div>
        <div class="trace-id" id="display-trace"></div>
        <div class="footer"><button class="btn-report" id="primary-action-btn" onclick="handlePrimaryClick()"></button></div>
    </div>

    <div id="rules-view" style="display:none; height:100%; flex-direction:column;">
        <div id="rules-content" style="margin-bottom: 20px;"></div>
        <div style="margin-bottom:4px">
            <h1 id="txt-violations-add-up"></h1>
            <h2 id="txt-violations-footer" style="font-weight:400; font-size: 15px; margin-top: 2px"></h2>
        </div>
        <div class="footer" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <button class="btn-report" id="btn-back" style="background-color: var(--btn-gray); color: var(--text-header); margin-top:150px!important;" onclick="toggleSubpage(false)"></button>
            <div style="display:flex; align-items:center; gap:10px; margin-top:150px!important;">
                <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer; color:var(--text-normal);"><input type="checkbox" id="agree-checkbox" onchange="toggleContinueBtn()"> <span id="lbl-agree"></span></label>
                <button class="btn-report" id="final-continue-btn" disabled style="opacity:0.5; cursor:not-allowed; margin-top:0!important;"></button>
            </div>
        </div>
    </div>
</div>

<script>
    let translations = null;
    let evidenceItems = [];
    let currentType = 'None';

    async function init() {
        try { const res = await fetch('en.json'); translations = await res.json(); } catch (e) { console.error("Could not load en.json"); }
        updateContent();
    }

    function t(path, vars = {}) {
        if (!translations) return path;
        let val = path.split('.').reduce((o, k) => o?.[k], translations);
        if (!val) return path;
        for (const key in vars) val = val.replace(`{{${key}}}`, vars[key]);
        return val;
    }

    function toggleMode() { const b = document.getElementById('main-body'); b.classList.toggle('light-mode'); updateContent(); }

    function applyPresetNote() { 
        const k = document.getElementById('note-preset').value; 
        if (k) { 
            const cleanKey = k.replace(/\s+/g, ''); 
            const presetText = t(`Presets.${cleanKey}`);
            if (presetText !== `Presets.${cleanKey}`) {
                document.getElementById('note-input').value = presetText; 
                updateContent(); 
            }
        } 
    }

    function handleTypeChange() { 
        currentType = document.getElementById('evidence-type').value; 
        evidenceItems = []; 
        document.getElementById('add-btn').style.display = (currentType === 'Generic') ? 'block' : 'none'; 
        if (currentType !== 'None') addEvidenceItem(); 
        else { renderEvidenceControls(); updateContent(); } 
    }
    
    function addEvidenceItem() { 
        if (currentType === 'None' || (currentType !== 'Generic' && evidenceItems.length >= 1)) return; 
        evidenceItems.push({ 
            id: Date.now(), 
            type: currentType, 
            val1: '', 
            val2: Math.random().toString(36).substring(2, 12).toUpperCase(), 
            val3: t('Labels.EntireVideo') 
        }); 
        renderEvidenceControls(); 
        updateContent(); 
    }
    
    function removeEvidence(id) { 
        evidenceItems = evidenceItems.filter(i => i.id !== id); 
        renderEvidenceControls(); 
        updateContent(); 
    }

    // FIXED: Now preserves input values when adding new items
    function renderEvidenceControls() {
        const container = document.getElementById('evidence-controls-container'); 
        container.innerHTML = '';
        evidenceItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.style.marginBottom = "10px";
            div.style.padding = "10px";
            div.style.border = "1px solid var(--shadow-border)";
            
            let inputs = `<label>${item.type} Item</label>`;
            
            if (item.type === 'Generic') {
                const input = document.createElement('input');
                input.placeholder = "Label";
                input.value = item.val1; // Restore previous value
                input.oninput = (e) => { evidenceItems[index].val1 = e.target.value; updateContent(); };
                div.innerHTML = inputs;
                div.appendChild(input);
            } else if (item.type === 'Video') {
                div.innerHTML = inputs;
                const i1 = document.createElement('input'); i1.placeholder = "Video Name"; i1.value = item.val1;
                i1.oninput = (e) => { evidenceItems[index].val1 = e.target.value; updateContent(); };
                const i2 = document.createElement('input'); i2.placeholder = "Timestamp"; i2.value = item.val3;
                i2.oninput = (e) => { evidenceItems[index].val3 = e.target.value || t('Labels.EntireVideo'); updateContent(); };
                div.appendChild(i1); div.appendChild(i2);
            } else if (item.type === 'Image') {
                div.innerHTML = inputs;
                const i1 = document.createElement('input'); i1.placeholder = "Image Name"; i1.value = item.val1;
                i1.oninput = (e) => { evidenceItems[index].val1 = e.target.value; updateContent(); };
                div.appendChild(i1);
            } else {
                div.innerHTML = inputs;
                const txt = document.createElement('textarea'); txt.placeholder = "Content"; txt.value = item.val1;
                txt.oninput = (e) => { evidenceItems[index].val1 = e.target.value; updateContent(); };
                div.appendChild(txt);
            }

            if (currentType === 'Generic') {
                const btn = document.createElement('button');
                btn.innerText = "Remove";
                btn.style = "background:var(--danger);color:white;border:none;border-radius:4px;font-size:10px;cursor:pointer;padding:4px;";
                btn.onclick = () => removeEvidence(item.id);
                div.appendChild(btn);
            }
            container.appendChild(div);
        });
    }

    function updateContent() {
        const currentTraceID = (self.crypto && self.crypto.randomUUID) ? 
            self.crypto.randomUUID() : 
            'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { 
                const r = Math.random() * 16 | 0; 
                return (c == 'x' ? r : (r & 0x3 | 0x8)).toString(16); 
            });

        const dur = document.getElementById('duration-select').value;
        const reason = document.getElementById('reason-select').value;
        const note = document.getElementById('note-input').value;
        const dateInput = document.getElementById('date-input').value;

        document.getElementById('display-duration-title').innerText = t(`Heading.${dur}`);
        document.getElementById('display-reason').innerText = t(`Reasons.${reason}`);
        document.getElementById('display-note').innerText = note;
        document.getElementById('display-trace').innerText = t('Labels.Trace') + currentTraceID;
        
        const d = new Date(dateInput || new Date());
        const dateStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        document.getElementById('display-date').innerText = `${dateStr} ${t('Descriptions.At')} ${timeStr}`;

        document.getElementById('toggle-btn').innerText = document.body.classList.contains('light-mode') ? t('Buttons.SwitchDark') : t('Buttons.SwitchLight');
        document.getElementById('txt-why').innerText = t('Heading.WhyThisHappened');
        document.getElementById('lbl-reason-static').innerText = t('Labels.Reason');
        document.getElementById('lbl-details-static').innerText = t('Labels.Details');
        document.getElementById('txt-activity').innerText = t('Heading.RecentActivity');
        document.getElementById('lbl-date-static').innerText = t('Labels.ReviewDate');
        document.getElementById('lbl-mistake-static').innerText = t('Labels.DidWeMakeAMistake');
        document.getElementById('txt-mistake-appeal').innerText = t('Descriptions.AppealV2');
        document.getElementById('btn-report-inner').innerText = t('Buttons.ReportMistake');
        document.getElementById('view-more-btn').innerText = document.getElementById('evidence-overflow').style.display === 'block' ? t('Buttons.ViewLess') : t('Buttons.ViewMore');
        document.getElementById('txt-violations-add-up').innerText = t('Heading.ViolationsAddUp');
        document.getElementById('txt-violations-footer').innerText = t('Descriptions.Foreshadow');
        document.getElementById('btn-back').innerText = t('Buttons.Back');
        document.getElementById('lbl-agree').innerText = t('Labels.AgreeToRulesV2');
        document.getElementById('final-continue-btn').innerText = t('Buttons.Continue');

        const iconHolder = document.getElementById('icon-holder');
        const descEl = document.getElementById('display-desc');
        const mainBtn = document.getElementById('primary-action-btn');
        const appealSec = document.getElementById('appeal-section');

        if (dur === 'Banned') {
            iconHolder.innerHTML = '<div class="ban-icon"></div>';
            descEl.innerText = t('Descriptions.BrokeRulesBannedV2');
            mainBtn.innerText = t('Buttons.ReportMistake');
            appealSec.style.display = 'none';
        } else {
            const isWarn = dur === 'Warning';
            const reasonText = t(`Reasons.${reason}`).toLowerCase();
            const typeName = currentType.toLowerCase();

            if (currentType === 'None' || currentType === 'Generic') {
                descEl.innerText = (reason === 'Other') ? 
                    t('Descriptions.GenericDescription') : 
                    t('Descriptions.SpecificDescription', {reason: reasonText});
            } else {
                // We use the Plural keys because the sentence is "one of your..."
                if (reason === 'Other') {
                    descEl.innerText = t('Descriptions.GenericTypeDescriptionPlural', {type: typeName});
                } else {
                    descEl.innerText = t('Descriptions.SpecificTypeDescriptionPlural', {type: typeName, reason: reasonText});
                }
            }
            
            iconHolder.innerHTML = `<img src="https://www.svgrepo.com/show/455819/exclamation-triangle.svg" class="svg-icon" style="filter: ${isWarn ? 'invert(84%) sepia(89%) saturate(464%) hue-rotate(351deg) brightness(98%) contrast(93%)' : 'invert(31%) sepia(93%) saturate(1292%) hue-rotate(1deg) brightness(94%) contrast(92%)'}">`;
            mainBtn.innerText = t('Buttons.Continue');
            appealSec.style.display = 'block';
        }

        const mainList = document.getElementById('evidence-list-main');
        const overflowList = document.getElementById('evidence-overflow');
        mainList.innerHTML = ''; overflowList.innerHTML = '';

        if (currentType === 'Generic') {
            const first = evidenceItems.slice(0, 5); const second = evidenceItems.slice(5);
            if(first.length > 0) { const d = document.createElement('div'); d.className='field'; d.style.marginTop="12px"; d.innerHTML=`<span class="label">${t('Labels.Evidence')}</span>` + first.map(i=>`<span class="value">${i.val1||'---'}</span>`).join(''); mainList.appendChild(d); }
            if(second.length > 0) { const d = document.createElement('div'); d.className='field'; d.innerHTML=second.map(i=>`<span class="value">${i.val1||'---'}</span>`).join(''); overflowList.appendChild(d); }
        } else {
            evidenceItems.forEach(i => {
                const d = document.createElement('div'); d.className='field'; d.style.marginTop="12px";
                if(i.type==='Video') d.innerHTML=`<span class="label">${t('Labels.VideoName')}</span><span class="value">${i.val1||t('Labels.Untitled')}</span><span class="label" style="margin-top:8px">${t('Labels.VideoID')}</span><span class="value">${i.val2}</span><span class="label" style="margin-top:8px">${t('Labels.Timestamp')}</span><span class="value">${i.val3}</span>`;
                else if(i.type==='Image') d.innerHTML=`<span class="label">${t('Labels.ImageName')}</span><span class="value">${i.val1||t('Labels.Untitled')}</span><span class="label" style="margin-top:8px">${t('Labels.ImageID')}</span><span class="value">${i.val2}</span>`;
                else d.innerHTML=`<span class="label">${i.type}:</span><span class="value">${i.val1||t('Labels.NoContent')}</span><span class="label" style="margin-top:8px">${t('Labels.PostID')}</span><span class="value">${i.val2}</span>`;
                mainList.appendChild(d);
            });
        }

        const rulesContent = document.getElementById('rules-content');
        if (reason === 'Harassment' || reason === 'DiscriminationHate') {
            rulesContent.innerHTML = `<h1>${t('Heading.FollowTheRules')}</h1><h2 style="margin-top: 12px">${t('Descriptions.BullyHeader')}</h2><h2 style="font-weight:400; font-size: 15px; margin-top: 2px">${t('Descriptions.BullyDetail')}</h2><h2 style="margin-top: 20px">${t('Descriptions.BullyMatter')}</h2><h2 style="font-weight:400; font-size: 15px; margin-top: 2px">${t('Descriptions.BullyImportance')}</h2>`;
        } else {
            rulesContent.innerHTML = `<h1>${t('Heading.FollowTheRules')}</h1><h2 style="font-weight:400; font-size: 15px; margin-top: 12px">${t('Descriptions.FollowFuture')}</h2>`;
        }
    }

    function toggleEvidence() { const o = document.getElementById('evidence-overflow'); o.style.display = (o.style.display === 'block') ? 'none' : 'block'; updateContent(); }
    function handlePrimaryClick() { if (document.getElementById('duration-select').value !== 'Banned') toggleSubpage(true); }
    function toggleSubpage(show) { document.getElementById('main-view').style.display = show ? 'none' : 'block'; document.getElementById('rules-view').style.display = show ? 'flex' : 'none'; if(!show){ document.getElementById('agree-checkbox').checked = false; toggleContinueBtn(); } }
    function toggleContinueBtn() { const c = document.getElementById('agree-checkbox'); const b = document.getElementById('final-continue-btn'); b.disabled = !c.checked; b.style.opacity = c.checked ? "1" : "0.5"; b.style.cursor = c.checked ? "pointer" : "not-allowed"; }

    init();
</script>
</body>
</html>
