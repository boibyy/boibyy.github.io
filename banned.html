<!DOCTYPE html>
<html lang="en"><head><style>
body {transition: opacity ease-in 0.2s; } 
</style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boiby</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        #second-chance-checkbox {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .lbl-mistake-static {
            display: none!important;
        }
        :root {
            --bg-base: #111114; --bg-modal: #191a1f; --bg-card: #272930;
            --btn-gray: #333640; --btn-gray-hover: #444757; --btn-blue: #5865f2; 
            --btn-blue-hover: #4752c4; --text-header: #f2f3f5; --text-normal: #dbdee1;
            --text-muted: #949ba4; --text-trace: #828791; --danger: #da373c;
            --shadow-border: rgba(90, 90, 90, 0.33); --radius-modal: 16px;
            --radius-card: 10px; --radius-btn: 8px; --panel-bg: #1e1f22;
            --btn-gray2: #33364029; --btn-gray-hover2: #44475741
        }
        body.light-mode {
            --bg-base: #e1e1e1; --bg-modal: #f7f7f8; --bg-card: #e9ebed;
            --btn-gray: #d7d7db; --btn-gray-hover: #d1d3d7; --text-header: #343434;
            --text-normal: #343434; --text-muted: #4f5660; --text-trace: #9598a0;
            --shadow-border: rgba(200,200,200, 0.4); --panel-bg: #f9f9f9;
            --btn-gray2: #d7d7db4d; --btn-gray-hover2: #d1d3d74d
        }

        body { 
            margin: 0; 
            background: var(--bg-base); 
            color: var(--text-normal); 
            font-family: 'gg sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background 0.2s ease; 
        }
        
.container { 
    width: 640px; 
    min-height: min(720px, 90vh); 
    height: auto;
    max-height: 90vh;
    background: var(--bg-modal); 
    border-radius: var(--radius-modal); 
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
    position: relative; 
    box-shadow: 0 0 0 1px var(--shadow-border), 0 3px 24px rgba(0, 0, 0, 0.25); 
    overflow-y: auto; 
}
        
#agree-checkbox {
    background-color: var(--bg-card);
}
        .customizer-toggle { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: var(--btn-blue); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        @media (max-width: 768px) {
            .customizer-toggle {
                opacity: 0;
                width: 40px;
                height: 40px;
                padding: 0;
                left: 5px;
                bottom: 5px;
            }
            .customizer-toggle:active, .customizer-toggle:focus {
                opacity: 0.25;
            }
        }

        @media (max-width: 550px) {
    #icon-holder, 
    .dots {
        display: none !important;
    }

    #main-view > .header {
        display: block;
        width: 100vw; 
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
        margin-bottom: 22px!important;
        border-bottom: 1px solid grey;
        box-sizing: border-box;
        padding: 0 22px; 
        text-align: center;
    }

    .modal-content {
        max-width: 85%!important;
    }

    .title-group {
        text-align: center;
        margin-top: -5px;
        margin-left: auto!important;
        margin-right: auto!important;
        display: flex;
        flex-direction: column;
        align-items: center; /* This forces children to the center */
    }

    #btn-back {
        margin-bottom: 8px;
        min-width:100%;
    }

    #display-duration-title {
        left: 50%;
        right: 50%;
        display: block!important;
        text-align: center!important;
        margin-bottom: 16px!important;
        margin-top: 0!important;
        line-height: 1!important;
    }

    h1 {
        line-height: 1.35!important;
        margin-bottom: 16px!important;
        margin-top: 12px!important;
    }
}

        .panel { position: fixed; left: -320px; top: 0; width: 300px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--shadow-border); z-index: 999; padding: 20px; box-sizing: border-box; transition: left 0.3s ease; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .panel.open { left: 0; }
        .panel h3 { margin: 0; font-size: 18px; color: var(--text-header); }
        .panel label { display: block; font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .panel select, .panel input:not([type="checkbox"]), .panel textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--shadow-border); background: var(--bg-card); color: var(--text-normal); font-family: inherit; margin-bottom: 10px; }
        
        .progress-bar-container {
            width: 94%;
            height: 5px;
            background: var(--btn-gray);
            position: relative;
            margin-top: 36px;
            margin-left: 3%;
            display: none;
            border-radius: 10px;
            margin-bottom: -8px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #3355ff;
            transition: width 0.3s ease;
            width: 0%;
            border-radius: 10px;
        }
        
        .scrollable-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--btn-gray) transparent;
        }

        body.light-mode .container {
            box-shadow: 0 0 0 1px var(--shadow-border), 0 3px 24px rgba(200,200,200, 0.25); 
        }

        #main-view, #rules-view, #policy-view {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .footer { 
            flex-shrink: 0;
            display: flex; 
            justify-content: flex-end; 
            padding: 20px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-modal);
            border-bottom-left-radius: var(--radius-modal);
            border-bottom-right-radius: var(--radius-modal);
        }

        .btn-view-more, .btn-report-inner {
            font-size: 13px !important;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; margin-top: 1px}
        .title-group { display: flex; align-items: center; gap: 12px; }
        .icon-container { width: 22px; height: 22px; position: relative; display: flex; align-items: center; justify-content: center; }
        .ban-icon { width: 22px; height: 22px; border: 2px solid var(--danger); border-radius: 50%; box-sizing: border-box; position: relative; }
        .ban-icon::after { content: ''; position: absolute; width: 2px; height: 100%; background: var(--danger); top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .svg-icon { width: 26px; height: 26px; }
        h1 { color: var(--text-header); font-size: 21px; font-weight: 700; margin: 0; line-height: 2.4; }
        .dots { color: var(--text-header); font-size: 20px; margin-right: 6px; cursor: pointer; line-height: 1; }
        .description { font-size: 14px; color: var(--text-normal); margin: 0 0 22px 0; line-height: 1.35; }
        h2 { font-size: 16px; font-weight: 700; color: var(--text-header); margin: 2px 0 12px 0; }
        .card { background: var(--bg-card); border-radius: var(--radius-card); padding: 15px; margin-bottom: 22px; border: 1px rgba(0, 0, 0, 0.03); }
        .field { margin-bottom: 12px; }
        .card .field:last-child { margin-bottom: 0; }
        .label { display: block; font-weight: 700; font-size: 14px; color: var(--text-header); margin-bottom: 2px; }
        .value { display: block; font-size: 14px; color: var(--text-normal); line-height: 1.35; }
        .btn-view-more { display: block; width: 100%; background: var(--btn-gray); color: var(--text-header); border: none; padding: 8.5px 0; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .trace-id { font-size: 13px; color: var(--text-trace); margin-top: -13px; font-weight: 500; padding-bottom: 20px; }
        .btn-report { background-color: #335fff75; color: #ffffff; border: none; padding: 0px 12px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
        body.light-mode .btn-report { background-color: #335fff; }
        #evidence-overflow { display: none; }
        #policy-why-card { padding: 14px; margin-top: 0px; margin-bottom: 10px; }
        #policy-why-card .value { margin: 0; }

        #policy-header-title-1, #policy-header-title-2, #rules-header-title, #second-chance-title-1, #second-chance-title-2 {
            font-size: 24px;
        }

        #policy-violated-header, #second-chance-header-1, #second-chance-header-2 {
            margin-top: 6px!important;
            font-weight: 15px;
        }

        #display-policy-description, #rules-description, #display-policy-importance, #rules-mistake-text, #second-chance-description-1, #second-chance-description-2 {
            font-size: 15px!important;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            
            width: 20px;
            height: 20px;
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 4px;
            
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
        }

        input[type="checkbox"]:hover {
            border-color: rgb(17, 17, 17);
            background-color: var(--bg-base);
        }

        input[type="checkbox"]:checked {
            background-color: rgb(51, 85, 255)!important;
            border-color: rgb(17, 17, 17)!important;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            
            background-color: var(--bg-modal);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.67);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-modal);
            border-radius: var(--radius-modal);
            padding: 20px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 0 1px var(--shadow-border), 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-header);
            margin-bottom: 10px;
        }

        .modal-description {
            font-size: 15px;
            color: var(--text-normal);
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .modal-textarea {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--shadow-border);
            background: var(--bg-modal);
            color: var(--text-normal);
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .modal-button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .modal-button.cancel {
            background: var(--btn-gray);
            color: var(--text-header);
        }

        .modal-button.cancel:hover {
            background: var(--btn-gray-hover);
        }

        .modal-button.send {
            background: #3355ff;
            color: #ffffff;
        }

        .modal-button.send:hover {
            opacity: 0.9;
        }

        .modal-subtext {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.3;
            margin-top: 15px;
        }

        @media (max-width: 640px) {
            .footer {
                flex-direction: column; 
                gap: 10px;
            }

            #footer-main-buttons {
                flex-direction: column;
                width: 100%;
            }

            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0; 
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
            }

            .btn-report {
                width: 100%;
                box-sizing: border-box;
            }

            #footer-rules-buttons {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            #btn-back {
                width: auto !important;
                align-self: flex-start;
            }

            .agree-section {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }

        .btn-logout {
            background-color: var(--btn-gray2);
            border: none;
            margin-top: 8px;
            cursor: pointer;
            color: #eeeeee; 
            padding: 0px 12px; 
            height: 40px; 
            border-radius: var(--radius-btn); 
            font-size: 15px; 
            font-weight: 500; 
            font-family: inherit; 
            transition: opacity 0.2s;
        }

        body.light-mode .btn-logout {
            background-color: var(--btn-gray2);
            color: #111111;
        }

        .btn-logout:hover {
            background-color: var(--btn-gray-hover2);
        }

        @media (max-width: 550px) {
            .btn-logout {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body id="main-body" class="light-mode">

<button class="customizer-toggle" onclick="document.getElementById('side-panel').classList.toggle('open')">Settings</button>

<div class="modal-overlay" id="appeal-modal">
    <div class="modal-content">
        <div id="modal-form-view">
            <div class="modal-header" id="modal-header"></div>
            <div class="modal-description" id="modal-description"></div>
            <textarea class="modal-textarea" id="appeal-textarea" placeholder=""></textarea>
            <div class="modal-buttons">
                <button class="modal-button cancel" id="modal-cancel"></button>
                <button class="modal-button send" id="modal-send"></button>

            <div class="modal-subtext" id="modal-subtext"></div>

        <div id="modal-success-view" style="display: none;">
            <div class="modal-header" id="modal-success-header"></div>
            <div class="modal-description" id="modal-success-description"></div>
            <div class="modal-buttons">
                <button class="modal-button send" style="width: 100%;" id="modal-got-it"></button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="progress-bar-container" id="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    
    <div class="scrollable-body">
        <div id="main-view">
            <div class="header">
                <div class="title-group"><div class="icon-container" id="icon-holder"><div class="ban-icon"></div></div><h1 id="display-duration-title">Banned</h1></div>
                <div class="dots">⋮</div>
            </div>
            <p class="description" id="display-desc"></p>
            <h2 id="txt-why"></h2>
            <div class="card">
                <div class="field"><span class="label" id="lbl-reason-static"></span><span class="value" id="display-reason">Other</span></div>
                <div class="field"><span class="label" id="lbl-details-static"></span><span class="value" id="display-note"></span></div>
            </div>
            <h2 id="txt-activity"></h2>
            <div class="card" id="evidence-card">
                <div id="evidence-list-main"></div>
                <div id="evidence-divider" style="display:none; border-bottom: 1px solid var(--shadow-border); margin: 10px 0;"></div>
                <div class="field"><span class="label" id="lbl-date-static"></span><span class="value" id="display-date"></span></div>
                <div id="evidence-overflow"></div>
                <button class="btn-view-more" style="margin-bottom:1px" id="view-more-btn" onclick="toggleEvidence()">View more</button>
                
                <div id="next-section-main" style="display: none;">
                    <div class="field" style="margin-top: 14px;"><span class="label lbl-mistake-static"></span><span class="value txt-mistake-appeal"></span></div>
                    <button class="btn-view-more btn-report-inner" style="margin-bottom:1px" onclick="reportMistakeClicked(event)">Report a mistake</button>
                </div>
            </div>

        </div>

            <h2 style="margin-top: 2px;" id="policy-violated-header"></h2>

        </div>

        <div id="policy-view-2" style="display: none; flex-direction: column;">
            <h1 id="policy-header-title-2"></h1>
            <span class="value" id="display-policy-importance" style="margin-top: 0px; line-height: 1.35; white-space: pre-wrap;"></span>
            <div style="margin-top:12px;"><button class="btn-view-more" id="policy-learn-more-btn-2" style="margin-bottom:1px">Learn more</button></div>
        </div>

        <div id="rules-view" style="display: none; flex-direction: column;">
            <h1 id="rules-header-title"></h1>
            <span class="value" id="rules-description" style="margin-top: 0px; line-height: 1.35; white-space: pre-wrap;"></span>
            <div style="margin-top:5px;"><button class="btn-view-more" id="btn-view-rules-inner" style="margin-bottom:1px">View rules</button></div>
            <span class="value" id="rules-mistake-text" style="margin-top: 40px; line-height: 1.35; white-space: pre-wrap;"></span>
            <div style="margin-top:5px;"><button class="btn-view-more" id="btn-report-mistake-rules" style="margin-bottom:1px">Report a mistake</button></div>
        </div>

        <div id="second-chance-view-2" style="display: none; flex-direction: column;">
            <h1 id="second-chance-title-2"></h1>
            <span class="value" id="second-chance-description-2" style="margin-top: 0px; line-height: 1.35; white-space: pre-wrap;"></span>
        </div>

    <div class="footer">
        <div id="footer-main-buttons" style="display: flex; justify-content: flex-end; width: 100%;">
            <button class="btn-report" id="primary-action-btn" onclick="handlePrimaryClick()" style="color: rgb(17, 17, 17); background: rgba(51, 95, 255, 0.298); opacity: 1; border: none;">Report a mistake</button>
            <button class="btn-logout" id="logout-btn" onclick="handleLogout()" style="display: none;">Log out</button>
        </div>
        <div id="footer-rules-buttons" style="display: none; justify-content: space-between; align-items: center; width: 100%;">
            <button class="btn-report" id="btn-back" style="background-color: var(--btn-gray); color: var(--text-header);" onclick="handleBackNavigation()">Back</button>
            <div class="agree-section" style="display:flex; align-items:center; gap:10px;">
                <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer; color:var(--text-normal);">
                    <input type="checkbox" id="agree-checkbox" onchange="toggleContinueBtn()"> 
                    <span id="lbl-agree">Check to confirm you understand.</span>
                </label>
                <button class="btn-report" id="final-continue-btn" onclick="handleContinueClick()" disabled style="opacity:0.5; cursor:not-allowed;">Continue</button>
            </div>
        </div>
    </div>
</div>

<script>
    let translations = null;
    let evidenceItems = [];
    let currentType = 'None';
    let currentStep = 1; 
    let suspensionIntervalId = null;
    let reviewDate = null;
    let secondChanceEnabled = false;

    const policyMap = {
        "Harassment": { headerTop: "Heading.BullyHeaderTop", header: "Heading.RuleExplanation.BullyHeader", detail: "Description.BullyDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.BullyImportance" },
        "Harassment.V2": { headerTop: "Heading.BullyHeaderTop", header: "Heading.RuleExplanation.BullyHeader", detail: "Description.BullyDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.BullyImportance" },
        "DiscriminationHate": { headerTop: "Heading.BullyHeaderTop", header: "Heading.RuleExplanation.BullyHeader", detail: "Description.BullyDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.BullyImportance" },
        "Spam": { headerTop: "Heading.SpamHeaderTop", header: "Heading.RuleExplanation.SpamHeader", detail: "Description.SpamDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.SpamImportance" },
        "ExtortionThreats": { headerTop: "Heading.ExtortionHeaderTop", header: "Heading.RuleExplanation.ExtortionHeader", detail: "Description.ExtortionDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ExtortionImportance" },
        "ViolentGore": { headerTop: "Heading.ViolentHeaderTop", header: "Heading.RuleExplanation.ViolentHeader", detail: "Description.ViolentDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ViolentImportance" },
        "Dating": { headerTop: "Heading.DatingHeaderTop", header: "Heading.RuleExplanation.DatingHeader", detail: "Description.DatingDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.DatingImportance" },
        "Dating.V2": { headerTop: "Heading.DatingHeaderTop", header: "Heading.RuleExplanation.DatingHeader", detail: "Description.DatingDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.DatingImportance" },
        "MisusingSystems": { headerTop: "Heading.MisusingSystemsHeaderTop", header: "Heading.RuleExplanation.MisusingSystemsHeader", detail: "Description.MisusingSystemsDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.MisusingSystemsImportance" },
        "DangerousActivities": { headerTop: "Heading.HarmfulHeaderTop", header: "Heading.RuleExplanation.HarmfulHeader", detail: "Description.HarmfulDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.HarmfulImportance" },
        "Misinformation": { headerTop: "Heading.MisinformationHeaderTop", header: "Heading.RuleExplanation.MisinformationHeader", detail: "Description.MisinformationDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.MisinformationImportance" },
        "UndisclosedAds": { headerTop: "Heading.UndisclosedAdsHeaderTop", header: "Heading.RuleExplanation.UndisclosedAdsHeader", detail: "Description.UndisclosedAdsDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.UndisclosedAdsImportance" },
        "SexualContent": { headerTop: "Heading.SexualHeaderTop", header: "Heading.RuleExplanation.SexualHeader", detail: "Description.SexualDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.SexualImportance" },
        "PoliticalContent": { headerTop: "Heading.PoliticalHeaderTop", header: "Heading.RuleExplanation.PoliticalHeader", detail: "Description.PoliticalDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.PoliticalImportance"},
        "PoliticalContent.V2": { headerTop: "Heading.PoliticalHeaderTop", header: "Heading.RuleExplanation.PoliticalHeader", detail: "Description.PoliticalDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.PoliticalImportance"},
        "PrivacyGivingPII": { headerTop: "Heading.PIIHeaderTop", header: "Heading.RuleExplanation.PIIHeader", detail: "Description.PIIDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.PIIImportance"},
        "PrivacyAskingPII": { headerTop: "Heading.PIIHeaderTop", header: "Heading.RuleExplanation.PIIHeader", detail: "Description.PIIDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.PIIImportance"},
        "Scamming": { headerTop: "Heading.ScammingHeaderTop", header: "Heading.RuleExplanation.ScammingHeader", detail: "Description.ScammingDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ScammingImportance"},
        "DisruptiveAudio": { headerTop: "Heading.DisruptiveAudioHeaderTop", header: "Heading.RuleExplanation.DisruptiveAudioHeader", detail: "Description.DisruptiveAudioDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.DisruptiveAudioImportance"},
        "Impersonation": { headerTop: "Heading.ImpersonationHeaderTop", header: "Heading.RuleExplanation.ImpersonationHeader", detail: "Description.ImpersonationDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ImpersonationImportance"},
        "SensitiveEvents": { headerTop: "Heading.SensitiveEventsHeaderTop", header: "Heading.RuleExplanation.SensitiveEventsHeader", detail: "Description.SensitiveEventsDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.SensitiveEventsImportance"},
        "RepeatedRefunds": { headerTop: "Heading.ChargebackHeaderTop", header: "Heading.RuleExplanation.ChargebackHeader", detail: "Description.ChargebackDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ChargebackImportance"},
        "Chargebacks": { headerTop: "Heading.ChargebackHeaderTop", header: "Heading.RuleExplanation.ChargebackHeader", detail: "Description.ChargebackDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.ChargebackImportance"},
        "IllegalRegulated": { headerTop: "Heading.IllegalContentHeaderTop", header: "Heading.RuleExplanation.IllegalContentHeader", detail: "Description.IllegalContentDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.IllegalContentImportance"},
        "IPViolation": { headerTop: "Heading.IPViolationHeaderTop", header: "Heading.RuleExplanation.IPViolationHeader", detail: "Description.IPViolationDetail", importanceLabel: "Heading.WhyDoesThisMatter", importance: "Description.IPViolationImportance"}
    };

    async function init() {
        try { 
            const res = await fetch('en.json'); 
            translations = await res.json(); 
        } catch (e) { 
            console.error("Translation load failed.");
            translations = {}; 
        }
        setupLogoutAndResize();
        updateContent();
        
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn) {
            finalBtn.onclick = handleContinueClick;
        }
        
        const agree = document.getElementById('agree-checkbox');
        if (agree) {
            try { agree.checked = false; } catch (e) {}
            agree.setAttribute('autocomplete', 'off');
            agree.removeAttribute('checked');
            try { agree.removeAttribute('name'); } catch (e) {}
        }

        document.getElementById('modal-cancel').onclick = closeAppealModal;
        document.getElementById('modal-send').onclick = sendAppeal;
        document.getElementById('modal-got-it').onclick = closeAppealModal;
    }

    function t(key, vars = {}) {
        if (!translations) return key;
        let val = translations[key];
        if (val === undefined || val === null) return key;
        for (const k in vars) val = val.replace(`{{${k}}}`, vars[k]);
        return val;
    }

    function getFormattedDate() {
        const now = reviewDate || new Date();
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
        return `${now.toLocaleDateString('en-US', options)} at ${now.toLocaleTimeString('en-US', timeOptions)}`;
    }

    function setupLogoutAndResize() {
        const logoutBtn = document.querySelector('.btn-logout');
        const handleResize = () => {
            const isMobile = window.innerWidth < 640;
            const dur = document.getElementById('duration-select')?.value;
            if (logoutBtn) {
                logoutBtn.style.display = (isMobile && dur === 'Banned') ? 'block' : 'none';
            }
        };
        window.addEventListener('resize', handleResize);
        handleResize();
        
        const durSelect = document.getElementById('duration-select');
        if (durSelect) {
            durSelect.addEventListener('change', handleResize);
        }
    }

    function updateProgressBar() {
        const progressBar = document.getElementById('progress-bar-fill');
        const progressContainer = document.getElementById('progress-bar-container');
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value || 'Warning';
        const isSuspension = dur.startsWith('Suspended');
        
        if (currentStep === 1 || (!hasPolicy && !secondChanceEnabled)) {
            progressContainer.style.display = 'none';
            return;
        }
        
        progressContainer.style.display = 'block';
        
        let progress = 0;
        let totalSteps = 4;
        
        if (secondChanceEnabled && isSuspension) {
            totalSteps = hasPolicy ? 6 : 4;
            if (currentStep === 2) progress = 16.67;
            else if (currentStep === 3) progress = 33.33;
            else if (currentStep === 4) progress = 50;
            else if (currentStep === 5) progress = 66.67;
            else if (currentStep === 6) progress = 83.33;
            else if (currentStep === 7) progress = 100;
        } else if (hasPolicy) {
            totalSteps = 4;
            if (currentStep === 2) progress = 33.33;
            else if (currentStep === 3) progress = 66.67;
            else if (currentStep === 4) progress = 100;
        } else {
            totalSteps = 2;
            if (currentStep === 2) progress = 50;
            else if (currentStep === 3) progress = 100;
        }
        
        progressBar.style.width = progress + '%';
    }
    
    function toggleMode() {
        try {
            const body = document.getElementById('main-body') || document.body;
            const btn = document.getElementById('toggle-btn');
            const isLight = body.classList.contains('light-mode');
            if (isLight) {
                body.classList.remove('light-mode');
                if (btn) btn.innerText = t('Action.Theme.SwitchLight') || 'Switch to Light';
            } else {
                body.classList.add('light-mode');
                if (btn) btn.innerText = t('Action.Theme.SwitchDark') || 'Switch to Dark';
            }
            try { updateContent(); } catch (e) { }
        } catch (e) { console.error('toggleMode error', e); }
    }

    function toggleEvidence() {
        const overflow = document.getElementById('evidence-overflow');
        const btn = document.getElementById('view-more-btn');
        const total = evidenceItems.length;
        if (!overflow || !btn) return;
        if (total <= 5) return;
        const isOpen = overflow.style.display === 'block';
        if (isOpen) {
            overflow.style.display = 'none';
            btn.innerText = t('Action.ViewMore');
        } else {
            overflow.style.display = 'block';
            btn.innerText = t('Action.ViewLess');
        }
    }

    function renderEvidenceControls() {
        const container = document.getElementById('evidence-controls-container');
        if (!container) return;
        container.innerHTML = '';
        evidenceItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'field';
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.gap = '8px';

            const lbl = document.createElement('span');
            lbl.className = 'label';
            let labelText = item.type;
            if (item.type === 'ChatEvidence') labelText = (t('Label.ChatEvidenceID') || 'Chat Evidence ID');
            else if (item.type === 'Location') labelText = (t('Label.Location') || 'Location');
            else if (item.type === 'Generic') labelText = 'Offensive item';
            lbl.innerText = labelText;
            div.appendChild(lbl);

            if (item.type === 'ChatEvidence') {
                const val = document.createElement('div');
                val.className = 'value';
                val.style.marginTop = '6px';
                val.innerText = item.val1 || '';
                div.appendChild(val);
            } else {
                const input = document.createElement('input');
                input.value = item.val1 || '';
                input.oninput = (e) => { evidenceItems[index].val1 = e.target.value; updateContent(); };
                div.appendChild(input);
            }

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-view-more';
            removeBtn.style.marginLeft = '6px';
            removeBtn.innerText = 'Remove';
            removeBtn.onclick = () => { evidenceItems.splice(index, 1); renderEvidenceControls(); updateContent(); };
            div.appendChild(removeBtn);

            container.appendChild(div);
        });
    }

    function handleTypeChange() { 
        currentType = document.getElementById('evidence-type')?.value || 'None'; 
        evidenceItems = []; 
        const addBtn = document.getElementById('add-btn');
        if (addBtn) addBtn.style.display = (currentType === 'Generic') ? 'block' : 'none'; 
        if (currentType !== 'None') addEvidenceItem(); 
        else { renderEvidenceControls(); updateContent(); } 
    }
    
    function addEvidenceItem() { 
        if (currentType === 'None' || (currentType !== 'Generic' && evidenceItems.length >= 1)) return; 
        const makeUUID = () => { try { return (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : ('id-' + Math.random().toString(16).slice(2)); } catch(e){ return 'id-' + Math.random().toString(16).slice(2); } };
        let item = { 
            id: Date.now(), type: currentType, val1: '', 
            val2: Math.random().toString(36).substring(2, 12).toUpperCase(), 
            val3: t('Label.EntireVideo') 
        };

        if (currentType === 'ChatEvidence') {
            const banTime = reviewDate || new Date();
            const chatTime = new Date(banTime.getTime() - 17 * 60 * 1000);
            const pad = (n) => n.toString().padStart(2, '0');
            const ts = `${chatTime.getFullYear()}-${pad(chatTime.getMonth()+1)}-${pad(chatTime.getDate())}::${pad(chatTime.getHours())}:${pad(chatTime.getMinutes())}:${pad(chatTime.getSeconds())}`;
            item.val1 = `[${ts}]: ${makeUUID()}`;
        }

        evidenceItems.push(item); 
        renderEvidenceControls(); 
        updateContent();
    }

    function applyPresetNote() { 
        const k = document.getElementById('note-preset')?.value; 
        if (k) {
            const cleanKey = k.replace(/\s+/g, ''); 
            const presetText = t(`Label.MessageToUser.${cleanKey}`);
            if (presetText !== `Label.MessageToUser.${cleanKey}`) {
                document.getElementById('note-input').value = presetText; 
                updateContent(); 
            }
        } 
    }

    function updateContent() {
        secondChanceEnabled = document.getElementById('second-chance-checkbox')?.checked || false;
        const traceID = (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : 'trace-' + Math.random().toString(16).slice(2);
        const dur = document.getElementById('duration-select')?.value || 'Warning';
        const reason = document.getElementById('reason-select')?.value || 'Other';
        const note = document.getElementById('note-input')?.value || '';
        const isLight = document.body.classList.contains('light-mode');

        const setTxt = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = val; };

        const dateInputVal = document.getElementById('date-input')?.value;
        if (dateInputVal) reviewDate = new Date(dateInputVal);
        else if (!reviewDate) reviewDate = new Date();

        setTxt('lbl-reason-static', t('Label.Reason'));
        setTxt('lbl-details-static', t('Label.ModeratorNote'));
        setTxt('display-note', note);
        setTxt('display-duration-title', t(`Heading.${dur}`));
        setTxt('display-reason', t(`Label.Reason.${reason}`));
        setTxt('display-trace', traceID);
        setTxt('display-date', getFormattedDate());
        setTxt('txt-why', t('Heading.Subheading.WhyThisHappened'));
        setTxt('txt-activity', t('Heading.Subheading.ActivityReviewed'));
        setTxt('lbl-date-static', t('Label.ReviewDate'));
        document.getElementById('next-section-main').style.display = 'none';

        const descEl = document.getElementById('display-desc');
        const mainBtn = document.getElementById('primary-action-btn');
        
        setupLogoutAndResize();
        
        if (dur === 'Banned') {
            document.getElementById('next-section-main').style.display = 'none';
            document.getElementById('icon-holder').innerHTML = '<div class="ban-icon"></div>';
            if(descEl) descEl.innerText = t('Description.BrokeRulesBanned');
            if(mainBtn) {
                mainBtn.innerText = t('Action.ReportMistake');
                mainBtn.style = `color: ${isLight ? "#111" : "#eee"}; background: rgba(51, 95, 255, 0.298); border: none; cursor: pointer;`;
                mainBtn.disabled = false;
                mainBtn.style.pointerEvents = 'auto';
                mainBtn.removeAttribute('aria-disabled');
                mainBtn.onclick = () => openAppealModal();
            }
        } else {
            document.getElementById('next-section-main').style.display = 'none';
            const isWarn = dur === 'Warning';
            const violations = evidenceItems.filter(e => e.type !== 'ChatEvidence');
            const hasViolations = violations.length > 0;
            const mediaTypes = ['Video','Comment','Image','Post'];
            const genericTypes = ['Generic','Location'];
            const hasMedia = violations.some(e => mediaTypes.includes(e.type));
            const hasGeneric = violations.some(e => genericTypes.includes(e.type));

            const pickType = () => {
                if (!hasViolations) return '';
                const first = violations[0].type || '';
                return first.toLowerCase();
            };

            let descKey = 'Description.GenericDescription';
            let descVars = {};

            if (!hasViolations) {
                if (reason === 'Other') {
                    descKey = 'Description.GenericDescription';
                } else {
                    descKey = 'Description.SpecificDescription';
                    descVars = { reason: t(`Label.Reason.${reason}`).toLowerCase() };
                }
            } else {
                if (hasMedia) {
                    if (reason === 'Other') {
                        descKey = 'Description.GenericTypeDescriptionPlural';
                        descVars = { type: pickType() };
                    } else {
                        descKey = 'Description.SpecificTypeDescriptionPlural';
                        descVars = { type: pickType(), reason: t(`Label.Reason.${reason}`).toLowerCase() };
                    }
                } else {
                    if (reason === 'Other') {
                        descKey = 'Description.GenericDescription';
                    } else {
                        descKey = 'Description.SpecificDescription';
                        descVars = { reason: t(`Label.Reason.${reason}`).toLowerCase() };
                    }
                }
            }

            if (descEl) {
                const descText = t(descKey, descVars);
                descEl.innerText = descText;
            }
            document.getElementById('icon-holder').innerHTML = `<img src="https://www.svgrepo.com/show/455819/exclamation-triangle.svg" class="svg-icon" style="filter: ${isWarn ? 'invert(80%) sepia(89%) saturate(300%) hue-rotate(351deg) brightness(69%) contrast(176%)' : 'invert(31%) sepia(93%) saturate(1292%) hue-rotate(1deg) brightness(94%) contrast(92%)'}">`;
            if(mainBtn) {
                document.getElementById('next-section-main').style.display = 'none';
                mainBtn.innerText = t('Action.Continue');
                mainBtn.style = "background: #3355ff; color: #ffffff; border: none;";
                try {
                    mainBtn.disabled = false;
                    mainBtn.style.pointerEvents = 'auto';
                    mainBtn.removeAttribute('aria-disabled');
                    try { mainBtn.onclick = handlePrimaryClick; } catch(e) {}
                } catch(e) { console.error('Failed to re-enable primary action button', e); }
                try {
                    const reportText = t('Action.ReportMistake') || t('Action.RequestAppeal');
                    Array.from(document.querySelectorAll('button')).forEach(b => {
                        try {
                            if (b && b.innerText && b.innerText.trim() === reportText) {
                                b.disabled = false;
                                b.style.pointerEvents = 'auto';
                                b.removeAttribute('aria-disabled');
                            }
                        } catch (e) {}
                    });
                } catch (e) { console.error('Error re-enabling report button', e); }
            }
        }

        const list = document.getElementById('evidence-list-main');
        if (list) {
            list.innerHTML = '';

            const genericItems = evidenceItems.filter(i => i.type === 'Generic');
            if (genericItems.length > 0) {
                const d = document.createElement('div'); d.className = 'field';
                const valuesHtml = genericItems.map(g => `<div>${g.val1 || t('Label.NoContent')}</div>`).join('');
                d.innerHTML = `<span class="label">Offensive item:</span><span class="value">${valuesHtml}</span>`;
                list.appendChild(d);
            }

            evidenceItems.filter(i => i.type !== 'Generic').forEach(i => {
                const d = document.createElement('div'); d.className = 'field';
                let label = i.type;
                if (i.type === 'ChatEvidence') label = (t('Label.ChatEvidenceID') || 'Chat Evidence ID');
                else if (i.type === 'Location') label = (t('Label.Location') || 'Location');
                d.innerHTML = `<span class="label">${label}:</span><span class="value">${i.val1 || t('Label.NoContent')}</span>`;
                list.appendChild(d);
            });

            const divider = document.getElementById('evidence-divider');
            if (divider) divider.style.display = evidenceItems.length > 0 ? 'block' : 'none';
        }
    }

    function handleSecondChanceToggle() {
        secondChanceEnabled = document.getElementById('second-chance-checkbox')?.checked || false;
        console.log('Second chance toggled:', secondChanceEnabled);
        updateContent();
    }

    function openAppealModal() {
        const modal = document.getElementById('appeal-modal');
        const formView = document.getElementById('modal-form-view');
        const successView = document.getElementById('modal-success-view');
        const textarea = document.getElementById('appeal-textarea');
        
        formView.style.display = 'block';
        successView.style.display = 'none';
        textarea.value = '';
        
        document.getElementById('modal-header').innerText = t('Heading.Appeals.RequestAppeal');
        document.getElementById('modal-description').innerText = t('Description.Appeals.ReviewsDetail');
        textarea.placeholder = t('Label.Appeals.ReasonPlaceholder.V2');
        document.getElementById('modal-cancel').innerText = t('Action.Appeals.Cancel');
        document.getElementById('modal-send').innerText = t('Action.Appeals.Send');
        document.getElementById('modal-subtext').innerText = t('Label.Appeals.SubtextNotice');
        
        modal.classList.add('active');
    }

    function closeAppealModal() {
        const modal = document.getElementById('appeal-modal');
        modal.classList.remove('active');
    }

    function sendAppeal() {
        const textarea = document.getElementById('appeal-textarea');
        const appealText = textarea.value.trim();
        
        const formView = document.getElementById('modal-form-view');
        const successView = document.getElementById('modal-success-view');
        
        formView.style.display = 'none';
        successView.style.display = 'block';
        
        document.getElementById('modal-success-header').innerText = t('Heading.Appeals.AppealReceived');
        document.getElementById('modal-success-description').innerText = t('Description.Appeals.AppealReceived');
        document.getElementById('modal-got-it').innerText = t('Action.Appeals.GotIt');
        
        console.log('Appeal sent:', appealText);
    }

    function handlePrimaryClick() {
        console.log('handlePrimaryClick invoked');
        const dur = document.getElementById('duration-select')?.value;
        const reason = document.getElementById('reason-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        console.log('Duration:', dur);
        console.log('Reason:', reason);
        console.log('Is Suspension:', isSuspension);
        console.log('Second Chance Enabled:', secondChanceEnabled);
        
        if (dur !== 'Banned') {
            if (secondChanceEnabled && isSuspension) {
                console.log('Going to second chance step 1');
                goToSecondChanceStep1();
            } else if (policyMap[reason]) {
                console.log('Going to policy step 1');
                goToPolicyStep1();
            } else {
                console.log('Going to rules step');
                goToRulesStep();
            }
        } else {
            console.log('Duration is Banned, opening appeal modal');
        }
    }

    function handleBackNavigation() {
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        if (secondChanceEnabled && isSuspension) {
            if (currentStep === 7) {
                goToRulesStep();
            } else if (currentStep === 5 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToPolicyStep1();
            } else if (currentStep === 3 && hasPolicy) {
                goToSecondChanceStep1();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep1();
            } else {
                resetToMain();
            }
        } else {
            if (currentStep === 4 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep1();
            } else {
                resetToMain();
            }
        }
    }

    function handleContinueClick() {
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn && finalBtn.disabled) return;
        
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        if (secondChanceEnabled && isSuspension) {
            if (currentStep === 2) {
                if (hasPolicy) {
                    goToPolicyStep1();
                } else {
                    goToRulesStep();
                }
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep2();
            } else if (currentStep === 5) {
                goToSecondChanceStep2();
            } else if (currentStep === 7) {
                console.log('Final continue confirmed on second chance step 2');
            }
        } else {
            if (currentStep === 2 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4) {
                console.log('Final continue confirmed on rules step');
            }
        }
    }

    function goToSecondChanceStep1() {
        currentStep = 2;
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        if (agreeWrap) agreeWrap.style.display = 'none';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt('btn-back', t('Action.Back'));
        setTxt('second-chance-title-1', t('Heading.SecondChance.First'));
        setTxt('second-chance-header-1', t('Heading.Subheading.SecondChance.V2'));
        setTxt('second-chance-description-1', t('Description.SecondChance.First'));

        try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}

        const finalBtn = document.getElementById('final-continue-btn');
        const agree = document.getElementById('agree-checkbox');
        
        if (agree) agree.checked = false;
        
        if (finalBtn) {
            finalBtn.disabled = false;
            finalBtn.innerText = t('Action.Continue');
            finalBtn.style.background = '#3355ff'; 
            finalBtn.style.border = 'none'; 
            finalBtn.style.color = '#ffffff'; 
            finalBtn.style.cursor = 'pointer'; 
            finalBtn.style.opacity = '1';
            finalBtn.style.pointerEvents = 'auto';
        }
        
        updateProgressBar();
    }

    function goToSecondChanceStep2() {
        currentStep = 7;
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt('btn-back', t('Action.Back'));
        setTxt('second-chance-title-2', t('Heading.SecondChance.Second'));
        setTxt('second-chance-description-2', t('Description.SecondChance.Second'));
        setTxt('lbl-agree', t('Label.AgreeToRules.V2'));

        const viewRulesBtn = document.getElementById('second-chance-view-rules-btn');
        if (viewRulesBtn) {
            viewRulesBtn.innerText = t('Action.ViewRules');
            viewRulesBtn.onclick = () => { console.log('View rules clicked from second chance'); };
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        const agreeCheckbox = document.getElementById('agree-checkbox');

        if (agreeCheckbox) {
            agreeCheckbox.checked = false;
        }

        if (agreeWrap) agreeWrap.style.display = 'flex';
        if (finalBtn) {
            finalBtn.disabled = true;
            finalBtn.style.background = '#3355ff';
            finalBtn.style.color = '#ffffff';
            finalBtn.style.border = 'none';
            finalBtn.innerText = t('Action.Continue');
            finalBtn.style.opacity = '0.5';
            finalBtn.style.cursor = 'not-allowed';
        }
        
        updateProgressBar();
    }

    function goToPolicyStep1() {
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        currentStep = secondChanceEnabled && isSuspension ? 3 : 2;
        const reason = document.getElementById('reason-select')?.value;
        const mapping = policyMap[reason];
        if (!mapping) { goToRulesStep(); return; }

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        if (agreeWrap) agreeWrap.style.display = 'none';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt('btn-back', t('Action.Back'));
        setTxt('policy-header-title-1', t(mapping.headerTop));
        setTxt('policy-violated-header', t(mapping.header));
        setTxt('display-policy-description', t(mapping.detail));

        const learnBtn = document.getElementById('policy-learn-more-btn-1');
        if (learnBtn) { 
            learnBtn.innerText = t('Action.LearnMore'); 
            learnBtn.onclick = () => { console.log('Learn more clicked for reason', reason); }; 
        }

        try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}

        const finalBtn = document.getElementById('final-continue-btn');
        const agree = document.getElementById('agree-checkbox');
        
        if (agree) agree.checked = false;
        
        if (finalBtn) {
            finalBtn.disabled = false;
            finalBtn.innerText = t('Action.Continue');
            finalBtn.style.background = '#3355ff'; 
            finalBtn.style.border = 'none'; 
            finalBtn.style.color = '#ffffff'; 
            finalBtn.style.cursor = 'pointer'; 
            finalBtn.style.opacity = '1';
            finalBtn.style.pointerEvents = 'auto';
        }
        
        updateProgressBar();
    }

    function goToPolicyStep2() {
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        currentStep = secondChanceEnabled && isSuspension ? 4 : 3;
        const reason = document.getElementById('reason-select')?.value;
        const mapping = policyMap[reason];
        if (!mapping) { goToRulesStep(); return; }

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        if (agreeWrap) agreeWrap.style.display = 'none';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt('btn-back', t('Action.Back'));
        setTxt('policy-header-title-2', t(mapping.importanceLabel));
        setTxt('display-policy-importance', t(mapping.importance));

        const learnBtn = document.getElementById('policy-learn-more-btn-2');
        if (learnBtn) { 
            learnBtn.innerText = t('Action.LearnMore'); 
            learnBtn.onclick = () => { console.log('Learn more (why) clicked for reason', reason); }; 
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agree = document.getElementById('agree-checkbox');
        
        if (agree) agree.checked = false;
        
        if (finalBtn) {
            finalBtn.disabled = false;
            finalBtn.innerText = t('Action.Continue');
            finalBtn.style.background = '#3355ff'; 
            finalBtn.style.border = 'none'; 
            finalBtn.style.color = '#ffffff'; 
            finalBtn.style.cursor = 'pointer'; 
            finalBtn.style.opacity = '1';
            finalBtn.style.pointerEvents = 'auto';
        }
        
        updateProgressBar();
    }

    function goToRulesStep() {
        const dur = document.getElementById('duration-select')?.value;
        const reason = document.getElementById('reason-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        const hasPolicy = policyMap[reason];
        
        if (secondChanceEnabled && isSuspension) {
            currentStep = hasPolicy ? 5 : 4;
        } else {
            currentStep = 4;
        }
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        
        setTxt('rules-header-title', t('Heading.RuleViolationsAddUp'));
        setTxt('rules-description', t('Description.Foreshadow.V2'));
        setTxt('rules-mistake-text', t('Description.Mistake.V3'));
        setTxt('lbl-agree', t('Label.AgreeToRules.V2'));
        setTxt('btn-back', t('Action.Back'));

        const viewRulesBtn = document.getElementById('btn-view-rules-inner');
        if (viewRulesBtn) {
            viewRulesBtn.innerText = t('Action.ViewRules');
            viewRulesBtn.onclick = () => { console.log('View rules clicked'); };
        }

        const reportBtn = document.getElementById('btn-report-mistake-rules');
        if (reportBtn) {
            reportBtn.innerText = t('Action.RequestAppeal');
            reportBtn.onclick = () => { openAppealModal(); };
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        const agreeCheckbox = document.getElementById('agree-checkbox');

        const suspensionDaysMap = { 'Suspended1Day': 1, 'Suspended3Days': 3, 'Suspended7Days': 7, 'Suspended14Days': 14 };
        
        if (dur.startsWith('Suspended') && suspensionDaysMap[dur] && !secondChanceEnabled) {
            const dateInputVal = document.getElementById('date-input')?.value;
            const startDate = dateInputVal ? new Date(dateInputVal) : (reviewDate || new Date());
            const days = suspensionDaysMap[dur];
            const endDate = new Date(startDate.getTime() + days * 24 * 60 * 60 * 1000);

            const updateSuspensionState = () => {
                const activeStep = currentStep;
                const dur = document.getElementById('duration-select')?.value;
                const isSuspension = dur.startsWith('Suspended');
                
                if (activeStep !== 4 && !(secondChanceEnabled && isSuspension && activeStep === 5)) return false;
                const now = new Date();
                const remMs = endDate.getTime() - now.getTime();
                
                if (remMs <= 0) {
                    if (agreeWrap) agreeWrap.style.display = 'flex';
                    if (finalBtn) {
                        finalBtn.disabled = true;
                        finalBtn.style.background = '#3355ff';
                        finalBtn.style.color = '#ffffff';
                        finalBtn.style.border = 'none';
                        finalBtn.innerText = t('Action.Continue');
                        finalBtn.style.cursor = 'not-allowed';
                        finalBtn.style.opacity = '0.5';
                    }
                    return true;
                } else {
                    if (agreeWrap) agreeWrap.style.display = 'none';
                    if (finalBtn) {
                        finalBtn.disabled = true;
                        finalBtn.innerText = t('Action.Continue');
                        finalBtn.style.background = 'transparent';
                        finalBtn.style.border = '1px solid var(--btn-gray)';
                        finalBtn.style.color = 'var(--text-muted)';
                        finalBtn.style.cursor = 'not-allowed';
                        finalBtn.style.opacity = '1';
                        const secs = Math.ceil(remMs / 1000);
                        const daysLeft = Math.ceil(secs / 86400);
                        let label = '';
                        if (daysLeft >= 1) label = `${t('Label.Suspension')}: ${daysLeft} day${daysLeft>1?'s':''}`;
                        else {
                            const hh = String(Math.floor((secs % 86400) / 3600)).padStart(2,'0');
                            const mm = String(Math.floor((secs % 3600) / 60)).padStart(2,'0');
                            label = `${t('Label.Suspension')}: ${hh}:${mm} hours`;
                        }
                        finalBtn.innerText = label;
                    }
                    return false;
                }
            };

            const expiredNow = updateSuspensionState();
            if (!expiredNow) {
                try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}
                suspensionIntervalId = setInterval(() => {
                    const nowExpired = updateSuspensionState();
                    if (nowExpired) { try { clearInterval(suspensionIntervalId); } catch(e) {} suspensionIntervalId = null; }
                }, 1000);
            }
        } else {
            if (agreeWrap) agreeWrap.style.display = 'flex';
            if (finalBtn) {
                finalBtn.disabled = true;
                finalBtn.style.background = '#3355ff';
                finalBtn.style.color = '#ffffff';
                finalBtn.style.border = 'none';
                finalBtn.innerText = t('Action.Continue');
                finalBtn.style.opacity = '0.5';
                finalBtn.style.cursor = 'not-allowed';
            }
        }
        
        updateProgressBar();
    }

    function resetToMain() {
        currentStep = 1;
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('footer-main-buttons').style.display = 'flex';
        document.getElementById('footer-rules-buttons').style.display = 'none';
        try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch (e) {}
        updateProgressBar();
    }

    function toggleContinueBtn() { 
        const c = document.getElementById('agree-checkbox'); 
        const b = document.getElementById('final-continue-btn'); 
        if (c && b) {
            b.disabled = !c.checked; 
            b.style.opacity = c.checked ? "1" : "0.5";
            b.style.cursor = c.checked ? "pointer" : "not-allowed";
        }
    }

    function reportMistakeClicked(event) {
        console.log('Report mistake clicked from card');
        openAppealModal();
    }

    function handleLogout() {
        console.log('Logout clicked');
    }

    init();
</script>
