<!DOCTYPE html>
<html lang="en"><head><style>
body {transition: opacity ease-in 0.2s; } 
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boible</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        
        * {
  font-family: "Public Sans", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
}
#display-desc {
    margin-top: 1px;
}
        #second-chance-checkbox {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .lbl-mistake-static {
            display: none!important;
        }
        :root {
            --bg-base: #101013; --bg-modal: #191a1f; --bg-card: #272930;
            --btn-gray: #30323a; --btn-gray-hover: #373a44; --btn-blue: #5e499c; 
            --btn-blue-hover: #604d9b --text-header: #f2f3f5; --text-normal: #dbdee1;
            --text-muted: #828282; --text-trace: #828282; --danger: #da373c;
            --shadow-border: rgba(90, 90, 90, 0.33); --radius-modal: 16px;
            --radius-card: 10px; --radius-btn: 8px; --panel-bg: #1e1f22;
            --btn-gray2: #353841; --btn-gray-hover2: #3d3f4b;
            --warning-orange: #f0b232;
        }
        body.light-mode {
            --bg-base: #bbb; --bg-modal: #f7f7f8; --bg-card: #E6E7EB;
            --btn-gray: #dbdcdf; --btn-gray-hover: #cdd0d8; --text-header: #3a3a3a;
            --text-normal: #444444; --text-muted: #616872; --text-trace: #676767;
            --shadow-border: rgba(200,200,200, 0.4); --panel-bg: #f9f9f9; 
            --btn-gray2: #cdcfd7; --btn-gray-hover2: #c0c2c7;
            --warning-orange: #d49a1f; 
        }

        body { 
            margin: 0; 
            background: var(--bg-base); 
            color: var(--text-normal);  
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background 0.2s ease; 
        }
        
.container { 
    width: 640px; 
    min-height: min(800px, 85vh); 
    height: auto;
    max-height: 800px;
    background: var(--bg-modal); 
    border-radius: var(--radius-modal); 
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
    position: relative; 
    box-shadow: 0 0 0 1px var(--shadow-border), 0 10px 10px rgba(0, 0, 0, 0.35); 
    overflow-y: auto; 
}
@media (max-width:550px) {
    .container { 
        max-height: 97vh;
    }
}
        
#agree-checkbox {
    background-color: var(--bg-card);
}
        .customizer-toggle { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: var(--btn-blue); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 0px 15px rgba(0,0,0,0.8); }
        
        @media (max-width: 768px) {
            .customizer-toggle {
                opacity: 0;
                width: 40px;
                height: 40px;
                padding: 0;
                left: 5px;
                bottom: 5px;
            }
            .customizer-toggle:active, .customizer-toggle:focus {
                opacity: 0.25;
            }
        }

        @media (max-width: 550px) {
            body {
                -webkit-touch-callout: none; /* Disables the callout menu (iOS) */
                -webkit-user-select: none;   /* Safari */
                -khtml-user-select: none;    /* Konqueror HTML */
                -moz-user-select: none;      /* Firefox */
                -ms-user-select: none;       /* Internet Explorer/Edge */
                user-select: none;           /* Standard syntax */
            }

            input, textarea {
                -webkit-user-select: text;
                user-select: text;
            }
        }

        @media (max-width: 550px) {

            .agree-section {
                flex-direction: column!important;
                align-items: flex-start!important;
                margin-bottom: 12px;
                font-size: 15px;
            }

    .modal-content {
        max-width: 85%!important;
    }

    .scrollable-body {
        padding: 20px 20px 0 20px!important;
    }

    #display-duration-title {
        line-height: 1.2!important;
        margin-bottom: 14px!important;
        margin-top: 12px!important;
        font-size: 21px!important;
    }

    h1 {
        line-height: 1.35!important;
        margin-bottom: 16px!important;
        margin-top: 12px!important;
        font-size: 22px!important;
    }

    .footer {
        margin-bottom: 5px!important;
    }
}

        .panel { position: fixed; left: -320px; top: 0; width: 300px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--shadow-border); z-index: 999; padding: 20px; box-sizing: border-box; transition: left 0.3s ease; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .panel.open { left: 0; }
        .panel h3 { margin: 0; font-size: 18px; color: var(--text-header); }
        .panel label { display: block; font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .panel select, .panel input:not([type="checkbox"]), .panel textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--shadow-border); background: var(--bg-card); color: var(--text-normal); font-family: inherit; margin-bottom: 10px; }
        
        .progress-bar-container {
            width: 94%;
            height: 5px;
            background-color: var(--btn-gray)!important;
            position: relative;
            margin-left: 3%;
            display: none;
            border-radius: 10px;
            margin-bottom: -8px;
            margin-top: 64px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #5E499C;
            transition: width 0.3s ease;
            width: 0%;
            border-radius: 10px;
        }
        
        .scrollable-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--btn-gray) transparent;
        }

        body.light-mode .container {
            box-shadow: 0 0 0 1px var(--shadow-border), 0 8px 10px rgba(170, 170, 170, 0.35); 
        }

        #main-view, #rules-view, #policy-view {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .footer { 
            flex-shrink: 0;
            display: flex; 
            justify-content: flex-end; 
            padding: 20px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-modal);
            border-bottom-left-radius: var(--radius-modal);
            border-bottom-right-radius: var(--radius-modal);
        }

        .btn-view-more, .btn-report-inner {
            font-size: 13px !important;
        }

        #footer-main-buttons, #footer-rules-buttons {
            margin-bottom: 1px
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; margin-top: 4px}
        .title-group { display: flex; align-items: center; gap: 12px; }
        .icon-container { width: 22px; height: 22px; position: relative; display: flex; align-items: center; justify-content: center; }
        .ban-icon { width: 22px; height: 22px; border: 2px solid var(--danger); border-radius: 50%; box-sizing: border-box; position: relative; }
        .ban-icon::after { content: ''; position: absolute; width: 2px; height: 100%; background: var(--danger); top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .svg-icon { width: 26px; height: 26px; }
        h1 { color: var(--text-header); font-size: 21px; font-weight: 700; margin: 0; line-height: 2.4; }
        .dots { color: var(--text-header); font-size: 20px; margin-right: 6px; cursor: pointer; line-height: 1; position: relative; }
        .description { font-size: 14px; color: var(--text-normal); margin: 0 0 21px 0; line-height: 1.; }
        h2 { font-size: 16px; font-weight: 700; color: var(--text-header); margin: 3px 0 12px 0; }
        .card { background: var(--bg-card); border-radius: var(--radius-card); padding: 16px 15px 16px 15px; margin-bottom: 21px; border: 1px rgba(0, 0, 0, 0.03); }
        .field { margin-bottom: 12px!important; }
        .card .field:last-child { margin-bottom: 0!important }
        .label { display: block; font-weight: 700; font-size: 14px; color: var(--text-header); margin-bottom: 2px; }
        .value { display: block; font-size: 14px; color: var(--text-normal); font-weight: 450; line-height: 1.4; }
        .btn-view-more { display: block; width: 100%; background: var(--btn-gray); color: var(--text-header); border: none; padding: 8.5px 0; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
        #view-more-btn { display: block; width: 100%; background: var(--btn-gray2)!important; color: var(--text-header); border: none; padding: 8.5px 0; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .trace-id { font-size: 12px; color: var(--text-trace); margin-top: -14px; font-weight: 600; padding-bottom: 21px; }
        .btn-report { font-weight: 600!important; color: #eeeeee; border: none; padding: 0px 12px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
        #evidence-overflow { display: none; }
        #policy-why-card { padding: 14px; margin-top: 0px; margin-bottom: 10px; }
        #policy-why-card .value { margin: 0; }

        /* HOVERS */
        .btn-view-more:hover, 
        .btn-logout:hover, 
        .modal-button.cancel:hover {
            background-color: var(--btn-gray-hover) !important;
            transition: background-color 0.2s ease;
        }

        #view-more-btn:hover {
            background-color: var(--btn-gray-hover2) !important;
            transition: background-color 0.2s ease;
        }

        body.light-mode .primary-action-btn-2:hover {
            background-color: #b3a5e4;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        .primary-action-btn-2:hover {
            background-color: #3b2c77;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        .btn-report:hover, 
        .customizer-toggle:hover {
            background-color: var(--btn-blue-hover);
            transition: 0.2s ease;
        }

        .modal-button.send:hover, .primary-action-btn-2:hover {
            filter: brightness(1.2); /* Slight brighten for the purple */
            transition: filter 0.2s ease;
        }

        input[type="checkbox"]:hover {
            border-color: var(--text-muted) !important;
            background-color: var(--btn-gray) !important;
        }

        #policy-header-title-1, #policy-header-title-2, #rules-header-title, #second-chance-title-1, #second-chance-title-2 {
            font-size: 24px;
        }

        #policy-violated-header, #second-chance-header-1, #second-chance-header-2 {
            margin-top: 6px!important;
            font-weight: 15px;
        }

        #display-policy-description, #rules-description, #display-policy-importance, #rules-mistake-text, #second-chance-description-1, #second-chance-description-2 {
            font-size: 15px!important;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            
            width: 20px;
            height: 20px;
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 4px;
            
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
        }

        input[type="checkbox"]:hover {
            border-color: rgb(17, 17, 17);
            background-color: var(--bg-base);
        }

        input[type="checkbox"]:checked {
            background-color: #5E499C!important;
            border-color: rgb(17, 17, 17)!important;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            
            background-color: var(--bg-modal);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.67);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-modal);
            border-radius: var(--radius-modal);
            padding: 20px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 0 1px var(--shadow-border), 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-header);
            margin-bottom: 10px;
        }

        .modal-description {
            font-size: 15px;
            color: var(--text-normal);
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .modal-textarea {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--shadow-border);
            background: var(--bg-modal);
            color: var(--text-normal);
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .modal-button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .modal-button.cancel {
            background: var(--btn-gray);
            color: var(--text-header);
        }

        .modal-button.cancel:hover {
            background: var(--btn-gray-hover);
        }

        .modal-button.send {
            background: #5E499C;
            color: #ffffff;
        }

        .modal-button.send:hover {
            opacity: 0.9;
        }

        .modal-subtext {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.3;
            margin-top: 15px;
        }

        @media (max-width: 640px) {
            .footer {
                flex-direction: column; 
                gap: 10px;
            }

            #footer-main-buttons {
                flex-direction: column;
                width: 100%;
            }

            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0; 
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
            }

            .btn-report {
                width: 100%;
                box-sizing: border-box;
            }

            #footer-rules-buttons {
                flex-direction: column !important;
                align-items: stretch !important;
            }

            #btn-back {
                width: auto !important;
                align-self: flex-start;
            }

            .agree-section {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
        }

        .btn-logout {
            background-color: var(--btn-gray2);
            border: none;
            margin-top: 8px;
            cursor: pointer;
            color: #eeeeee; 
            padding: 0px 12px; 
            height: 40px; 
            border-radius: var(--radius-btn); 
            font-size: 15px; 
            font-weight: 500; 
            font-family: inherit; 
            transition: opacity 0.2s;
        }

        body.light-mode .btn-logout {
            background-color: var(--btn-gray2);
            color: #111111;
        }

        .btn-logout:hover {
            background-color: var(--btn-gray-hover2);
        }
        
        #lbl-agree {
            font-weight: 500!important;
        }

        .dots-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-modal);
            border: 1px solid var(--shadow-border);
            border-radius: var(--radius-card);
            box-shadow: 0 4px 12px rgba(10, 10, 10, 0.33);
            display: none;
            z-index: 100;
        }

        .dots-menu.active {
            display: block;
        }

        .dots-menu-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 425;
            color: var(--text-normal);
            transition: background 0.25s;
        }

        .dots-menu-item:hover {
            background: var(--btn-gray);
        }

        .dots-menu-item:first-child {
            border-top-left-radius: var(--radius-btn);
            border-top-right-radius: var(--radius-btn);
        }

        .dots-menu-item:last-child {
            border-bottom-left-radius: var(--radius-btn);
            border-bottom-right-radius: var(--radius-btn);
        }

        .btn-back-arrow {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-header);
            font-size: 24px;
            margin-bottom: 20px!important;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            z-index: 10;
        }

        .btn-back-arrow:hover {
            background: var(--btn-gray2);
        }

        .btn-back-arrow.active {
            display: flex;
        }

        .suspension-countdown {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            height: 40px;
            background: transparent;
            border: 2px solid var(--btn-gray);
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-normal);
            box-sizing: border-box;
        }

        .suspension-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
            flex-shrink: 0;
        }
        .suspension-label {
            font-weight: 700;
        }

        .continue-disabled-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            justify-content: flex-end;
        }

        @media (max-width: 640px) {
            .continue-disabled-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            
            .continue-disabled-wrapper .btn-report {
                width: 100% !important;
            }
            
            .suspension-countdown {
                width: 100%;
                justify-content: center;
            }

            #image-preview-container {
                display: none;
            }
        }
    </style>
</head>
<body id="main-body" class="light-mode">

<button class="customizer-toggle" onclick="document.getElementById('side-panel').classList.toggle('open')">Settings</button>

<div class="modal-overlay" id="appeal-modal">
    <div class="modal-content">
        <div id="modal-form-view">
            <div class="modal-header" id="modal-header"></div>
            <div class="modal-description" id="modal-description"></div>
            <textarea class="modal-textarea" id="appeal-textarea" placeholder=""></textarea>
            <div class="modal-buttons">
                <button class="modal-button cancel" id="modal-cancel"></button>
                <button class="modal-button send" id="modal-send"></button>
            </div>
            <div class="modal-subtext" id="modal-subtext"></div>
        </div>
        <div id="modal-success-view" style="display: none;">
            <div class="modal-header" id="modal-success-header"></div>
            <div class="modal-description" id="modal-success-description"></div>
            <div class="modal-buttons">
                <button class="modal-button send" style="width: 100%;" id="modal-got-it"></button>
            </div>
        </div>
    </div>
</div>

<aside class="panel open" id="side-panel">
    <h3>Edit</h3>
    <div><label>Appearance</label><button class="btn-view-more" onclick="toggleMode()" id="toggle-btn">Switch to Dark</button></div>
    <div><label>Action Duration</label>
        <select id="duration-select" onchange="updateContent()">
            <option value="Warning">Warn</option>
            <option value="Suspended1Day">Suspend 1 day</option>
            <option value="Suspended3Days">Suspend 3 days</option>
            <option value="Suspended7Days">Suspend 7 days</option>
            <option value="Suspended14Days">Suspend 14 days</option>
            <option value="Banned" selected>Ban (Terminate)</option>
        </select>
    </div>
    <div><label>Reason</label>
        <select id="reason-select" onchange="updateContent()">
            <option value="Other">Other</option>
            <option value="Harassment.V2">Bullying and Harassment</option>
            <option value="ExtortionThreats">Extortion and Threats</option>
            <option value="Spam">Spam</option>
            <option value="Scamming">Scamming</option>
            <option value="DiscriminationHate.V2">Discriminatory Content</option>
            <option value="SexualContent">Sexual Content</option>
            <option value="MisusingSystems">Misusing Boible Systems</option>
            <option value="PrivacyGivingPII">Privacy: Giving PII</option>
            <option value="PrivacyAskingPII">Privacy: Asking for PII</option>
            <option value="PoliticalContent.V2">Political Figures and Entities</option>
            <option value="Impersonation">Impersonation</option>
            <option value="ViolentGore">Violent Content and Gore</option>
            <option value="UndisclosedAds">Undisclosed Advertisement</option>
            <option value="DisruptiveAudio">Disruptive Audio</option>
            <option value="DangerousActivities">Dangerous Activities</option>
            <option value="Misinformation">Misinformation</option>
            <option value="Dating.V2">Dating and Romantic Content</option>
            <option value="SensitiveEvents">Real-World Sensitive Events</option>
            <option value="IllegalRegulated">Illegal or Regulated Content</option>
            <option value="RepeatedRefunds">Repeated Refund Requests</option>
            <option value="Chargebacks">Chargebacks</option>
            <option value="IPViolation.V2">IP Violation</option>
            <option value="TerrorismExtremism.V2">Terrorism and Extremism</option>
            <option value="ChildEndangerment">Child Endangerment</option>
            <option value="ChildEndangerment.V3">Harmful Content/Behaviour</option>
            <option value="AbuseOfBoibleEmployees">Abuse of Boible Employees</option>
            <option value="AccountTheft">Account Theft</option>
        </select>
    </div>
    <div><label>Moderator Note Presets</label><select id="note-preset" onchange="applyPresetNote()"><option value="">-- Choose a Preset --</option>
        <option value="AltConsequence.V2">Enforcement/Ban Evasion</option>
        <option value="ChildEndangerment">Child Endangerment</option>

    async function init() {
        try { 
            const res = await fetch('en.json'); 
            translations = await res.json(); 
        } catch (e) { 
            console.error("Translation load failed.");
            translations = {}; 
        }
        
        updateContent();
        
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn) {
            finalBtn.onclick = handleContinueClick;
        }
        
        const agree = document.getElementById('agree-checkbox');
        if (agree) {
            try { agree.checked = false; } catch (e) {}
            agree.setAttribute('autocomplete', 'off');
            agree.removeAttribute('checked');
            try { agree.removeAttribute('name'); } catch (e) {}
        }

        document.getElementById('modal-cancel').onclick = closeAppealModal;
        document.getElementById('modal-send').onclick = sendAppeal;
        document.getElementById('modal-got-it').onclick = closeAppealModal;

        const dotsTrigger = document.getElementById('dots-trigger');
        const dotsMenu = document.getElementById('dots-menu');
        const logoutMenuItem = document.getElementById('logout-menu-item');

        dotsTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            dotsMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!dotsTrigger.contains(e.target)) {
                dotsMenu.classList.remove('active');
            }
        });

        logoutMenuItem.addEventListener('click', () => {
            handleLogout();
            dotsMenu.classList.remove('active');
        });

        logoutMenuItem.innerText = t('Action.Logout') || 'Log out';
    }

    function t(key, vars = {}) {
        if (!translations) return key;
        let val = translations[key];
        if (val === undefined || val === null) return key;
        for (const k in vars) val = val.replace(`{{${k}}}`, vars[k]);
        return val;
    }

    function getFormattedDate() {
        const now = reviewDate || new Date();
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
        return `${now.toLocaleDateString('en-US', options)} at ${now.toLocaleTimeString('en-US', timeOptions)}`;
    }

    function updateProgressBar() {
        const progressBar = document.getElementById('progress-bar-fill');
        const progressContainer = document.getElementById('progress-bar-container');
        const backArrow = document.getElementById('btn-back-arrow');
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value || 'Warning';
        const isSuspension = dur.startsWith('Suspended');
        
        if (currentStep === 1) {
            progressContainer.style.display = 'none';
            backArrow.classList.remove('active');
            return;
        }
        
        backArrow.classList.add('active');
        progressContainer.style.display = 'block';
        
        let progress = 0;
        
        if (secondChanceEnabled && isSuspension) {
            // Flow: main -> second chance 1 (step 2) -> policy 1 (step 3) -> policy 2 (step 4) -> rules (step 5) -> second chance 2 (step 7)
            // Or if no policy: main -> second chance 1 (step 2) -> rules (step 4) -> second chance 2 (step 7)
            if (hasPolicy) {
                // 5 steps total (excluding main and final)
                if (currentStep === 2) progress = 20;      // second chance 1
                else if (currentStep === 3) progress = 40; // policy 1
                else if (currentStep === 4) progress = 60; // policy 2
                else if (currentStep === 5) progress = 80; // rules
                else if (currentStep === 7) progress = 100; // second chance 2
            } else {
                // 3 steps total (excluding main and final)
                if (currentStep === 2) progress = 33.33;    // second chance 1
                else if (currentStep === 4) progress = 66.67; // rules
                else if (currentStep === 7) progress = 100;   // second chance 2
            }
        } else if (hasPolicy) {
            if (currentStep === 2) progress = 33.33;
            else if (currentStep === 3) progress = 66.67;
            else if (currentStep === 4) progress = 100;
        } else {
            if (currentStep === 4) progress = 100;
        }
        
        progressBar.style.width = progress + '%';
    }
    
    function toggleMode() {
        try {
            const body = document.getElementById('main-body') || document.body;
            const btn = document.getElementById('toggle-btn');
            const isLight = body.classList.contains('light-mode');
            if (isLight) {
                body.classList.remove('light-mode');
                if (btn) btn.innerText = t('Action.Theme.SwitchLight') || 'Switch to Light';
            } else {
                body.classList.add('light-mode');
                if (btn) btn.innerText = t('Action.Theme.SwitchDark') || 'Switch to Dark';
            }
            try { updateContent(); } catch (e) { }
        } catch (e) { console.error('toggleMode error', e); }
    }

    function toggleEvidence() {
        const overflow = document.getElementById('evidence-overflow');
        const btn = document.getElementById('view-more-btn');
        const total = evidenceItems.length;
        if (!overflow || !btn) return;
        if (total <= 5) return;
        const isOpen = overflow.style.display === 'block';
        if (isOpen) {
            overflow.style.display = 'none';
            btn.innerText = t('Action.ViewDetails');
        } else {
            overflow.style.display = 'block';
            btn.innerText = t('Action.ViewLess');
        }
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Calculate dimensions to fit in 500x500
                let width = img.width;
                let height = img.height;
                const maxSize = 500;
                
                if (width > height) {
                    if (width > maxSize) {
                        height = (height * maxSize) / width;
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width = (width * maxSize) / height;
                        height = maxSize;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('clear-image-btn').style.display = 'block';
                updateContent();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function clearImagePreview() {
        uploadedImageBase64 = null;
        document.getElementById('image-upload-input').value = '';

    function addEvidenceItem() { 
        if (currentType === 'None') return;
        
        // Allow multiple items for Generic, SeriousChatViolation, and VoiceEvidence
        if (currentType !== 'Generic' && currentType !== 'SeriousChatViolation' && currentType !== 'VoiceEvidence' && evidenceItems.length >= 1) return;
        
        const makeUUID = () => { 
            try { 
                return (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : ('id-' + Math.random().toString(16).slice(2)); 
            } catch(e){ 
                return 'id-' + Math.random().toString(16).slice(2); 
            } 
        };
        
        const generate12DigitID = () => {
            return Math.floor(100000000000 + Math.random() * 900000000000).toString();
        };
        
        let item = { 
            id: Date.now() + Math.random(), 
            type: currentType, 
            val1: '', 
            val2: '',
            val3: ''
        };

        // Handle SeriousChatViolation (formerly ChatEvidence)
        if (currentType === 'SeriousChatViolation') {
            const banTime = reviewDate || new Date();
            const chatTime = new Date(banTime.getTime() - 17 * 60 * 1000);
            const pad = (n) => n.toString().padStart(2, '0');
            const ts = `${chatTime.getFullYear()}-${pad(chatTime.getMonth()+1)}-${pad(chatTime.getDate())}::${pad(chatTime.getHours())}:${pad(chatTime.getMinutes())}:${pad(chatTime.getSeconds())}`;
            item.val1 = `[${ts}]: ${makeUUID()}`;
        }
        
        // Handle VoiceEvidence
        else if (currentType === 'VoiceEvidence') {
            const banTime = reviewDate || new Date();
            const voiceTime = new Date(banTime.getTime() - 17 * 60 * 1000);
            const pad = (n) => n.toString().padStart(2, '0');
            const ts = `${voiceTime.getFullYear()}-${pad(voiceTime.getMonth()+1)}-${pad(voiceTime.getDate())}::${pad(voiceTime.getHours())}:${pad(voiceTime.getMinutes())}:${pad(voiceTime.getSeconds())}`;
            item.val1 = `[${ts}]: ${makeUUID()}`;
        }
        
        // Handle ProfilePicture
        else if (currentType === 'ProfilePicture') {
            item.val1 = generate12DigitID();
        }
        
        // Handle Payment
        else if (currentType === 'Payment') {
            const paymentDate = reviewDate || new Date();
            const dateStr = paymentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            const timeStr = paymentDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            item.val1 = t('Label.PaymentTimestampValue', { date: dateStr, time: timeStr });
            item.val2 = generate12DigitID();
        }
        
        // Handle VoiceChat (formerly Location)
        else if (currentType === 'VoiceChat') {
            const vcDate = reviewDate || new Date();
            const dateStr = vcDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            const timeStr = vcDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            item.val1 = t('Label.VoiceChatTimestampValue', { date: dateStr, time: timeStr });
            item.val2 = ''; // Location - user input
        }
        
        // Handle Image, Video, Audio, Model, Game, Asset (Name + ID)
        else if (['Image', 'Video', 'Audio', 'Model', 'Game', 'Asset'].includes(currentType)) {
            item.val1 = ''; // Name field - user input
            item.val2 = generate12DigitID(); // Auto-generated ID
        }
        
        // Handle Post, Comment (Content + ID)
        else if (['Post', 'Comment'].includes(currentType)) {
            item.val1 = ''; // Content - user input
            item.val2 = generate12DigitID(); // Auto-generated ID
        }
        
        // Handle Video (existing behavior for val3)
        else if (currentType === 'Video') {
            item.val3 = t('Label.EntireVideo') || 'Entire Video';
        }
        
        // Handle Generic
        else if (currentType === 'Generic') {
            item.val1 = ''; // User input
        }

        evidenceItems.push(item); 
        renderEvidenceControls(); 
        updateContent();
    }

            const hasViolations = violations.length > 0;
            
            const warningFilter = 'invert(70%) sepia(65%) saturate(600%) hue-rotate(351deg) brightness(95%) contrast(90%)';
            const suspensionFilter = 'invert(31%) sepia(93%) saturate(1292%) hue-rotate(1deg) brightness(94%) contrast(92%)';

            let descKey = 'Description.GenericDescription';
            let descVars = {};
            
            // Determine which description to use
            if (!hasViolations) {
                // No violations or only chat/voice evidence - use generic/specific
                if (reason === 'Other') {
                    descKey = 'Description.GenericDescription.V2';
                } else {
                    descKey = 'Description.SpecificDescription.V2';

                    } else {
                        descKey = 'Description.SpecificDescription.V2';
                        descVars = { reason: t(`Label.Reason.${reason}`).toLowerCase() };
                    }
                }
                // All other types use plural descriptions

        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');

            if (currentStep === 7) {

            } else if (currentStep === 5 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToPolicyStep1();
            } else if (currentStep === 3 && hasPolicy) {
                goToSecondChanceStep1();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep1();
            } else {
                resetToMain();
            }
        } else {
            if (currentStep === 4 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep1();
            } else {
                resetToMain();
            }
        }
    }

    function handleContinueClick() {
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn && finalBtn.disabled) return;
        
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        if (secondChanceEnabled && isSuspension) {
            if (currentStep === 2) {
                if (hasPolicy) {
                    goToPolicyStep1();
                } else {
                    goToRulesStep();
                }
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep2();
            } else if (currentStep === 5) {
                goToSecondChanceStep2();
            } else if (currentStep === 7) {
                console.log('Final continue confirmed on second chance step 2');
            }
        } else {
            if (currentStep === 2 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4) {
                console.log('Final continue confirmed on rules step');
            }
        }
    }

    function goToRulesStep() {
        const dur = document.getElementById('duration-select')?.value;
        const reason = document.getElementById('reason-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        const hasPolicy = policyMap[reason];
        
        if (secondChanceEnabled && isSuspension) {
            currentStep = hasPolicy ? 5 : 4;
        } else {
            currentStep = 4;
        }
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        
        setTxt('rules-header-title', t('Heading.RuleViolationsAddUp'));
        setTxt('rules-description', t('Description.Foreshadow.V2'));
        setTxt('rules-mistake-text', t('Description.Mistake.V3'));
        setTxt('lbl-agree', t('Label.AgreeToRules.V2'));

        const viewRulesBtn = document.getElementById('btn-view-rules-inner');
        if (viewRulesBtn) {
            viewRulesBtn.innerText = t('Action.ViewRules');
            viewRulesBtn.onclick = () => { console.log('View rules clicked'); };
        }

        const reportBtn = document.getElementById('btn-report-mistake-rules');
        if (reportBtn) {
            reportBtn.innerText = t('Action.RequestAppeal');
            reportBtn.onclick = () => { openAppealModal(); };
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        const agreeCheckbox = document.getElementById('agree-checkbox');

        const suspensionDaysMap = { 'Suspended1Day': 1, 'Suspended3Days': 3, 'Suspended7Days': 7, 'Suspended14Days': 14 };
        
        if (dur.startsWith('Suspended') && !secondChanceEnabled && suspensionDaysMap[dur]) {
            const dateInputVal = document.getElementById('date-input')?.value;
            const startDate = dateInputVal ? new Date(dateInputVal) : (reviewDate || new Date());
            const days = suspensionDaysMap[dur];
            const endDate = new Date(startDate.getTime() + days * 24 * 60 * 60 * 1000);

            const updateSuspensionState = () => {
                const activeStep = currentStep;
                const dur = document.getElementById('duration-select')?.value;
                const isSuspension = dur.startsWith('Suspended');
                
                if (activeStep !== 4 && !(secondChanceEnabled && isSuspension && activeStep === 5)) return false;
                const now = new Date();
                const remMs = endDate.getTime() - now.getTime();
                
                if (remMs <= 0) {
                    if (agreeWrap) agreeWrap.style.display = 'flex';
                    if (finalBtn) {
                        finalBtn.disabled = true;
                        finalBtn.style.background = '#5E499C';
                        finalBtn.style.color = '#ffffff';
                        finalBtn.style.border = 'none';
                        finalBtn.innerText = t('Action.Continue');
                        finalBtn.style.cursor = 'not-allowed';
                        finalBtn.style.opacity = '0.5';
                    }
                    return true;
                } else {
                    const secs = Math.ceil(remMs / 1000);
                    const totalDays = remMs / (1000 * 60 * 60 * 24);
                    const daysLeft = Math.ceil(totalDays);
                    const hoursLeft = Math.floor((remMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutesLeft = Math.floor((remMs % (1000 * 60 * 60)) / (1000 * 60));
                    const secondsLeft = Math.floor((remMs % (1000 * 60)) / 1000);
                    
                    let label = '';
                    const suspensionLabel = t('Label.Suspension') || 'Suspension';
                    
                    if (totalDays >= 1) {
                        const roundedDays = (totalDays % 1 >= 0.5) ? Math.ceil(totalDays) : Math.floor(totalDays);
                        if (roundedDays === 1) {
                            label = t('Label.CountdownSingleDay', { d: roundedDays }) || `${roundedDays} day`;
                        } else {
                            label = t('Label.CountdownMultipleDays', { d: roundedDays }) || `${roundedDays} days`;
                        }
                    } else if (hoursLeft >= 1) {
                        const hh = String(hoursLeft).padStart(2, '0');
                        const mm = String(minutesLeft).padStart(2, '0');
                        label = t('Label.CountdownHoursMinutes', { h: hh, m: mm }) || `${hh}:${mm} hours`;
                    } else {
                        const mm = String(minutesLeft).padStart(2, '0');
                        const ss = String(secondsLeft).padStart(2, '0');
                        label = t('Label.CountdownMinutesSeconds', { m: mm, s: ss }) || `${mm}:${ss} minutes`;
                    }
                    
                    if (!secondChanceEnabled) {
                        if (agreeWrap) agreeWrap.style.display = 'none';
                        
                        const existingWrapper = document.getElementById('continue-disabled-wrapper');
                        if (existingWrapper) {
                            existingWrapper.remove();
                        }
                        
                        const wrapper = document.createElement('div');
                        wrapper.id = 'continue-disabled-wrapper';
                        wrapper.className = 'continue-disabled-wrapper';
                        
                        const countdown = document.createElement('div');
                        countdown.className = 'suspension-countdown';
                        
                        const icon = document.createElement('img');
                        icon.src = 'https://www.svgrepo.com/show/455819/exclamation-triangle.svg';
                        icon.className = 'suspension-icon';
                        const isLight = document.body.classList.contains('light-mode');
                        icon.style.filter = isLight ? 'invert(70%) sepia(65%) saturate(600%) hue-rotate(351deg) brightness(95%) contrast(90%)' : 'invert(80%) sepia(89%) saturate(300%) hue-rotate(351deg) brightness(69%) contrast(176%)';
                        
                        const labelSpan = document.createElement('span');
                        labelSpan.className = 'suspension-label';
                        labelSpan.innerText = suspensionLabel;
                        
                        const timeSpan = document.createElement('span');
                        timeSpan.innerText = ' ' + label;
                        
                        countdown.appendChild(icon);
                        countdown.appendChild(labelSpan);
                        countdown.appendChild(timeSpan);
                        
                        wrapper.appendChild(countdown);
                        
                        const continueBtn = document.createElement('button');
                        continueBtn.className = 'btn-report';
                        continueBtn.disabled = true;
                        continueBtn.innerText = t('Action.Continue');
                        continueBtn.style.background = '#5E499C';
                        continueBtn.style.color = '#ffffff';
                        continueBtn.style.border = 'none';
                        continueBtn.style.opacity = '0.5';
                        continueBtn.style.cursor = 'not-allowed';
                        
                        wrapper.appendChild(continueBtn);
                        
                        const footerButtons = document.getElementById('footer-rules-buttons');
                        if (finalBtn) finalBtn.style.display = 'none';
                        footerButtons.appendChild(wrapper);
                    } else {
                        if (agreeWrap) agreeWrap.style.display = 'none';
                        if (finalBtn) {
                            finalBtn.disabled = true;
                            finalBtn.innerText = label;
                            finalBtn.style.background = 'transparent';
                            finalBtn.style.border = '3px solid var(--btn-gray)';
                            finalBtn.style.color = 'var(--text-muted)';
                            finalBtn.style.cursor = 'not-allowed';
                            finalBtn.style.opacity = '1';
                            
                            const existingIcon = finalBtn.querySelector('.suspension-icon');
                            if (!existingIcon) {
                                const icon = document.createElement('img');
                                icon.src = 'https://www.svgrepo.com/show/455819/exclamation-triangle.svg';
                                icon.className = 'suspension-icon';
                                const isLight = document.body.classList.contains('light-mode');
                                icon.style.filter = isLight ? 'invert(70%) sepia(65%) saturate(600%) hue-rotate(351deg) brightness(95%) contrast(90%)' : 'invert(80%) sepia(89%) saturate(300%) hue-rotate(351deg) brightness(69%) contrast(176%)';
                                icon.style.marginRight = '8px';
                                finalBtn.insertBefore(icon, finalBtn.firstChild);
                            }
                            
                            const textNode = Array.from(finalBtn.childNodes).find(n => n.nodeType === 3);
                            if (textNode) {
                                textNode.textContent = ` ${suspensionLabel}: ${label}`;
                            }
                        }
                    }
                    return false;
                }
            };

            const expiredNow = updateSuspensionState();
            if (!expiredNow) {
                try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}
                suspensionIntervalId = setInterval(() => {
                    const nowExpired = updateSuspensionState();
                    if (nowExpired) { 
                        try { clearInterval(suspensionIntervalId); } catch(e) {} 
                        suspensionIntervalId = null;
                        const wrapper = document.getElementById('continue-disabled-wrapper');
                        if (wrapper) wrapper.remove();
                        if (finalBtn) finalBtn.style.display = 'block';
                    }
                }, 1000);
            }
        } else {
            if (agreeWrap) agreeWrap.style.display = 'flex';
            if (finalBtn) {
                finalBtn.disabled = true;
                finalBtn.style.background = '#5E499C';
                finalBtn.style.color = '#ffffff';
                finalBtn.style.border = 'none';
                finalBtn.innerText = t('Action.Continue');
                finalBtn.style.opacity = '0.5';
                finalBtn.style.cursor = 'not-allowed';
                finalBtn.style.display = 'block';
            }
            const wrapper = document.getElementById('continue-disabled-wrapper');
            if (wrapper) wrapper.remove();
        }
        
        updateProgressBar();
    }

    function toggleContinueBtn() { 
        const c = document.getElementById('agree-checkbox'); 
        const b = document.getElementById('final-continue-btn'); 
        if (c && b) {
            b.disabled = !c.checked; 
            b.style.opacity = c.checked ? "1" : "0.5";
            b.style.cursor = c.checked ? "pointer" : "not-allowed";
        }
    }

    function reportMistakeClicked(event) {
        console.log('Report mistake clicked from card');
        openAppealModal();
    }

    function handleLogout() {
        console.log('Logout clicked');
    }

    init();
</script>

</body></html>
