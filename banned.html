        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            
            width: 20px;
            height: 20px;
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 4px;
            
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            border: 1px solid var(--btn-gray-hover)!important;
        }

        input[type="checkbox"]:hover {
            background-color: var(--bg-base);
            border: 1px solid var(--btn-gray)!important;
        }

        input[type="checkbox"]:checked {
            background-color: #7309e4!important;
            border: none!important;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            
            background-color: var(--bg-modal);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        /* Skeleton Loading Animation */
@keyframes shimmer {
    0% {
        background-position: -1000px 0;
    }
    100% {
        background-position: 1000px 0;
    }
}

.skeleton-loading {
    background: linear-gradient(
        90deg,
        var(--bg-card) 0%,
        var(--btn-gray) 20%,
        var(--bg-card) 40%,
        var(--bg-card) 100%
    );
    background-size: 1000px 100%;
    animation: shimmer 1.2s ease-in-out infinite;
    color: transparent !important;
    pointer-events: none;
    user-select: none;
    border-radius: 10px;
}

/* Circle skeleton for icons and dots */
.skeleton-loading.skeleton-circle {
    border-radius: 50% !important;
}

/* Half-width skeleton for headers outside cards */
.skeleton-loading.skeleton-half {
    width: 50%;
    border-radius: 6px;
}

/* Small border radius for trace */
.skeleton-loading.skeleton-trace {
    border-radius: 6px;
}

.skeleton-loading * {
    visibility: hidden;
}

.skeleton-loading::before,
.skeleton-loading::after {
    visibility: hidden;
}

body.loaded .skeleton-loading {
    animation: none;
    background: none;
    color: inherit !important;
    pointer-events: auto;
    user-select: auto;
    border-radius: initial;
    width: auto;
}

body.loaded .skeleton-loading * {
    visibility: visible;
}

body.loaded .skeleton-loading::before,
body.loaded .skeleton-loading::after {
    visibility: visible;
}

#display-trace.skeleton-loading {
    width: 35%;
    max-height: 20px!important;
    padding: 0
}

#txt-activity.skeleton-loading,
#txt-why.skeleton-loading {
    width: 45%;
}

.focus-visible-ring:focus-visible {
    outline: 2px solid #7309e4;
    outline-offset: 2px;
}

.focus-visible-ring-inset:focus-visible {
    outline: 2px solid #7309e4;

.focus-visible-none:focus:not(:focus-visible) {
    outline: none;
}

/* Remove default focus styles */
button:focus,
input:focus,
textarea:focus,
select:focus,
[tabindex]:focus {
    outline: none;
}

/* Apply focus-visible styles */
button:focus-visible,
input:focus-visible,

.focusable:focus-visible {

    if (!container || !headerSection || !backArrow || !dotsRules || !progressBar || !scrollableBody) return;
    
    // Remove all elements first
    backArrow.remove();
    dotsRules.remove();
    headerSection.remove();
    progressBar.remove();
    scrollableBody.remove();
    if (footer) footer.remove();
    
    if (experimentAppMode) {

        container.appendChild(backArrow);
        container.appendChild(dotsRules);
        container.appendChild(progressBar);
        container.appendChild(scrollableBody);

        container.appendChild(backArrow);
        container.appendChild(dotsRules);
        container.appendChild(progressBar);
        container.appendChild(scrollableBody);
        if (footer) container.appendChild(footer);
    }

        );
        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];

        if (e.shiftKey && document.activeElement === firstElement) {
            e.preventDefault();
            lastElement.focus();
        } else if (!e.shiftKey && document.activeElement === lastElement) {
            e.preventDefault();
            firstElement.focus();
        }
    }

    function updateProgressBar() {
    const progressBar = document.getElementById('progress-bar-fill');
    const progressContainer = document.getElementById('progress-bar-container');
    const backArrow = document.getElementById('btn-back-arrow');
    const dotsRules = document.getElementById('btn-dots-rules');
    const reason = document.getElementById('reason-select')?.value;
    const hasPolicy = policyMap[reason];
    const dur = document.getElementById('duration-select')?.value || 'Warning';
    const isSuspension = dur.startsWith('Suspended');
    
    if (currentStep === 1) {
        progressContainer.style.display = 'none';
        backArrow.classList.remove('active');
        if (dotsRules) dotsRules.classList.remove('active');
        return;
    }
    
    if (dotsRules) dotsRules.classList.add('active');
    backArrow.classList.add('active');
    
    // Hide progress bar if experiment is disabled
    if (!experimentEnableEducationalPages) {
        progressContainer.style.display = 'none';
        return;
    }
    
    progressContainer.style.display = 'block';
    
    let progress = 0;
    
    if (secondChanceEnabled && isSuspension) {
        // Flow: main -> second chance 1 (step 2) -> policy 1 (step 3) -> policy 2 (step 4) -> rules (step 5) -> second chance 2 (step 7)
        // Or if no policy: main -> second chance 1 (step 2) -> rules (step 4) -> second chance 2 (step 7)
        if (hasPolicy) {
            // 5 steps total (excluding main and final)
            if (currentStep === 2) progress = 20;      // second chance 1
            else if (currentStep === 3) progress = 40; // policy 1
            else if (currentStep === 4) progress = 60; // policy 2
            else if (currentStep === 5) progress = 80; // rules
            else if (currentStep === 7) progress = 100; // second chance 2
        } else {
            // 3 steps total (excluding main and final)
            if (currentStep === 2) progress = 33.33;    // second chance 1
            else if (currentStep === 4) progress = 66.67; // rules
            else if (currentStep === 7) progress = 100;   // second chance 2
        }
    } else if (hasPolicy) {
        if (currentStep === 2) progress = 33.33;
        else if (currentStep === 3) progress = 66.67;
        else if (currentStep === 4) progress = 100;
    } else {
        if (currentStep === 4) progress = 100;
    }
    
    progressBar.style.width = progress + '%';
}

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Calculate dimensions to fit in 500x500
                let width = img.width;
                let height = img.height;
                const maxSize = 500;
                
                if (width > height) {
                    if (width > maxSize) {
                        height = (height * maxSize) / width;
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width = (width * maxSize) / height;
                        height = maxSize;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('clear-image-btn').style.display = 'block';
                updateContent();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function addEvidenceItem() { 
        if (currentType === 'None') return;
        
        // Allow multiple items for Generic, SeriousChatViolation, and VoiceEvidence
        if (currentType !== 'Generic' && currentType !== 'SeriousChatViolation' && currentType !== 'VoiceEvidence' && evidenceItems.length >= 1) return;
        
        const makeUUID = () => { 
            try { 
                return (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : ('id-' + Math.random().toString(16).slice(2)); 
            } catch(e){ 
                return 'id-' + Math.random().toString(16).slice(2); 
            } 
        };
        
        const generate12DigitID = () => {
            return Math.floor(100000000000 + Math.random() * 900000000000).toString();
        };
        
        let item = { 
            id: Date.now() + Math.random(), 
            type: currentType, 
            val1: '', 
            val2: '',
            val3: ''
        };

        // Handle SeriousChatViolation (formerly ChatEvidence)
        if (currentType === 'SeriousChatViolation') {
            const banTime = reviewDate || new Date();
            const chatTime = new Date(banTime.getTime() - 17 * 60 * 1000);
            const pad = (n) => n.toString().padStart(2, '0');
            const ts = `${chatTime.getFullYear()}-${pad(chatTime.getMonth()+1)}-${pad(chatTime.getDate())}::${pad(chatTime.getHours())}:${pad(chatTime.getMinutes())}:${pad(chatTime.getSeconds())}`;
            item.val1 = `[${ts}]: ${makeUUID()}`;
        }
        
        // Handle VoiceEvidence
        else if (currentType === 'VoiceEvidence') {
            const banTime = reviewDate || new Date();
            const voiceTime = new Date(banTime.getTime() - 17 * 60 * 1000);
            const pad = (n) => n.toString().padStart(2, '0');
            const ts = `${voiceTime.getFullYear()}-${pad(voiceTime.getMonth()+1)}-${pad(voiceTime.getDate())}::${pad(voiceTime.getHours())}:${pad(voiceTime.getMinutes())}:${pad(voiceTime.getSeconds())}`;
            item.val1 = `[${ts}]: ${makeUUID()}`;
        }
        
        // Handle ProfilePicture"
        else if (currentType === 'ProfilePicture') {
            item.val1 = generate12DigitID();
        }
        
        // Handle Payment
        else if (currentType === 'Payment') {
            const paymentDate = reviewDate || new Date();
            const dateStr = paymentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            const timeStr = paymentDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            item.val1 = t('Label.PaymentTimestampValue', { date: dateStr, time: timeStr });
            item.val2 = generate12DigitID();
        }
        
        // Handle VoiceChat (formerly Location)
        else if (currentType === 'VoiceChat') {
            const vcDate = reviewDate || new Date();
            const dateStr = vcDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            const timeStr = vcDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            item.val1 = t('Label.VoiceChatTimestampValue', { date: dateStr, time: timeStr });
            item.val2 = ''; // Location - user input
        }

        else if (currentType === 'InExperienceBehaviour') {
            item.val2 = 'Avatar movement'; // Default interaction type
            item.val3 = makeUUID(); // Auto-generated Interaction ID
        }
        
        // Handle Image, Video, Audio, Model, Game, Asset (Name + ID)
        else if (['Image', 'Video', 'Audio', 'Model', 'Game', 'Asset'].includes(currentType)) {
            item.val1 = ''; // Name field - user input
            item.val2 = generate12DigitID(); // Auto-generated ID
        }
        
        // Handle Post, Comment (Content + ID)
        else if (['Post', 'Comment'].includes(currentType)) {
            item.val1 = ''; // Content - user input
            item.val2 = generate12DigitID(); // Auto-generated ID
        }
        
        // Handle Video (existing behavior for val3)
        else if (currentType === 'Video') {
            item.val3 = t('Label.EntireVideo') || 'Entire Video';
        }
        
        // Handle Generic
        else if (currentType === 'Generic') {
            item.val1 = ''; // User input
        }

        // Handle Username and Display Name
        else if (['Username', 'DisplayName'].includes(currentType)) {
            item.val1 = ''; // User input
        }

        // Handle User About
        else if (currentType === 'AboutBio') {
            item.val1 = ''; // User input
        }

        // Handle UGC items
        else if (['UGCProfileDecoration', 'UGCProfileBanner', 'UGCProfileEffect'].includes(currentType)) {
            item.val1 = ''; // UGC name - user input
            item.val2 = generate12DigitID(); // Auto-generated ID
        }

        evidenceItems.push(item); 
        renderEvidenceControls(); 
        updateContent();
    }

    // Load ban data from localStorage
    function loadBanData() {
        const saved = localStorage.getItem('banData');
        if (!saved) return false;
        
        try {
            const banData = JSON.parse(saved);
            
            // Restore form values
            if (document.getElementById('duration-select')) document.getElementById('duration-select').value = banData.duration;
            if (document.getElementById('reason-select')) document.getElementById('reason-select').value = banData.reason;
            if (document.getElementById('note-input')) document.getElementById('note-input').value = banData.note;
            if (document.getElementById('date-input')) document.getElementById('date-input').value = banData.reviewDate;
            if (document.getElementById('evidence-type')) document.getElementById('evidence-type').value = banData.evidenceType;
            if (document.getElementById('eu-decision-select')) document.getElementById('eu-decision-select').value = banData.euDecision;
            if (document.getElementById('reason2-select')) document.getElementById('reason2-select').value = banData.reason2 || '';

            experimentAppModeShowImages = banData.experiments.appModeShowImages ?? false;
            if (document.getElementById('experiment-app-mode-show-images-checkbox')) {
                document.getElementById('experiment-app-mode-show-images-checkbox').checked = experimentAppModeShowImages;
            }
            
            // Restore evidence items
            evidenceItems = banData.evidenceItems || [];
            currentType = banData.evidenceType || 'None';
            
            // Restore second chance
            secondChanceEnabled = banData.secondChanceEnabled || false;
            if (document.getElementById('second-chance-checkbox')) {
                document.getElementById('second-chance-checkbox').checked = secondChanceEnabled;
            }
            
            // Restore uploaded image
            uploadedImageBase64 = banData.uploadedImage || null;
            
            if (banData.experiments) {
                experimentEnableEducationalPages = banData.experiments.educational ?? true;
                experimentEUTransparency = banData.experiments.euTransparency ?? false;
                experimentHideLearnMore = banData.experiments.hideLearnMore ?? false;
                experimentSettingsInMenu = banData.experiments.settingsMenu ?? true;
                experimentSendAppeal = banData.experiments.sendAppeal ?? false;
                experimentAppMode = banData.experiments.appMode ?? (window.innerWidth <= 800);
                
                if (document.getElementById('experiment-educational-checkbox')) document.getElementById('experiment-educational-checkbox').checked = experimentEnableEducationalPages;
                if (document.getElementById('experiment-eu-checkbox')) document.getElementById('experiment-eu-checkbox').checked = experimentEUTransparency;
                if (document.getElementById('experiment-hide-learn-more-checkbox')) document.getElementById('experiment-hide-learn-more-checkbox').checked = experimentHideLearnMore;
                if (document.getElementById('experiment-settings-menu-checkbox')) document.getElementById('experiment-settings-menu-checkbox').checked = experimentSettingsInMenu;
                if (document.getElementById('experiment-send-appeal-checkbox')) document.getElementById('experiment-send-appeal-checkbox').checked = experimentSendAppeal;
                if (document.getElementById('experiment-app-mode-checkbox')) document.getElementById('experiment-app-mode-checkbox').checked = experimentAppMode;
                
                if (experimentAppMode) {
                    document.body.classList.add('app-mode');
                }
            }
            const reason2Container = document.getElementById('reason2-container');
            const supportsMultipleReasons = ['VoiceChat', 'Comment', 'Post', 'UGCProfileDecoration', 'UGCProfileBanner', 'UGCProfileEffect', 'InExperienceBehaviour'].includes(currentType);
            if (reason2Container) {
                reason2Container.style.display = supportsMultipleReasons ? 'block' : 'none';
            }
            console.log('Ban data loaded from localStorage');
            return true;
        } catch (e) {
            console.error('Error loading ban data:', e);
            return false;
        }
    }

    function handleBackNavigation() {
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        // If educational pages are disabled, always go back to main
        if (!experimentEnableEducationalPages) {
            resetToMain();
            return;
        }
        
        if (secondChanceEnabled && isSuspension) {
            if (currentStep === 7) {
                goToRulesStep();
            } else if (currentStep === 5 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToPolicyStep1();
            } else if (currentStep === 3 && hasPolicy) {
                goToSecondChanceStep1();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep1();
            } else {
                resetToMain();
            }
        } else {
            if (currentStep === 4 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep1();
            } else {
                resetToMain();
            }
        }
    }

    function handleContinueClick() {
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn && finalBtn.disabled) return;
        
        const reason = document.getElementById('reason-select')?.value;
        const hasPolicy = policyMap[reason];
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        
        if (secondChanceEnabled && isSuspension) {
            if (currentStep === 2) {
                if (hasPolicy) {
                    goToPolicyStep1();
                } else {
                    goToRulesStep();
                }
            } else if (currentStep === 3 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 4 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4 && !hasPolicy) {
                goToSecondChanceStep2();
            } else if (currentStep === 5) {
                goToSecondChanceStep2();
            } else if (currentStep === 7) {
                console.log('Final continue confirmed on second chance step 2');
            }
        } else {
            if (currentStep === 2 && hasPolicy) {
                goToPolicyStep2();
            } else if (currentStep === 3 && hasPolicy) {
                goToRulesStep();
            } else if (currentStep === 4) {
                console.log('Final continue confirmed on rules step');
            }
        }
    }

    function goToPolicyStep1() {
    const dur = document.getElementById('duration-select')?.value;
    const isSuspension = dur.startsWith('Suspended');
    const headerSection = document.querySelector('.header-section');
    if (headerSection) headerSection.style.display = 'none';
    
    currentStep = secondChanceEnabled && isSuspension ? 3 : 2;
    const reason = document.getElementById('reason-select')?.value;
    const reason2 = document.getElementById('reason2-select')?.value || '';
    const mapping = policyMap[reason];
    if (!mapping) { goToRulesStep(); return; }

    document.getElementById('main-view').style.display = 'none';
    document.getElementById('policy-view-2').style.display = 'none';
    document.getElementById('rules-view').style.display = 'none';

    document.getElementById('footer-rules-buttons').style.display = 'flex';

    if (agreeWrap) agreeWrap.style.display = 'none';

    const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

    setTxt('policy-header-title-1', t(mapping.headerTop));
    setTxt('policy-violated-header', t(mapping.header));
    setTxt('display-policy-description', t(mapping.detail));

    // Handle dotpoints for applicable policies
    if (mapping.hasDotpoints) {
        const descEl = document.getElementById('display-policy-description');
        if (descEl) {
            if (reason === 'PrivacyGivingPII' || reason === 'PrivacyAskingPII') {
                const detailV2 = t('Description.PIIDetail.V2');
                const dotpoints = [
                    t('Label.PIIDotpoint1'),
                    t('Label.PIIDotpoint2'),
                    t('Label.PIIDotpoint3'),
                    t('Label.PIIDotpoint4'),
                    t('Label.PIIDotpoint5')
                ].map(point => `  • ${point}`).join('\n');
                descEl.innerText = `${detailV2}\n\n${dotpoints}`;
            } else if (reason === 'MisusingSystems') {
                const detail = t('Description.MisusingSystemsDetail');
                const dotpoints = [
                    t('Label.MisuingSystemsDotpoint1'),
                    t('Label.MisuingSystemsDotpoint2'),
                    t('Label.MisuingSystemsDotpoint3'),
                    t('Label.MisuingSystemsDotpoint4')
                ].map(point => `  • ${point}`).join('\n');
                descEl.innerText = `${detail}\n\n${dotpoints}`;
            }
        }
    }

    // Add second reason content if exists
    const policyContainer = document.getElementById('policy-view-1');
    const existingReason2Section = document.getElementById('policy-reason2-section');
    if (existingReason2Section) existingReason2Section.remove();
    
    if (reason2 && reason2 !== '') {
        const mapping2 = policyMap[reason2];
        if (mapping2) {
            const reason2Section = document.createElement('div');
            reason2Section.id = 'policy-reason2-section';
            reason2Section.className = 'margin-top-2xlarge';
            
            const header2 = document.createElement('h2');
            header2.className = 'text-xlarge text-header-color margin-bottom-medium';
            header2.innerText = t(mapping2.header);
            
            const desc2 = document.createElement('span');
            desc2.className = 'value text-large text-normal-color';
            desc2.style.whiteSpace = 'pre-wrap';
            desc2.innerText = t(mapping2.detail);
            
            reason2Section.appendChild(header2);
            reason2Section.appendChild(desc2);
            
            // Insert before the learn more button
            const learnBtn = document.getElementById('policy-learn-more-btn-1');
            if (learnBtn && learnBtn.parentElement) {
                learnBtn.parentElement.insertBefore(reason2Section, learnBtn.parentElement.querySelector('.margin-top-medium'));
            }
        }
    }

    const learnBtn = document.getElementById('policy-learn-more-btn-1');
    if (learnBtn) { 
        learnBtn.innerText = t('Action.LearnMore'); 
        learnBtn.onclick = () => { window.open('https://boiby.dev/Boiby-Community-Standards', '_blank'); };
        learnBtn.style.display = experimentHideLearnMore ? 'none' : 'block';
    }

    try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}

    const finalBtn = document.getElementById('final-continue-btn');
    const agree = document.getElementById('agree-checkbox');
    
    if (agree) agree.checked = false;
    
    if (finalBtn) {
        finalBtn.disabled = false;
        finalBtn.innerText = t('Action.Continue');
        finalBtn.style.background = '#7309e4'; 
        finalBtn.style.border = 'none'; 
        finalBtn.style.color = '#ffffff'; 
        finalBtn.style.cursor = 'pointer'; 
        finalBtn.style.opacity = '1';
        finalBtn.style.pointerEvents = 'auto';
    }

    const wrapper = document.getElementById('continue-disabled-wrapper');
    if (wrapper) wrapper.remove();
    if (finalBtn) finalBtn.style.display = 'block';
    
    updateProgressBar();
}

    function goToPolicyStep2() {
        const dur = document.getElementById('duration-select')?.value;
        const isSuspension = dur.startsWith('Suspended');
        const headerSection = document.querySelector('.header-section');
        if (headerSection) headerSection.style.display = 'none';
        
        currentStep = secondChanceEnabled && isSuspension ? 4 : 3;
        const reason = document.getElementById('reason-select')?.value;
        const mapping = policyMap[reason];
        if (!mapping) { goToRulesStep(); return; }

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        if (agreeWrap) agreeWrap.style.display = 'none';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };

        setTxt('policy-header-title-2', t(mapping.importanceLabel));
        setTxt('display-policy-importance', t(mapping.importance));

        const learnBtn = document.getElementById('policy-learn-more-btn-2');
        if (learnBtn) { 
            learnBtn.innerText = t('Action.LearnMore'); 
            learnBtn.onclick = () => { window.open('https://boiby.dev/Boiby-Community-Standards', '_blank'); }; 
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agree = document.getElementById('agree-checkbox');
        
        if (agree) agree.checked = false;
        
        if (finalBtn) {
            finalBtn.disabled = false;
            finalBtn.innerText = t('Action.Continue');
            finalBtn.style.background = '#7309e4'; 
            finalBtn.style.border = 'none'; 
            finalBtn.style.color = '#ffffff'; 
            finalBtn.style.cursor = 'pointer'; 
            finalBtn.style.opacity = '1';
            finalBtn.style.pointerEvents = 'auto';
        }

        const wrapper = document.getElementById('continue-disabled-wrapper');
        if (wrapper) wrapper.remove();
        if (finalBtn) finalBtn.style.display = 'block';
        
        updateProgressBar();
    }

    function goToRulesStep() {
        const dur = document.getElementById('duration-select')?.value;
        const reason = document.getElementById('reason-select')?.value;
        const headerSection = document.querySelector('.header-section');
        if (headerSection) headerSection.style.display = 'none';
        const isSuspension = dur.startsWith('Suspended');
        const hasPolicy = policyMap[reason];
        const rulesHeaderTitle = document.getElementById('rules-header-title');
        if (rulesHeaderTitle) {
            if (!experimentEnableEducationalPages) {
                rulesHeaderTitle.style.marginTop = '36px';
            } else {
                rulesHeaderTitle.style.marginTop = ''; // Reset to default
            }
        }

        if (!experimentEnableEducationalPages) {
            currentStep = 4;
        } else if (secondChanceEnabled && isSuspension) {
            currentStep = hasPolicy ? 5 : 4;
        } else {
            currentStep = 4;
        }
        
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'flex';
        document.getElementById('footer-main-buttons').style.display = 'none';
        document.getElementById('footer-rules-buttons').style.display = 'flex';

        const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
        
        setTxt('rules-header-title', t('Heading.RuleViolationsAddUp'));
        setTxt('rules-description', t('Description.Foreshadow.V2'));
        setTxt('rules-mistake-text', t('Description.Mistake.V4'));
        setTxt('lbl-agree', t('Label.AgreeToRules.V2'));

        const viewRulesBtn = document.getElementById('btn-view-rules-inner');
        if (viewRulesBtn) {
            viewRulesBtn.innerText = t('Action.ViewRules');
            viewRulesBtn.onclick = () => { window.open('https://boiby.dev/Boiby-Community-Standards', '_blank'); };
        }

        const reportBtn = document.getElementById('btn-report-mistake-rules');
        if (reportBtn) {
            reportBtn.innerText = experimentSendAppeal ? t('Action.ReportMistake') : t('Action.AppealDecision');
            reportBtn.onclick = () => { openAppealModal(); };
        }

        const finalBtn = document.getElementById('final-continue-btn');
        const agreeWrap = document.getElementById('footer-rules-buttons')?.querySelector('label');
        const agreeCheckbox = document.getElementById('agree-checkbox');
        const suspensionDaysMap = { 'Suspended1Day': 1, 'Suspended3Days': 3, 'Suspended7Days': 7, 'Suspended14Days': 14 };
        
        if (dur.startsWith('Suspended') && !secondChanceEnabled && suspensionDaysMap[dur]) {
            const dateInputVal = document.getElementById('date-input')?.value;
            const startDate = dateInputVal ? new Date(dateInputVal) : (reviewDate || new Date());
            const days = suspensionDaysMap[dur];
            const endDate = new Date(startDate.getTime() + days * 24 * 60 * 60 * 1000);

            const updateSuspensionState = () => {
                const activeStep = currentStep;
                const dur = document.getElementById('duration-select')?.value;
                const isSuspension = dur.startsWith('Suspended');
                
                if (activeStep !== 4 && !(secondChanceEnabled && isSuspension && activeStep === 5)) return false;
                const now = new Date();
                const remMs = endDate.getTime() - now.getTime();
                
                if (remMs <= 0) {
                    if (agreeWrap) agreeWrap.style.display = 'flex';
                    if (finalBtn) {
                        finalBtn.disabled = true;
                        finalBtn.style.background = '#7309e4';
                        finalBtn.style.color = '#ffffff';
                        finalBtn.style.border = 'none';
                        finalBtn.innerText = t('Action.Continue');
                        finalBtn.style.cursor = 'not-allowed';
                        finalBtn.style.opacity = '0.5';
                    }
                    return true;
                } else {
                    const secs = Math.ceil(remMs / 1000);
                    const totalDays = remMs / (1000 * 60 * 60 * 24);
                    const daysLeft = Math.ceil(totalDays);
                    const hoursLeft = Math.floor((remMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutesLeft = Math.floor((remMs % (1000 * 60 * 60)) / (1000 * 60));
                    const secondsLeft = Math.floor((remMs % (1000 * 60)) / 1000);
                    
                    let label = '';
                    const suspensionLabel = t('Label.Suspension') || 'Suspension';
                    
                    if (totalDays >= 1) {
                        const roundedDays = (totalDays % 1 >= 0.5) ? Math.ceil(totalDays) : Math.floor(totalDays);
                        if (roundedDays === 1) {
                            label = t('Label.CountdownSingleDay', { d: roundedDays }) || `${roundedDays} day`;
                        } else {
                            label = t('Label.CountdownMultipleDays', { d: roundedDays }) || `${roundedDays} days`;
                        }
                    } else if (hoursLeft >= 1) {
                        const hh = String(hoursLeft).padStart(2, '0');
                        const mm = String(minutesLeft).padStart(2, '0');
                        label = t('Label.CountdownHoursMinutes', { h: hh, m: mm }) || `${hh}:${mm} hours`;
                    } else {
                        const mm = String(minutesLeft).padStart(2, '0');
                        const ss = String(secondsLeft).padStart(2, '0');
                        label = t('Label.CountdownMinutesSeconds', { m: mm, s: ss }) || `${mm}:${ss} minutes`;
                    }
                    
                    if (!secondChanceEnabled) {
                        if (agreeWrap) agreeWrap.style.display = 'none';
                        
                        const existingWrapper = document.getElementById('continue-disabled-wrapper');
                        if (existingWrapper) {
                            existingWrapper.remove();
                        }
                        
                        const wrapper = document.createElement('div');
                        wrapper.id = 'continue-disabled-wrapper';
                        wrapper.className = 'continue-disabled-wrapper';
                        
                        const countdown = document.createElement('div');
                        countdown.className = 'suspension-countdown';
                        
                        const icon = document.createElement('img');
                        icon.src = 'https://www.svgrepo.com/show/455819/exclamation-triangle.svg';
                        icon.className = 'suspension-icon';
                        const isLight = document.body.classList.contains('light-mode');
                        icon.style.filter = isLight ? 'invert(70%) sepia(65%) saturate(600%) hue-rotate(351deg) brightness(95%) contrast(90%)' : 'invert(80%) sepia(89%) saturate(300%) hue-rotate(351deg) brightness(69%) contrast(176%)';
                        
                        const labelSpan = document.createElement('span');
                        labelSpan.className = 'suspension-label';
                        labelSpan.innerText = suspensionLabel;
                        
                        const timeSpan = document.createElement('span');
                        timeSpan.innerText = ' ' + label;
                        
                        countdown.appendChild(icon);
                        countdown.appendChild(labelSpan);
                        countdown.appendChild(timeSpan);
                        
                        wrapper.appendChild(countdown);
                        
                        const continueBtn = document.createElement('button');
                        continueBtn.className = 'btn-report';
                        continueBtn.disabled = true;
                        continueBtn.innerText = t('Action.Continue');
                        continueBtn.style.background = '#7309e4';
                        continueBtn.style.color = '#ffffff';
                        continueBtn.style.border = 'none';
                        continueBtn.style.opacity = '0.5';
                        continueBtn.style.cursor = 'not-allowed';
                        
                        wrapper.appendChild(continueBtn);
                        
                        const footerButtons = document.getElementById('footer-rules-buttons');
                        if (finalBtn) finalBtn.style.display = 'none';
                        footerButtons.appendChild(wrapper);
                    } else {
                        if (agreeWrap) agreeWrap.style.display = 'none';
                        if (finalBtn) {
                            finalBtn.disabled = true;
                            finalBtn.innerText = label;
                            finalBtn.style.background = 'transparent';
                            finalBtn.style.border = '3px solid var(--btn-gray)';
                            finalBtn.style.color = 'var(--text-muted)';
                            finalBtn.style.cursor = 'not-allowed';
                            finalBtn.style.opacity = '1';
                            
                            const existingIcon = finalBtn.querySelector('.suspension-icon');
                            if (!existingIcon) {
                                const icon = document.createElement('img');
                                icon.src = 'https://www.svgrepo.com/show/455819/exclamation-triangle.svg';
                                icon.className = 'suspension-icon';
                                const isLight = document.body.classList.contains('light-mode');
                                icon.style.filter = isLight ? 'invert(70%) sepia(65%) saturate(600%) hue-rotate(351deg) brightness(95%) contrast(90%)' : 'invert(80%) sepia(89%) saturate(300%) hue-rotate(351deg) brightness(69%) contrast(176%)';
                                icon.style.marginRight = '8px';
                                finalBtn.insertBefore(icon, finalBtn.firstChild);
                            }
                            
                            const textNode = Array.from(finalBtn.childNodes).find(n => n.nodeType === 3);
                            if (textNode) {
                                textNode.textContent = ` ${suspensionLabel}: ${label}`;
                            }
                        }
                    }
                    return false;
                }
            };

            const expiredNow = updateSuspensionState();
            if (!expiredNow) {
                try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch(e) {}
                suspensionIntervalId = setInterval(() => {
                    const nowExpired = updateSuspensionState();
                    if (nowExpired) { 
                        try { clearInterval(suspensionIntervalId); } catch(e) {} 
                        suspensionIntervalId = null;
                        const wrapper = document.getElementById('continue-disabled-wrapper');
                        if (wrapper) wrapper.remove();
                        if (finalBtn) finalBtn.style.display = 'block';
                    }
                }, 1000);
            }
        } else {
            if (agreeWrap) agreeWrap.style.display = 'flex';
            if (finalBtn) {
                finalBtn.disabled = true;
                finalBtn.style.background = '#7309e4';
                finalBtn.style.color = '#ffffff';
                finalBtn.style.border = 'none';
                finalBtn.innerText = t('Action.Continue');
                finalBtn.style.opacity = '0.5';
                finalBtn.style.cursor = 'not-allowed';
                finalBtn.style.display = 'block';
            }
            const wrapper = document.getElementById('continue-disabled-wrapper');
            if (wrapper) wrapper.remove();
        }
        
        updateProgressBar();
    }

    function resetToMain() {
        currentStep = 1;
        const headerSection = document.querySelector('.header-section');
        if (headerSection) headerSection.style.display = 'block';
        document.getElementById('policy-view-1').style.display = 'none';
        document.getElementById('policy-view-2').style.display = 'none';
        document.getElementById('rules-view').style.display = 'none';
        document.getElementById('second-chance-view-1').style.display = 'none';
        document.getElementById('second-chance-view-2').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('footer-main-buttons').style.display = 'flex';
        document.getElementById('footer-rules-buttons').style.display = 'none';
        try { if (suspensionIntervalId) { clearInterval(suspensionIntervalId); suspensionIntervalId = null; } } catch (e) {}
        const wrapper = document.getElementById('continue-disabled-wrapper');
        if (wrapper) wrapper.remove();
        const finalBtn = document.getElementById('final-continue-btn');
        if (finalBtn) finalBtn.style.display = 'block';
        updateProgressBar();
    }

    function toggleContinueBtn() { 
        const c = document.getElementById('agree-checkbox'); 
        const b = document.getElementById('final-continue-btn'); 
        if (c && b) {
            b.disabled = !c.checked; 
            b.style.opacity = c.checked ? "1" : "0.5";
            b.style.cursor = c.checked ? "pointer" : "not-allowed";
        }
    }

    function reportMistakeClicked(event) {
        console.log('Report mistake clicked from card');
        openAppealModal();
    }

    function handleLogout() {
        console.log('Logout clicked');
    }

    init();
    setTimeout(() => {
        document.body.classList.add('loaded');
    }, 300);
    setTimeout(() => {
    document.querySelectorAll('.skeleton-loading').forEach(el => {
        el.classList.remove('skeleton-loading');
    });
}, 300);
</script>
