<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BoibyPhone 21 Configurator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://boiby.dev/location.js" defer></script>
</head>
<body>
  <h1>BoibyPhone 21</h1>

  <div class="configurator">
    <div class="preview">
      <img id="phoneImage" src="21Black.png" alt="BoibyPhone 21">
    </div>

    <div class="options">
      <label>Colour:</label>
      <select id="colour" onchange="updateImage()">
        <option>Black</option>
        <option>White</option>
        <option>Green</option>
        <option>Blue</option>
        <option>Pink</option>
      </select>

      <label>Storage:</label>
      <select id="storage">
        <option value="256">256GB — A$1399 / US$799</option>
        <option value="512">512GB — A$1599 / US$899</option>
      </select>

      <div class="buttons">
        <button>Add to Cart</button>
        <button id="pickupDeliveryBtn" onclick="openLocationModal()">Pickup & Delivery</button>
      </div>
    </div>
  </div>

  <!-- Pickup & Delivery Modal -->
  <div id="locationModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeLocationModal()">&times;</span>
      <h2>Pickup and Delivery</h2>

      <label>Country:</label>
      <select id="country">
        <option>Australia</option>
        <option>United States</option>
        <option>United Kingdom</option>
      </select>

      <label>Postcode:</label>
      <input id="postcode" placeholder="Enter postcode">
      <p class="note">This information is only stored locally and processed locally. You only need to use your approximate location.</p>

      <div class="actions">
        <button onclick="checkDelivery()">Delivery</button>
        <button onclick="checkPickup()">Pickup</button>
      </div>

      <div id="result"></div>
    </div>
  </div>

  <script>
    function updateImage() {
      const colour = document.getElementById('colour').value;
      document.getElementById('phoneImage').src = `21${colour}.png`;
    }
  </script>
</body>
</html>
