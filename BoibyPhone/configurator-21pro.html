<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BoibyPhone 21 Pro Configurator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://boiby.dev/location.js" defer></script>
</head>
<body>
  <h1>BoibyPhone 21 Pro</h1>

  <div class="configurator">
    <div class="preview">
      <img id="phoneImage" src="21ProPacificBlue.png" alt="BoibyPhone 21 Pro">
    </div>

    <div class="options">
      <label>Model:</label>
      <select id="model" onchange="updateImage()">
        <option value="Pro">BoibyPhone 21 Pro (6.3")</option>
        <option value="ProMax">BoibyPhone 21 Pro Max (6.8")</option>
      </select>

      <label>Colour:</label>
      <select id="colour" onchange="updateImage()">
        <option>PacificBlue</option>
        <option>DeepRed</option>
        <option>Obsidian</option>
        <option>Silver</option>
      </select>

      <label>Storage:</label>
      <select id="storage">
        <option value="512">512GB (Base)</option>
        <option value="1TB">1TB — A$2199/US$1399 (Pro) | A$2399/US$1499 (Pro Max)</option>
        <option value="2TB">2TB — A$2799/US$1799 (Pro) | A$2999/US$1899 (Pro Max)</option>
      </select>

      <div class="buttons">
        <button>Add to Cart</button>
        <button id="pickupDeliveryBtn" onclick="openLocationModal()">Pickup & Delivery</button>
      </div>
    </div>
  </div>

  <!-- Same modal -->
  <div id="locationModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeLocationModal()">&times;</span>
      <h2>Pickup and Delivery</h2>

      <label>Country:</label>
      <select id="country">
        <option>Australia</option>
        <option>United States</option>
        <option>United Kingdom</option>
      </select>

      <label>Postcode:</label>
      <input id="postcode" placeholder="Enter postcode">
      <p class="note">This information is only stored locally and processed locally. You only need to use your approximate location.</p>

      <div class="actions">
        <button onclick="checkDelivery()">Delivery</button>
        <button onclick="checkPickup()">Pickup</button>
      </div>

      <div id="result"></div>
    </div>
  </div>

  <script>
    function updateImage() {
      const colour = document.getElementById('colour').value;
      const model = document.getElementById('model').value;
      document.getElementById('phoneImage').src = `21${model}${colour}.png`;
    }
  </script>
</body>
</html>
