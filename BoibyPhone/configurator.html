<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoibyPhone Configurator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #111;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h1 { font-weight: 600; }
    img { max-width: 300px; margin: 1rem auto; display: block; }

    select, button, input {
      font-family: inherit;
      padding: 0.6rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 0.5rem;
      font-size: 1rem;
    }

    button {
      cursor: pointer;
      background: #111;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #333; }

    .container {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: left;
      box-shadow: 0 4px 30px rgba(0,0,0,0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #555;
    }

    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 0.5rem;
    }

    #storeResults {
      margin-top: 1rem;
    }

    .store {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin: 0.5rem 0;
      text-align: left;
    }

    .store h3 {
      margin: 0 0 0.3rem;
    }

    .availability {
      color: green;
      font-weight: 600;
    }

    #showAllStores {
      display: none;
      margin-top: 1rem;
      background: #007aff;
      color: white;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>BoibyPhone Configurator</h1>
    <img id="phonePreview" src="images/21Black.png" alt="BoibyPhone">

    <div id="configOptions">
      <select id="modelSelect">
        <option value="21">BoibyPhone 21</option>
        <option value="21Pro">BoibyPhone 21 Pro</option>
        <option value="21ProMax">BoibyPhone 21 Pro Max</option>
      </select>

      <select id="colorSelect"></select>

      <select id="storageSelect"></select>

      <div>
        <button id="addToCart">Add to Cart</button>
        <button id="pickupDeliveryBtn">Pickup and Delivery</button>
      </div>
    </div>
  </div>

  <div id="pickupModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Pickup and Delivery</h2>
        <button class="close" id="closeModal">&times;</button>
      </div>

      <label>Country:</label>
      <select id="countrySelect">
        <option value="Australia">Australia</option>
        <option value="United States">United States</option>
        <option value="United Kingdom">United Kingdom</option>
      </select>

      <label>Postcode:</label>
      <input type="text" id="postcodeInput" placeholder="Enter postcode">

      <p class="note">
        This information is only stored locally and processed locally. You only need to use your approximate location.
      </p>

      <div style="margin-top:1rem;">
        <button id="deliveryBtn">Delivery</button>
        <button id="pickupBtn">Pickup</button>
      </div>

      <button id="showAllStores">Show All Stores</button>

      <div id="storeResults"></div>
    </div>
  </div>

  <script src="location.js"></script>
  <script>
    const colors = {
      "21": ["Black", "White", "Green", "Blue", "Pink"],
      "21Pro": ["PacificBlue", "DeepRed", "Obsidian", "Silver"],
      "21ProMax": ["PacificBlue", "DeepRed", "Obsidian", "Silver"]
    };

    const storageOptions = {
      "21": [
        { size: "256GB", price: "A$1399 / US$799" },
        { size: "512GB", price: "A$1599 / US$899" }
      ],
      "21Pro": [
        { size: "512GB", price: "A$1999 / US$1199" },
        { size: "1TB", price: "A$2199 / US$1399" },
        { size: "2TB", price: "A$2799 / US$1799" }
      ],
      "21ProMax": [
        { size: "512GB", price: "A$2199 / US$1299" },
        { size: "1TB", price: "A$2399 / US$1499" },
        { size: "2TB", price: "A$2999 / US$1899" }
      ]
    };

    const modelSelect = document.getElementById("modelSelect");
    const colorSelect = document.getElementById("colorSelect");
    const storageSelect = document.getElementById("storageSelect");
    const preview = document.getElementById("phonePreview");

    function updateOptions() {
      const model = modelSelect.value;
      colorSelect.innerHTML = "";
      colors[model].forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        colorSelect.appendChild(opt);
      });
      updateStorage();
      updateImage();
    }

    function updateStorage() {
      const model = modelSelect.value;
      storageSelect.innerHTML = "";
      storageOptions[model].forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.size;
        opt.textContent = `${s.size} (${s.price})`;
        storageSelect.appendChild(opt);
      });
    }

    function updateImage() {
      const model = modelSelect.value;
      const color = colorSelect.value;
      const imageName = model === "21" ? `21${color}.png` : `21Pro${color}.png`;
      preview.src = `images/${imageName}`;
    }

    modelSelect.addEventListener("change", updateOptions);
    colorSelect.addEventListener("change", updateImage);
    updateOptions();
  </script>
</body>
</html>
