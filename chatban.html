<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Public Sans", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
        }
        :root {
            --bg-base: #101013;
            --bg-modal: #191a1f;
            --bg-card: #272930;
            --btn-gray: #333640;
            --btn-gray-hover: #444757;
            --text-header: #f2f3f5;
            --text-normal: #dbdee1;
            --text-muted: #909090;
            --text-trace: #909090;
            --shadow-border: rgba(90, 90, 90, 0.33);
            --radius-modal: 16px;
            --radius-card: 10px;
            --radius-btn: 8px;
            --panel-bg: #1e1f22;
        }

        body {
            margin: 0;
            background: var(--bg-base);
            color: var(--text-normal);
            font-family: 'gg sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.2s ease;
        }

        .customizer-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: #5865f2;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .customizer-toggle {
                opacity: 0;
                width: 40px;
                height: 40px;
                padding: 0;
                left: 5px;
                bottom: 5px;
            }
            .customizer-toggle:active {
                opacity: 0.25;
            }
        }

        .panel {
            position: fixed;
            left: -320px;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--shadow-border);
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
            transition: left 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel.open {
            left: 0;
        }

        .panel h3 {
            margin: 0;
            font-size: 18px;
            color: var(--text-header);
        }

        .panel label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .panel select, .panel input:not([type="checkbox"]), .panel textarea {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--shadow-border);
            background: var(--bg-card);
            color: var(--text-normal);
            font-family: inherit;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background-color: var(--bg-card);
            border: 2px solid var(--shadow-border);
            border-radius: 4px;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            margin-right: 8px;
        }

        input[type="checkbox"]:checked {
            background-color: #5E499C;
            border-color: #5E499C;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: var(--bg-modal);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .container {
            max-width: 500px;
            min-height: min(400px);
            padding: 0px !important;
            width: 640px;
            height: auto;
            background: var(--bg-modal);
            border-radius: var(--radius-modal);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 0 1px var(--shadow-border), 0 3px 24px rgba(0, 0, 0, 0.25);
        }

        .scrollable-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px !important;
            scrollbar-width: none;
            scrollbar-color: var(--btn-gray) transparent;
        }

        h1 {
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 16px;
            margin-top: 4px;
            color: var(--text-header);
            font-weight: 700;
        }

        .description {
            line-height: 1.45;
            margin: 0 0 16px 0;
            font-weight: 400;
            font-size: 14px;
            color: var(--text-normal);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            margin-bottom: 21px;
        }

        .field {
            margin-bottom: 0;
        }

        .card .field:last-child {
            margin-bottom: 0;
        }

        .label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-header);
            margin-bottom: 2px;
        }

        .value {
            display: block;
            font-size: 14px;
            color: var(--text-normal);
            line-height: 1.35;
        }

        #evidence-divider {
            display: block;
            border-bottom: 1px solid var(--shadow-border);
            margin: 10px 0px;
        }

        .btn-view-more {
            max-height: 28px !important;
            height: 28px;
            display: block;
            width: 100%;
            background: var(--btn-gray);
            color: var(--text-header);
            border: none;
            border-radius: var(--radius-btn);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            pointer-events: auto;
        }

        .btn-view-more:hover {
            background: var(--btn-gray-hover);
        }

        .trace-id {
            margin-top: 0px !important;
            font-size: 12px;
            padding-bottom: 0px !important;
            margin-left: 2px;
            color: var(--text-trace);
            font-weight: 500;
        }

        .footer {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            padding: 18px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-modal);
            border-bottom-left-radius: var(--radius-modal);
            border-bottom-right-radius: var(--radius-modal);
        }

        .btn-report {
            background: rgb(94, 73, 156);
            color: rgb(255, 255, 255);
            border: medium;
            pointer-events: auto;
            width: 100%;
            height: 35px!important;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
            font-weight: 450;
        }

        .btn-report:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.67);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-modal);
            border-radius: var(--radius-modal);
            padding: 20px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 0 1px var(--shadow-border), 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-header);
            margin-bottom: 10px;
        }

        .modal-description {
            font-size: 15px;
            color: var(--text-normal);
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .modal-textarea {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--shadow-border);
            background: var(--bg-modal);
            color: var(--text-normal);
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .modal-button {
            flex: 1;
            height: 40px;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .modal-button.cancel {
            background: var(--btn-gray);
            color: var(--text-header);
        }

        .modal-button.cancel:hover {
            background: var(--btn-gray-hover);
        }

        .modal-button.send {
            background: #5E499C;
            color: #ffffff;
        }

        .modal-button.send:hover {
            opacity: 0.9;
        }

        .modal-subtext {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.3;
            margin-top: 15px;
        }

        @media (max-width: 640px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
            }
        }
    </style>
</head>
<body>

<button class="customizer-toggle" onclick="document.getElementById('side-panel').classList.toggle('open')">Settings</button>

<div class="modal-overlay" id="appeal-modal">
    <div class="modal-content">
        <div id="modal-form-view">
            <div class="modal-header" id="modal-header"></div>
            <div class="modal-description" id="modal-description"></div>
            <textarea class="modal-textarea" id="appeal-textarea" placeholder=""></textarea>
            <div class="modal-buttons">
                <button class="modal-button cancel" id="modal-cancel"></button>
                <button class="modal-button send" id="modal-send"></button>
            </div>
            <div class="modal-subtext" id="modal-subtext"></div>
        </div>
        <div id="modal-success-view" style="display: none;">
            <div class="modal-header" id="modal-success-header"></div>
            <div class="modal-description" id="modal-success-description"></div>
            <div class="modal-buttons">
                <button class="modal-button send" style="width: 100%;" id="modal-got-it"></button>
            </div>
        </div>
    </div>
</div>

<aside class="panel" id="side-panel">
    <h3>Edit Chat Suspension</h3>
    <div>
        <label>Duration</label>
        <select id="duration-select" onchange="handleDurationChange()">
            <option value="ChatBreaksRules">Warning</option>
            <option value="ChatSuspended10Minutes" selected>10 minutes</option>
            <option value="ChatSuspended1Hour" selected>1 hour</option>
            <option value="ChatSuspended6Hours">6 hours</option>
            <option value="ChatSuspended1Day">1 day</option>
            <option value="ChatSuspended3Days">3 days</option>
            <option value="ChatSuspended5Days">5 days</option>
            <option value="ChatSuspended7Days">7 days</option>
        </select>
    </div>
    <div id="enforcement-container" style="display: none;">
        <label style="display: flex; align-items: center; cursor: pointer; text-transform: none; font-size: 14px;">
            <input type="checkbox" id="enforcement-checkbox" onchange="updateContent()">
            Enforcement Ban
        </label>
    </div>
    <div id="reason-container">
        <label>Reason</label>
        <select id="reason-select" onchange="updateContent()">
            <option value="Other">Other</option>
            <option value="Harassment.V2">Bullying and Harassment</option>
            <option value="ExtortionThreats">Extortion and Threats</option>
            <option value="Spam">Spam</option>
            <option value="Scamming">Scamming</option>
            <option value="DiscriminationHate.V2">Discriminatory Content</option>
            <option value="SexualContent">Sexual Content</option>
            <option value="MisusingSystems">Misusing Boible Systems</option>
            <option value="PrivacyGivingPII">Privacy: Giving PII</option>
            <option value="PrivacyAskingPII">Privacy: Asking for PII</option>
            <option value="PoliticalContent.V2">Political Figures and Entities</option>
            <option value="Impersonation">Impersonation</option>
            <option value="ViolentGore">Violent Content and Gore</option>
            <option value="Misinformation">Misinformation</option>
            <option value="Dating.V2">Dating and Romantic Content</option>
            <option value="SensitiveEvents">Real-World Sensitive Events</option>
            <option value="TerrorismExtremism.V2">Terrorism and Extremism</option>
            <option value="ChildEndangerment.V3">Harmful Content/Behaviour</option>
        </select>
    </div>
    <div id="messages-section">
        <label>Chat Messages</label>
        <button class="btn-view-more" onclick="addMessage()">+ Add Message</button>
    </div>
    <div id="messages-container"></div>
</aside>

<div class="container">
    <div class="scrollable-body">
        <h1 style="font-size:24px; line-height: 1.6; margin-bottom: 16px;margin-top: 4px;" id="display-duration-title">Chat suspended for 1 hour</h1>
        <p class="description" id="display-desc" style="line-height: 1.45;margin: 0 0 16px 0;font-weight: 400;"></p>
        
        <div class="card" id="evidence-card" style="padding: 14px !important;">
            <span class="label" id="lbl-chat-static">Chat:</span>
            <div id="evidence-list-main"></div>
            <div id="evidence-divider" style="display: block; border-bottom: 1px solid var(--shadow-border); margin: 10px 0px;"></div>
            <div class="field">
                <span class="label" id="lbl-reason-static">Reason:</span>
                <span class="value" id="display-reason">Other</span>
            </div>
            <button class="btn-view-more" style="max-height: 30px !important;height: 28px;" id="view-more-btn" onclick="openAppealModal()">Report a mistake</button>
        </div>
        
        <div class="trace-id" id="display-trace" style="margin-top: -15px !important;font-size: 12px;padding-bottom: 0px !important;margin-left: 2px;"></div>
    </div>

    <div class="footer">
        <button class="btn-report" id="primary-action-btn" onclick="handleOKClick()" style="background: rgb(94, 73, 156); color: rgb(255, 255, 255); border: medium; pointer-events: auto;width: 100%;height: 36px;">OK</button>
    </div>
</div>

<script>
    let translations = null;
    let messages = [{ id: 1, text: 'chat message go here' }];

    async function init() {
        try {
            const res = await fetch('chat-en.json');
            translations = await res.json();
        } catch (e) {
            console.error("Translation load failed:", e);
            translations = {};
        }
        
        renderMessages();
        updateContent();
    }

    function t(key, vars = {}) {
        if (!translations) return key;
        let val = translations[key];
        if (val === undefined || val === null) return key;
        for (const k in vars) val = val.replace(`{{${k}}}`, vars[k]);
        return val;
    }

    function handleDurationChange() {
        const dur = document.getElementById('duration-select')?.value;
        const isPermanent = dur === 'ChatBanned';
        const enforcementContainer = document.getElementById('enforcement-container');
        const enforcementCheckbox = document.getElementById('enforcement-checkbox');
        
        if (isPermanent) {
            enforcementContainer.style.display = 'block';
        } else {
            enforcementContainer.style.display = 'none';
            enforcementCheckbox.checked = false;
        }
        
        updateContent();
    }

    function addMessage() {
        messages.push({ id: Date.now(), text: '' });
        renderMessages();
        updateContent();
    }

    function renderMessages() {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        
        messages.forEach((msg, index) => {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.gap = '8px';
            div.style.marginBottom = '10px';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.value = msg.text;
            input.placeholder = 'Message text';
            input.style.flex = '1';
            input.oninput = (e) => {
                messages[index].text = e.target.value;
                updateContent();
            };
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-view-more';
            removeBtn.innerText = 'Remove';
            removeBtn.style.width = '80px';
            removeBtn.onclick = () => {
                messages.splice(index, 1);
                renderMessages();
                updateContent();
            };
            
            div.appendChild(input);
            div.appendChild(removeBtn);
            container.appendChild(div);
        });
    }

    function updateContent() {
        const traceID = (self.crypto && self.crypto.randomUUID) ? self.crypto.randomUUID() : 'trace-' + Math.random().toString(16).slice(2);
        const dur = document.getElementById('duration-select')?.value || 'ChatSuspended1Hour';
        const reason = document.getElementById('reason-select')?.value || 'Other';
        const isPermanent = dur === 'ChatBanned';
        const isEnforcement = isPermanent && document.getElementById('enforcement-checkbox')?.checked;

        // Handle enforcement ban UI
        const messagesSection = document.getElementById('messages-section');
        const messagesContainer = document.getElementById('messages-container');
        const reasonContainer = document.getElementById('reason-container');
        const reasonSelect = document.getElementById('reason-select');
        
        if (isEnforcement) {
            messagesSection.style.display = 'none';
            messagesContainer.style.display = 'none';
            reasonContainer.style.display = 'none';
            reasonSelect.value = 'Other';
        } else {
            messagesSection.style.display = 'block';
            messagesContainer.style.display = 'block';
            reasonContainer.style.display = 'block';
        }

        document.getElementById('display-duration-title').innerText = t(`Heading.${dur}`);
        document.getElementById('display-reason').innerText = t(`Label.Reason.${isEnforcement ? 'Other' : reason}`);
        document.getElementById('display-trace').innerText = traceID;
        document.getElementById('lbl-reason-static').innerText = t('Label.Reason');
        document.getElementById('lbl-chat-static').innerText = t('Label.Chat');

        // Set description based on duration
        let descKey = '';
        let descVars = {};
        
        if (isPermanent) {
            descKey = 'Description.BrokeRulesChatBanned';
        } else if (dur === 'ChatSuspended1Hour') {
            descKey = 'Description.ChatSuspendedSingleHour';
        } else if (dur === 'ChatSuspended1Day') {
            descKey = 'Description.ChatSuspendedSingleDay';
        } else if (dur.includes('ChatBreaks')) {
            descKey = 'Description.ChatBreaksRulesWarning';
        } else if (dur.includes('Minutes')) {
            const minutes = dur.replace('ChatSuspended', '').replace('Minutes', '');
            descKey = 'Description.ChatSuspendedMultipleMinutes';
            descVars = { duration: minutes };
        } else if (dur.includes('Hours')) {
            const hours = dur.replace('ChatSuspended', '').replace('Hours', '');
            descKey = 'Description.ChatSuspendedMultipleHours';
            descVars = { duration: hours };
        } else if (dur.includes('Days')) {
            const days = dur.replace('ChatSuspended', '').replace('Days', '');
            descKey = 'Description.ChatSuspendedMultipleDays';
            descVars = { duration: days };
        }

        document.getElementById('display-desc').innerText = t(descKey, descVars);

        // Render messages or enforcement details
        const list = document.getElementById('evidence-list-main');
        const chatLabel = document.getElementById('lbl-chat-static');
        list.innerHTML = '';
        
        if (isEnforcement) {
            // Show enforcement ban details
            chatLabel.style.display = 'none';
            
            const detailsField = document.createElement('div');
            detailsField.className = 'field';
            const detailsLabel = document.createElement('span');
            detailsLabel.className = 'label';
            detailsLabel.innerText = t('Label.Details');
            const detailsValue = document.createElement('span');
            detailsValue.className = 'value';
            detailsValue.innerText = t('Label.AltConsequence');
            detailsField.appendChild(detailsLabel);
            detailsField.appendChild(detailsValue);
            list.appendChild(detailsField);
        } else if (messages.length > 0) {
            // Show chat messages
            chatLabel.style.display = 'block';
            messages.forEach(msg => {
                const field = document.createElement('div');
                field.className = 'field';
                const value = document.createElement('span');
                value.className = 'value';
                value.innerText = msg.text || 'chat message go here';
                field.appendChild(value);
                list.appendChild(field);
            });
        } else {
            // No messages - hide chat label
            chatLabel.style.display = 'none';
        }

        document.getElementById('evidence-divider').style.display = (messages.length > 0 || isEnforcement) ? 'block' : 'none';
        document.getElementById('view-more-btn').innerText = t('Action.ReportMistake');
        document.getElementById('primary-action-btn').innerText = t('Action.OK');
    }

    function openAppealModal() {
        const modal = document.getElementById('appeal-modal');
        const formView = document.getElementById('modal-form-view');
        const successView = document.getElementById('modal-success-view');
        const textarea = document.getElementById('appeal-textarea');
        
        formView.style.display = 'block';
        successView.style.display = 'none';
        textarea.value = '';
        
        document.getElementById('modal-header').innerText = t('Heading.Appeals.RequestAppeal');
        document.getElementById('modal-description').innerText = t('Description.Appeals.ReviewsDetail');
        textarea.placeholder = t('Label.Appeals.ReasonPlaceholder.V2');
        document.getElementById('modal-cancel').innerText = t('Action.Appeals.Cancel');
        document.getElementById('modal-send').innerText = t('Action.Appeals.Send');
        document.getElementById('modal-subtext').innerText = t('Label.Appeals.SubtextNotice');
        
        modal.classList.add('active');
    }

    function closeAppealModal() {
        const modal = document.getElementById('appeal-modal');
        modal.classList.remove('active');
    }

    function sendAppeal() {
        const textarea = document.getElementById('appeal-textarea');
        const appealText = textarea.value.trim();
        
        const formView = document.getElementById('modal-form-view');
        const successView = document.getElementById('modal-success-view');
        
        formView.style.display = 'none';
        successView.style.display = 'block';
        
        document.getElementById('modal-success-header').innerText = t('Heading.Appeals.AppealReceived');
        document.getElementById('modal-success-description').innerText = t('Description.Appeals.AppealReceived');
        document.getElementById('modal-got-it').innerText = t('Action.Appeals.GotIt');
        
        console.log('Appeal sent:', appealText);
    }

    function handleOKClick() {
        console.log('OK clicked - suspension acknowledged');
    }

    document.getElementById('modal-cancel').onclick = closeAppealModal;
    document.getElementById('modal-send').onclick = sendAppeal;
    document.getElementById('modal-got-it').onclick = closeAppealModal;

    init();
</script>

</body>
</html>
