<!DOCTYPE html>
<html>
<head>
   <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
   <title>Admin</title>
   <style>
      body { font-family: Verdana, sans-serif; font-size: 8.5pt; background: #f0f0f0; margin: 10px; }
      h2 { font-size: 11pt; margin-bottom: 5px; }
      label { display: block; margin-top: 8px; font-weight: bold; }
      input[type=text], input[type=datetime-local], select, textarea {
         font-family: Verdana, sans-serif; font-size: 8.5pt;
         border: 1px solid #aaa; padding: 2px 4px;
      }
      textarea { width: 350px; height: 50px; resize: vertical; }
      .section { border: 1px solid #999; background: #fff; padding: 10px; margin-bottom: 10px; max-width: 600px; }
      .utterance-row { border: 1px solid #ccc; padding: 6px; margin-top: 6px; background: #f8f8f8; }
      .utterance-row label { font-weight: normal; display: inline; }
      button { font-family: Verdana, sans-serif; font-size: 8.5pt; cursor: pointer; }
      #removeUtteranceBtns button { margin-left: 4px; }
      #status { margin-top: 8px; font-weight: bold; color: green; }
      #status.error { color: red; }
      .disabled-note { color: #888; font-size: 7.5pt; }
      hr { border: none; border-top: 1px solid #aaa; margin: 10px 0; }
      #savedList { font-size: 8pt; max-width: 700px; }
      #savedList table { border-collapse: collapse; width: 100%; }
      #savedList td, #savedList th { border: 1px solid #ccc; padding: 3px 6px; text-align: left; }
      #savedList th { background: #e0e0e0; }
   </style>
   <script src="https://boiby.dev/2009/Admin.js"></script>
</head>
<body>

<h2>ROBLOX Administration</h2>
<hr>

<div class="section">
   <b>Action Type</b><br>
   <label style="color:#888;"><input type="radio" name="punishmentType" value="Remind" disabled> <span style="color:#888;">Remind</span></label>
   <label style="color:#888;"><input type="radio" name="punishmentType" value="Warn" disabled> <span style="color:#888;">Warn</span></label>
   <label><input type="radio" name="punishmentType" value="Ban 1 Day"> Ban 1 Day</label>
   <label><input type="radio" name="punishmentType" value="Ban 3 Days"> Ban 3 Days</label>
   <label><input type="radio" name="punishmentType" value="Ban 7 Days"> Ban 7 Days</label>
   <label><input type="radio" name="punishmentType" value="Ban 14 Days"> Ban 14 Days</label>
   <label><input type="radio" name="punishmentType" value="Delete"> Delete</label>
   <label><input type="radio" name="punishmentType" value="Poison"> Poison</label>
</div>

<div class="section">
   <b>Date &amp; Time</b><br>
   <span class="disabled-note">Leave blank for random date between March 2009 to July 2010</span><br><br>
   <label style="font-weight:normal; display:inline;">
      <input type="checkbox" id="useRandomDate" checked> Use random date/time
   </label><br><br>
   <div id="datePickerWrap" style="display:none;">
      <input type="datetime-local" id="customDate"
         min="2009-03-12T00:00"
         max="2010-07-31T23:59">
      <span class="disabled-note">&nbsp;(March 12 2009 - July 31 2010)</span>
   </div>
</div>

<div class="section">
   <b>Moderator Note</b><br>
   <span class="disabled-note">Leave blank for no note</span><br>
   <textarea id="modNote" placeholder="e.g. Don't talk about inappropriate topics on ROBLOX."></textarea>
</div>

<div class="section">
   <b>Utterances</b><br>
   <div id="utterancesContainer"></div>
   <br>
   <button type="button" onclick="addUtterance()">+ Add Utterance</button>
</div>

<div class="section">
   <button type="button" onclick="submitAction()"><b>Apply Action</b></button>
   <div id="status"></div>
</div>

<hr>
<div class="section">
   <b>Saved Punishments</b> &nbsp;<button type="button" onclick="renderSavedList()">Refresh</button> &nbsp;<button type="button" onclick="clearAll()">Clear All</button>
   <div id="savedList" style="margin-top:8px;"></div>
</div>

<script src="roblox-admin.js"></script>
</body>
</html>
