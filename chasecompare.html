<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chase Layout Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    button {
      padding: 8px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button.active {
      background: #007bff;
    }

    select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .image-container {
      width: 1400px;
      height: 1200px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <h1>Chatswood Chase Comparison</h1>

  <div class="controls">
    <button id="oldBtn" class="active">Old (2009)</button>
    <button id="newBtn">New (2025)</button>
    <button id="scrappedBtn">Scrapped 2018</button>
    <button id="old96Btn">Old 1996</button>

    <select id="floorSelect">
      <option value="LG">LG</option>
      <option value="G">G</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>
  </div>

  <div class="image-container">
    <img id="mapImage" src="mall/LG-2009.png" alt="Mall Map" />
  </div>

  <script>
    const oldBtn = document.getElementById('oldBtn');
    const newBtn = document.getElementById('newBtn');
    const scrappedBtn = document.getElementById('scrappedBtn');
    const old96Btn = document.getElementById('old96Btn');

    const floorSelect = document.getElementById('floorSelect');
    const mapImage = document.getElementById('mapImage');

    const floors = ['LG', 'G', '1', '2', '3'];

    const modes = {
      old: '2009',
      new: '2025',
      scrapped: '2018',
      old96: '1996'
    };

    // Preload all images
    Object.values(modes).forEach(year => {
      floors.forEach(floor => {
        const img = new Image();
        img.src = `mall/${floor}-${year}.png`;
      });
    });

    let mode = 'old';

    function updateImage() {
      const floor = floorSelect.value;
      const year = modes[mode];
      mapImage.src = `mall/${floor}-${year}.png`;
    }

    function setActive(button) {
      [oldBtn, newBtn, scrappedBtn, old96Btn].forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    oldBtn.addEventListener('click', () => {
      mode = 'old';
      setActive(oldBtn);
      updateImage();
    });

    newBtn.addEventListener('click', () => {
      mode = 'new';
      setActive(newBtn);
      updateImage();
    });

    scrappedBtn.addEventListener('click', () => {
      mode = 'scrapped';
      setActive(scrappedBtn);
      updateImage();
    });

    old96Btn.addEventListener('click', () => {
      mode = 'old96';
      setActive(old96Btn);
      updateImage();
    });

    floorSelect.addEventListener('change', updateImage);
  </script>
</body>
</html>
