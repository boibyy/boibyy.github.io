<html lang="en"><head><style>body {transition: opacity ease-in 0.2s; } 
body[unresolved] {opacity: 0; display: block; overflow: hidden; position: relative; } 
</style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boiby</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #111114; --bg-modal: #191a1f; --bg-card: #272930;
            --btn-gray: #333640; --btn-gray-hover: #444757; --btn-blue: #5865f2; 
            --btn-blue-hover: #4752c4; --text-header: #f2f3f5; --text-normal: #dbdee1;
            --text-muted: #949ba4; --text-trace: #828791; --danger: #da373c;
            --shadow-border: rgba(90, 90, 90, 0.33); --radius-modal: 16px;
            --radius-card: 10px; --radius-btn: 8px; --panel-bg: #1e1f22;
            --btn-gray2: #33364029; --btn-gray-hover2: #44475741
        }
        body.light-mode {
            --bg-base: #e1e1e1; --bg-modal: #f7f7f8; --bg-card: #e9ebed;
            --btn-gray: #d7d7db; --btn-gray-hover: #d1d3d7; --text-header: #343434;
            --text-normal: #343434; --text-muted: #4f5660; --text-trace: #9598a0;
            --shadow-border: rgba(200,200,200, 0.4); --panel-bg: #f9f9f9;
            --btn-gray2: #d7d7db4d; --btn-gray-hover2: #d1d3d74d
        }

        body { 
            margin: 0; 
            background: var(--bg-base); 
            color: var(--text-normal); 
            font-family: 'gg sans', 'Roboto', 'Helvetica Neue', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            transition: background 0.2s ease; 
            /* Remove overflow: hidden from body to prevent layout locking */
        }
        
.container { 
    width: 640px; 

    min-height: min(720px, 90vh); 

    height: auto;

    max-height: 90vh;

    background: var(--bg-modal); 
    border-radius: var(--radius-modal); 
    box-sizing: border-box; 
    
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
    
    position: relative; 
    box-shadow: 0 0 0 1px var(--shadow-border), 0 3px 24px rgba(0, 0, 0, 0.25); 
    
    overflow-y: auto; 
}
        
        /* MODIFICATION: Hidden Settings on Mobile */
        .customizer-toggle { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: var(--btn-blue); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        @media (max-width: 768px) {
            .customizer-toggle {
                opacity: 0;
                width: 40px;
                height: 40px;
                padding: 0;
                left: 5px;
                bottom: 5px;
            }
            .customizer-toggle:active, .customizer-toggle:focus {
                opacity: 0.25;
            }
        }

        @media (max-width: 550px) {
    #icon-holder, 
    .dots {
        display: none !important;
    }

    .header {
        display: block;
        
        width: 100vw; 
        
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;

        margin-bottom: 22px!important;
        border-bottom: 1px solid grey;
        box-sizing: border-box;
        
        padding: 0 22px; 
        
        text-align: center;
    }

    .title-group {
        display: block;
        text-align: center;
        margin-top: -5px;
        margin-left: auto!important;
        margin-right: auto!important;
    }

    h1 {
        display: block!important;
        text-align: center!important;
        line-height: 1!important;
        
        margin-bottom: 16px!important;
        margin-top: 0!important;
    }
}


        .panel { position: fixed; left: -320px; top: 0; width: 300px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--shadow-border); z-index: 999; padding: 20px; box-sizing: border-box; transition: left 0.3s ease; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .panel.open { left: 0; }
        .panel h3 { margin: 0; font-size: 18px; color: var(--text-header); }
        .panel label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .panel select, .panel input, .panel textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--shadow-border); background: var(--bg-card); color: var(--text-normal); font-family: inherit; margin-bottom: 10px; }
        

        .scrollable-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--btn-gray) transparent;
        }

        body.light-mode .container {
            box-shadow: 0 0 0 1px var(--shadow-border), 0 3px 24px rgba(200,200,200, 0.25); 
        }

        #main-view, #rules-view {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .footer { 
            flex-shrink: 0;
            display: flex; 
            justify-content: flex-end; 
            padding: 20px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-modal);
            border-bottom-left-radius: var(--radius-modal);
            border-bottom-right-radius: var(--radius-modal);
        }

        .btn-view-more, .btn-report-inner {
            font-size: 13px !important;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; margin-top: 1px}
        .title-group { display: flex; align-items: center; gap: 12px; }
        .icon-container { width: 22px; height: 22px; position: relative; display: flex; align-items: center; justify-content: center; }
        .ban-icon { width: 22px; height: 22px; border: 2px solid var(--danger); border-radius: 50%; box-sizing: border-box; position: relative; }
        .ban-icon::after { content: ''; position: absolute; width: 2px; height: 100%; background: var(--danger); top: 0; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .svg-icon { width: 26px; height: 26px; }
        h1 { color: var(--text-header); font-size: 20px; font-weight: 700; margin: 0; line-height: 2.4; }
        .dots { color: var(--text-header); font-size: 20px; margin-right: 6px; cursor: pointer; line-height: 1; }
        .description { font-size: 14px; color: var(--text-normal); margin: 0 0 22px 0; line-height: 1.35; }
        h2 { font-size: 15.5px; font-weight: 700; color: var(--text-header); margin: 0 0 9px 0; }
        .card { background: var(--bg-card); border-radius: var(--radius-card); padding: 14px; margin-bottom: 20px; border: 1px rgba(0, 0, 0, 0.03); }
        .field { margin-bottom: 10px; }
        .card .field:last-child { margin-bottom: 0; }
        .label { display: block; font-weight: 700; font-size: 14px; color: var(--text-header); margin-bottom: 2px; }
        .value { display: block; font-size: 14px; color: var(--text-normal); line-height: 1.35; }
        .btn-view-more { display: block; width: 100%; background: var(--btn-gray); color: var(--text-header); border: none; padding: 8.5px 0; border-radius: var(--radius-btn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }
        .trace-id { font-size: 13px; color: var(--text-trace); margin-top: -13px; font-weight: 500; padding-bottom: 20px; }
        .btn-report { background-color: #335fff75; color: #ffffff; border: none; padding: 0px 12px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
        body.light-mode .btn-report { background-color: #335fff; }
        #evidence-overflow { display: none; }

        /* Media query for mobile screens */
/* Mobile-specific overrides */
@media (max-width: 640px) {

    .footer {
        flex-direction: column; 
        gap: 10px;
    }

    #footer-main-buttons {
        flex-direction: column;
        width: 100%;
    }

    .container {
        width: 100%;
        height: 100vh;
        border-radius: 0; 
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }

    .btn-report {
        width: 100%;       /* Button goes full width */
        box-sizing: border-box;
    }
}

.btn-logout {
    background-color: var(--btn-gray2);
    border: none;
    margin-top: 8px;
    cursor: pointer;
    color: #eeeeee; border: none; padding: 0px 12px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s;
}

body.light-mode .btn-logout {
    background-color: var(--btn-gray2);
    border: none;
    margin-top: 8px;
    cursor: pointer;
    color: #111111; border: none; padding: 0px 12px; height: 40px; border-radius: var(--radius-btn); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s;
}

.btn-logout:hover {
    background-color: var(--btn-gray-hover2);
}

@media (max-width: 550px) {
    .btn-logout {
        display: block;
        width: 100%;
        box-sizing: border-box;
    }
}

    </style>
</head>
<body id="main-body" class="light-mode">

<h1>Your account is in good standing.</h1>

</body></html>
